<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>세미나 RSVP 관리</title>
<link rel="icon" type="image/png" href="/favicon-seminar-poster.png"><link rel="apple-touch-icon" href="/favicon-seminar-poster.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --acc:#7C5CFF; --acc-soft:#EDE9FF; --or:#ff4b00;
  --ink:#16181d; --tx:#2b2f37; --tx2:#5d6370; --tx3:#8b909b;
  --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --line2:#d1d5db;
  --yes:#14804a; --yes-bg:#e7f6ee; --no:#4b5563; --no-bg:#eef0f3; --pd:#a15c00; --pd-bg:#fff4e0; --err:#d93025;
  --f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:800;color:var(--ink)}
.sub{color:var(--tx2);font-size:12.5px;margin-top:2px}
.state{font-size:12px;color:var(--tx3)}
.state b{color:var(--yes)} .state b.bad{color:var(--err)}
.btn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.kpi .l{font-size:12px;color:var(--tx2);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--tx2);margin-left:4px}
.kpi .d{font-size:11.5px;color:var(--tx3);margin-top:2px}
.prog{height:6px;border-radius:99px;background:#e9eaee;overflow:hidden;display:flex;margin-top:12px}
.prog i{display:block;height:100%}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:14px;font-weight:700;color:var(--ink)}
.search{height:34px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;min-width:220px;outline:none}
.seg{display:inline-flex;background:#f1f2f4;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search:focus{border-color:var(--acc)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;color:var(--tx3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f1f3;vertical-align:top}
.tbl tr.g:hover td{background:#fafafb}
.tbl tr.g{cursor:pointer}
.nm{font-weight:700;color:var(--ink)}
.org{color:var(--tx2);font-size:12px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.t-vip{background:#16181d;color:#fff}
.t-sub{background:#fff1ea;color:#c23c00}
.t-chg{background:var(--acc-soft);color:#5B44C7}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.yes{background:var(--yes-bg);color:var(--yes)} .st.no{background:var(--no-bg);color:var(--no)} .st.pending{background:var(--pd-bg);color:var(--pd)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--tx3);font-size:12px}
.comps{color:var(--tx2);font-size:12px;max-width:340px}
.lk{border:0;background:none;color:var(--acc);font-weight:600;font-size:12px;padding:2px 0;margin-right:8px}
.lk:hover{text-decoration:underline}

.ed td{background:#fafaff;padding:14px 16px}
.edg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
.edg label{display:block;font-size:11px;color:var(--tx2);font-weight:600}
.edg input,.edg select,.edg textarea{width:100%;height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 9px;background:#fff;margin-top:2px;outline:none}
.edg textarea{height:auto;padding:7px 9px;resize:vertical}
.edg input:focus,.edg select:focus,.edg textarea:focus{border-color:var(--acc)}
.full{grid-column:1/-1}
.ehead{font-size:12px;font-weight:700;color:var(--ink);margin:12px 0 6px}
.logs{font-size:11.5px;color:var(--tx2);margin-top:10px;line-height:1.7}

.modal{position:fixed;inset:0;background:rgba(15,17,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.modal h3{font-size:16px;font-weight:800;color:var(--ink)}
.modal p{color:var(--tx2);font-size:12.5px;margin-top:4px}
.modal textarea{width:100%;height:120px;border:1px solid var(--line2);border-radius:10px;padding:10px;margin-top:10px;font-size:12.5px}
.prev{margin-top:12px;font-size:12.5px;background:#f6f7f9;border-radius:10px;padding:10px 12px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.warn{background:#fff4e0;border:1px solid #f3d29a;color:#7a4a00;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:12px}
.empty{padding:40px;text-align:center;color:var(--tx3)}
[hidden]{display:none!important}
.tlb{padding:12px 14px 10px}
.tlsum{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.tlsum b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;margin-right:2px}
.tlsum i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.tlc{position:relative;margin-top:8px}
.tlc svg{display:block;width:100%;height:220px;overflow:visible}
.tlc text{font-size:10.5px;fill:var(--tx3);font-family:var(--f)}
.tltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .edg{grid-template-columns:1fr 1fr} .hide-m{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>세미나 RSVP 관리</h1>
      <p class="sub">SMART HOME INTERIOR 2026 · 개인별 링크로 참석·불참·동행인을 직접 고치게 하고, 결과를 여기서 모아 봅니다.</p>
      <p class="state" id="state">불러오는 중…</p>
    </div>
    <div class="tools">
      <button class="btn pri" id="btnCommon" title="모두에게 같은 링크 — 열면 '성함이 어떻게 되시나요?'부터 시작해 명단에서 찾아 본인/동행인 화면으로">🔗 공통 링크 복사 <span style="opacity:.75;font-weight:500">hakdongmap.kr/rsvp</span></button>
      <label class="btn" style="display:inline-flex;align-items:center">명단 엑셀 가져오기<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></label>
      <label class="btn" style="display:inline-flex;align-items:center" title="이벤터스 참가자 리스트(참석/불참 상태) 또는 '참석 확정 여부 · 발송 여부' 열이 있는 담당자 정리 엑셀 — 이벤터스 응답·발송 문제를 기존 그룹에 반영(새 그룹은 안 만듦)">현황 엑셀 반영<input type="file" id="fileSt" accept=".xlsx,.xls" hidden></label>
      <label class="btn" style="display:inline-flex;align-items:center" title="설문 응답 엑셀(성함·연락처·이메일)의 이메일로 명단 이메일을 맞춤 — 미리보기 후 저장">설문 이메일 반영<input type="file" id="fileEm" accept=".xlsx,.xls" hidden></label>
      <button class="btn" id="btnLinks">링크·문자 추출</button>
      <button class="btn" id="btnSentAt" title="외부 도구(이벤터스 등)로 문자를 보낸 시각을 명단 전체의 '마지막 문자 전송'으로 기록">마지막 문자 시각 입력</button>
      <button class="btn" id="btnXlsx" title="요약 · 응답 현황(그룹별) · 참석 확정 · 전체(사람별) · 개인 링크">응답 현황 엑셀</button>
      <button class="btn" id="btnCsv">.csv</button>
      <button class="btn" id="btnEventus" title="참석 확정자만, 이벤터스 '참가자리스트 엑셀 등록하기' 양식">이벤터스 등록 양식</button>
      <button class="btn" id="btnEventusLink" title="그룹마다 대표자 한 줄(동행인 행 없음, 불참 포함)을 이벤터스 엑셀 등록 양식으로 — 직함 = 실제 직책, 동행인이 있으면 그룹명 '동행인 있음', 휴대전화·이메일이 없거나 겹치면 017 가상번호·@aqara.kr 임시 주소">이벤터스 등록용(대표자)</button>
      <button class="btn" id="btnClose"></button>
      <button class="btn danger" id="btnReset" title="모든 응답을 미응답으로 되돌림(링크는 유지)">응답 초기화</button>
      <button class="btn" id="btnReload" title="30초마다 자동으로 새로 불러와요">새로고침</button>
    </div>
  </div>

  <div class="tools" style="margin-top:14px;justify-content:space-between">
    <div class="seg" id="viewSeg"></div>
    <button class="btn pri" id="btnAdd">+ 직접 입력</button>
  </div>
  <div id="warn"></div>
  <div class="kpis" id="kpis"></div>
  <div class="panel tl" id="tl" hidden><div class="ph"><h2 id="tlTitle">응답 타임라인</h2><div class="seg" id="tlSeg"></div></div><div class="tlb"><div class="tlsum" id="tlSum"></div><div class="tlc" id="tlChart"></div></div></div>

  <div class="panel">
    <div class="ph">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h2 id="listTitle">전체</h2><div class="seg" id="seg"></div><button class="btn" id="btnTabXlsx" title="지금 고른 탭(전체/동행인 있음/혼자 참석)과 위 카드 필터·검색 결과만 엑셀로">이 탭 엑셀 받기</button></div>
      <input class="search" id="q" placeholder="이름·소속·연락처·동행인 검색">
    </div>
    <div style="overflow:auto;max-height:72vh">
      <table class="tbl">
        <thead><tr><th>초대받은 분</th><th>연락처 · 이메일</th><th class="hide-m">초청 경로</th><th>상태</th><th>등록일시</th><th>마지막 문자 전송</th><th>링크 열람</th><th>인원</th><th class="hide-m">동행인 / 대리</th><th>마지막 변경</th><th>링크</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone = (v) => { const d = String(v || '').replace(/\D/g, '');
  if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if(d.length === 10) return d.startsWith('02') ? d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3') : d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  return d; };
// 내보내기용 번호: 하이픈·빈칸 없이 숫자만(이벤터스 규칙, 2026-10-30 요청). 10으로 시작하는 10자리는 앞 0이 빠진 것이라 010으로 고친다
const telDigits = (v) => { const d = String(v || '').replace(/\D/g, ''); return /^10\d{8}$/.test(d) ? '0' + d : d; };
const fmtTime = (ms) => { if(!ms) return ''; const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const ST = { yes: '참석', no: '불참', pending: '미응답' };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2200); }

let G = {}, META = {}, LOG = {}, FILTER = 'all', COMP = 'all', OPEN = '', EDITING = false;
// 동행인 탭: 명단에 동행인을 적었던 그룹(지금 다 뺐어도 포함) / 혼자 오는 그룹
const withComps = (g) => (g.comps || []).length > 0 || ((g.orig && g.orig.n) || 1) > 1;
// 명단 인원 = 본인 + (처음 명단 동행인 ∪ 지금 동행인). 불참으로 고른 동행인도 명단엔 남는다(2026-11-02: 614명이 608명으로 보인다는 지적)
const rosterN = (g) => 1 + new Set([...String((g.orig && g.orig.comps) || '').split(', ').map(s => s.trim()).filter(Boolean), ...(g.comps || []).map(c => c.from || c.name)]).size;
// 손님에게 보내는 링크는 짧은 도메인(2026-10-30, 이벤터스 직함 칸 길이 제한). middleware가 hakdongmap.kr/r/ 도 RSVP로 보낸다
// → 다시 더 짧게: https://hakdongmap.kr/<토큰 앞 6자> (28자). 앞 6자가 겹치는 그룹이 있으면 그 그룹만 긴 주소로.
const linkOf = (t) => {
  const k = t.slice(0, 6), dup = Object.keys(G).some(x => x !== t && x.slice(0, 6) === k);
  return dup ? 'https://hakdongmap.kr/r/' + t : 'https://hakdongmap.kr/' + k;   // 28자(이벤터스 개인화 변수 영문 30자 제한)
};
// 동행인 개인 링크(2026-11-04): https://hakdongmap.kr/c/<7자> — 서버가 목록에 g.clinks{자리 이름: 코드}로 준다
const slotOf = (c) => (c && (c.from || c.name)) || '';
const clinkOf = (g, slot) => (g.clinks && g.clinks[slot]) ? 'https://hakdongmap.kr/c/' + g.clinks[slot] : linkOf(g.t);
const byLabel = (g) => g.updatedBy === 'guest' ? '본인' : (g.updatedBy === 'guest-comp' ? '동행인 본인' : (g.updatedBy || ''));

async function api(body){
  const r = await fetch('/api/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
async function load(){
  try{
    const r = await fetch('/api/rsvp?op=list', { cache: 'no-store' });
    const j = await r.json();
    if(!j.ok){ $('#state').innerHTML = `<b class="bad">${esc(j.error || '불러오기 실패')}</b>`; return; }
    G = j.groups || {}; META = j.meta || {}; LOG = j.log || {};
    $('#state').innerHTML = `${esc(j.email)} · 개인정보 보호 ${j.locked === true ? '<b>정상(암호화 저장)</b>' : '<b class="bad">확인 필요</b>'} · ${fmtTime(Date.now())} 기준`;
    paint();
  }catch(e){ $('#state').innerHTML = '<b class="bad">연결 실패</b>'; }
}

// 응답 뒤 '바뀐 것' 판정: 대리 참석, 또는 동행인 명단이 처음과 다름
function changed(g){
  if(g.sub && g.sub.name) return true;
  const now = (g.comps || []).map(c => c.name).join(', ');
  return !!g.answeredAt && g.orig && now !== (g.orig.comps || '');
}
// 참석 인원 = 본인(참석일 때) + 참석으로 고른 동행인. 본인이 불참이어도 동행인만 올 수 있다(2026-10-29 손님 화면 변경).
const answered = (g) => g.status === 'yes' || g.status === 'no';
const heads = (g) => (g.status === 'yes' ? 1 : 0) + (answered(g) ? (g.comps || []).length : 0);
// 그룹 상태: 미응답 / 참석(한 명이라도 옴) / 불참(아무도 안 옴)
const gst = (g) => !answered(g) ? 'pending' : (heads(g) > 0 ? 'yes' : 'no');
const stLabel = (g) => g.status === 'no' && heads(g) > 0 ? '동행만 참석' : ST[gst(g)];
// VIEW: 'real' = 실제 명단 / 'test' = 테스트 탭. 테스트 그룹(g.test)은 실제 통계·목록·내보내기·이벤터스에서 빠진다.
let VIEW = 'real';
const allGroups = () => Object.keys(G).map(t => Object.assign({ t }, G[t])).filter(g => g.rep);
function list(){ return allGroups().filter(g => !!g.test === (VIEW === 'test')); }
// 문자 발송(sent: 담당자가 '보냄'으로 표시) · 링크 열람(open: 손님이 링크를 연 기록)
const isSent = (g) => !!(g.sent && g.sent.at);
// 새 신청 = 마지막 전체 발송(2026-11-03 11:09) 뒤에 명단에 들어온 그룹. 탭은 사용자 요청으로 없앴고(대신 '등록일시' 열), 이벤터스 가져오기에서 동행인 붙일 그룹 찾을 때만 쓴다.
// 등록 경로: g.regBy(서버가 등록 때 기록). 예전 그룹은 addedBy 있으면 수기, 아니면 처음 명단 엑셀.
const regLabel = (g) => g.regBy || (g.addedBy ? '수기 등록' : '엑셀 등록');
const NEW_SINCE = new Date('2026-11-03T11:09:00+09:00').getTime();
const isNew = (g) => (g.created || 0) > NEW_SINCE;
const isOpen = (g) => !!(g.open && g.open.first);
const sentPend = (g) => isSent(g) && gst(g) === 'pending';   // 보냈는데 아직 응답 없음 → 재발송·전화 대상

// 사람 단위 상태(2026-11-05: 총 대상 − 참석 ≠ 미응답 지적) — 명단 인원(rosterN) 전원을 참석/불참/미응답 중 정확히 하나로 센다.
//  본인(또는 대리) = 그룹 응답 · 동행인 = 자기 링크 응답(cans)이 있으면 그것, 없으면 지금 명단에 있으면 그룹 응답(미응답 그룹이면 미응답), 명단에서 빠졌으면 불참
function pcount(g){
  const ans = answered(g), cans = g.cans || {}, cur = new Set((g.comps || []).map(slotOf));
  const slots = new Set([...String((g.orig && g.orig.comps) || '').split(', ').map(s => s.trim()).filter(Boolean), ...cur]);
  const r = { y: 0, n: 0, p: 0, yr: 0 };
  if(!ans) r.p++; else if(g.status === 'yes'){ r.y++; r.yr++; } else r.n++;
  slots.forEach(s => { const a = cans[s];
    if(a && (a.v === 'yes' || a.v === 'no')) r[a.v === 'yes' ? 'y' : 'n']++;
    else if(!cur.has(s)) r.n++;
    else if(ans) r.y++;
    else r.p++; });
  return r;
}
function stats(){
  const L = list(); const s = { all: L.length, P: { all: 0, y: 0, n: 0, p: 0, yr: 0 }, yes: 0, yesN: 0, yesC: 0, yesR: 0, no: 0, pending: 0, pendN: 0, chg: 0, sent: 0, open: 0, sentPend: 0, sentPendOpen: 0 };
  L.forEach(g => {
    if(isSent(g)) s.sent++;
    if(isOpen(g)) s.open++;
    if(sentPend(g)){ s.sentPend++; if(isOpen(g)) s.sentPendOpen++; }
    if(gst(g) === 'pending' && isOpen(g)) s.pendOpen = (s.pendOpen || 0) + 1;
    if(gst(g) === 'yes'){ s.yes++; s.yesN += heads(g); s.yesC += (g.comps || []).length; if(g.status === 'yes') s.yesR++; }
    else if(gst(g) === 'no') s.no++;
    else { s.pending++; s.pendN += 1 + (g.comps || []).length; }
    if(changed(g)) s.chg++;
    const c = pcount(g); s.P.all += rosterN(g); s.P.y += c.y; s.P.n += c.n; s.P.p += c.p; s.P.yr += c.yr;
  });
  return s;
}

function paint(){
  const s = stats();
  const P = s.P, pct = (n) => P.all ? (n / P.all * 100) : 0;
  const k = (id, l, v, d) => `<button class="kpi ${FILTER === id ? 'on' : ''}" data-f="${id}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></button>`;
  // 네 칸 모두 '명' 기준: 총 대상 = 참석 확정 + 불참 + 미응답 (그룹 수는 아래 작은 글씨)
  $('#kpis').innerHTML =
    k('all', '총 대상', `${P.all}<small>명</small>`, `${s.all}그룹 · 응답 ${P.y + P.n}명(${P.all ? Math.round((P.y + P.n) / P.all * 100) : 0}%)`) +
    k('yes', '참석 확정', `${P.y}<small>명</small>`, `본인 ${P.yr} + 동행 ${P.y - P.yr} · ${s.yes}그룹`) +
    k('no', '불참', `${P.n}<small>명</small>`, `빠진 동행인 포함 · 전원 불참 ${s.no}그룹`) +
    k('pending', '미응답', `${P.p}<small>명</small>`, `${s.pending}그룹 · 그중 링크 열어봄 ${s.pendOpen || 0}`) +
    k('chg', '대리·동행인 변경', `${s.chg}<small>그룹</small>`, '처음 명단과 달라짐');
  $('#kpis').insertAdjacentHTML('beforeend', `<div class="full" style="grid-column:1/-1"><div class="prog">
      <i style="width:${pct(P.y)}%;background:var(--yes)"></i><i style="width:${pct(P.n)}%;background:#9ca3af"></i><i style="width:${pct(P.p)}%;background:#f3c26b"></i></div></div>`);
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = FILTER === b.dataset.f ? 'all' : b.dataset.f; OPEN = ''; paint(); });
  $('#btnClose').textContent = META.closed ? '응답 다시 열기' : '응답 마감';
  $('#btnClose').classList.toggle('danger', !META.closed);
  const nTest = allGroups().filter(g => g.test).length;
  $('#viewSeg').innerHTML = `<button class="${VIEW === 'real' ? 'on' : ''}" data-view="real">실제 명단 ${allGroups().length - nTest}</button><button class="${VIEW === 'test' ? 'on' : ''}" data-view="test">🧪 테스트 ${nTest}</button>`;
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { VIEW = b.dataset.view; FILTER = 'all'; COMP = 'all'; OPEN = ''; paint(); });
  // 테스트 탭에선 실제 명단용 버튼(가져오기·이벤터스·마감)을 숨기고, 초기화는 테스트 그룹만
  ['#btnEventus', '#btnEventusLink', '#btnClose', '#btnSentAt'].forEach(s => { $(s).style.display = VIEW === 'test' ? 'none' : ''; });
  $('#file').parentElement.style.display = VIEW === 'test' ? 'none' : 'inline-flex';
  $('#fileSt').parentElement.style.display = VIEW === 'test' ? 'none' : 'inline-flex';
  $('#fileEm').parentElement.style.display = VIEW === 'test' ? 'none' : 'inline-flex';
  $('#btnReset').textContent = VIEW === 'test' ? '테스트 응답 초기화' : '응답 초기화';
  $('#btnAdd').textContent = VIEW === 'test' ? '+ 테스트 대상 입력' : '+ 직접 입력';
  $('#warn').innerHTML = VIEW === 'test' ? `<div class="warn">🧪 <b>테스트 탭</b> — 여기서 만든 대상은 실제 명단·통계·엑셀·이벤터스 양식에 들어가지 않아요. <b>+ 테스트 대상 입력</b>으로 내 번호를 넣고 링크를 열어 손님 화면을 시험해 보세요.${META.closed ? ' (지금은 응답 마감 상태라 테스트 링크도 보기만 돼요)' : ''}</div>`
    : META.closed ? '<div class="warn">응답이 마감된 상태입니다. 손님은 링크에서 보기만 할 수 있어요.</div>'
    : (!s.all ?'<div class="warn">아직 명단이 없습니다. 오른쪽 위 <b>명단 엑셀 가져오기</b>로 RSVP 명단 파일(참석자 명단 시트)을 올려 주세요.</div>' : '');
  drawTimeline();
  paintRows();
}

// ── 응답 타임라인(2026-11-02) ── 손님이 링크로 처음 답한 시각 + 이벤터스 응답 시각(srcAt). 시각 없는 담당자 입력은 추이를 왜곡하므로 따로 숫자만.
let TLMODE = '';
function firstAnswers(){
  const out = []; let other = 0;
  list().forEach(g => {
    const gl = Object.values(LOG[g.t] || {}).filter(l => l && l.by === 'guest' && l.at).sort((a, b) => a.at - b.at)[0];
    const at = gl ? gl.at : (g.answeredAt || (g.updatedBy !== "guest" && answered(g) && g.srcAt) || 0), ev = !gl && !g.answeredAt && !!at;   // 이벤터스 응답은 이벤터스 응답 시각으로
    if(at) out.push({ at, yes: (gl ? gl.status : g.status) === 'yes' || (gl ? gl.n : heads(g)) > 0, n: gl ? gl.n : heads(g), name: g.rep.name, ev });
    else if(answered(g)) other++;
  });
  return { A: out.sort((a, b) => a.at - b.at), other };
}
function drawTimeline(){
  const { A, other } = firstAnswers(), box = $('#tl');
  box.hidden = !A.length && !other;
  if(box.hidden) return;
  const now = Date.now(), H = 3600e3, D = 24 * H;
  const span = A.length ? now - A[0].at : 0;
  const mode = TLMODE || (span > 3 * D ? 'day' : 'hour');
  $('#tlSeg').innerHTML = [['hour', '시간별'], ['day', '일별'], ['hod', '시간대(0~23시)']].map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-tl="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-tl]').forEach(b => b.onclick = () => { TLMODE = b.dataset.tl; drawTimeline(); });
  // 버킷 만들기
  const pad = (n) => String(n).padStart(2, '0'), B = [];
  if(mode === 'hod'){
    for(let h = 0; h < 24; h++) B.push({ k: h, l: h + '시', tip: `${h}:00–${h}:59 (전체 기간 합계)`, y: 0, n: 0, p: 0 });
    A.forEach(a => { const b = B[new Date(a.at).getHours()]; a.yes ? b.y++ : b.n++; b.p += a.n; });
  }else if(A.length){
    const step = mode === 'day' ? D : H;
    const floor = (ms) => { const d = new Date(ms); if(mode === 'day') d.setHours(0, 0, 0, 0); else d.setMinutes(0, 0, 0); return d.getTime(); };
    let t0 = floor(A[0].at); const t1 = floor(now);
    if(mode === 'hour' && (t1 - t0) / H > 167) t0 = t1 - 167 * H;   // 시간별은 최근 7일까지만
    for(let t = t0; t <= t1; t = floor(t + step + (mode === 'day' ? 2 * H : 0))){   // 서머타임 없음, 일별은 여유 두고 다시 내림
      const d = new Date(t);
      B.push({ k: t, l: mode === 'day' ? `${d.getMonth() + 1}/${d.getDate()}` : (d.getHours() === 0 ? `${d.getMonth() + 1}/${d.getDate()}` : d.getHours() + '시'),
        tip: mode === 'day' ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:00–${pad(d.getHours())}:59`, y: 0, n: 0, p: 0, cum: 0 });
    }
    let i = 0, cum = A.filter(a => a.at < t0).length;
    B.forEach((b, j) => { const end = j + 1 < B.length ? B[j + 1].k : Infinity;
      while(i < A.length && A[i].at < end){ if(A[i].at >= b.k){ const a = A[i]; a.yes ? b.y++ : b.n++; b.p += a.n; cum++; } i++; }
      b.cum = cum; });
  }
  // 요약
  const last = (ms) => A.filter(a => a.at > now - ms).length;
  const peak = B.reduce((m, b) => (b.y + b.n) > (m ? m.y + m.n : 0) ? b : m, null);
  $('#tlTitle').textContent = '응답 타임라인';
  $('#tlSum').innerHTML = `<span><b>${A.length}</b>응답 (링크 ${A.filter(a => !a.ev).length} · 이벤터스 ${A.filter(a => a.ev).length})</span><span><b>${last(H)}</b>최근 1시간</span><span><b>${last(D)}</b>최근 24시간</span>${peak ? `<span>가장 많은 때 <b style="font-size:13px">${esc(peak.tip.replace(' (전체 기간 합계)', ''))}</b> ${peak.y + peak.n}건</span>` : ''}${other ? `<span>응답 시각 없는 담당자 입력 ${other}건은 그래프에서 제외</span>` : ''}<span style="margin-left:auto"><i style="background:var(--yes)"></i>참석 <i style="background:#9ca3af;margin-left:8px"></i>불참${mode !== 'hod' ? ' <i style="background:var(--acc);height:2px;margin-left:8px;vertical-align:3px"></i>누적' : ''}</span>`;
  // 그래프(SVG)
  const W = Math.max(320, $('#tlChart').clientWidth || 900), HH = 220, L = 30, R = mode !== 'hod' ? 36 : 8, T = 10, Bm = 22;
  const iw = W - L - R, ih = HH - T - Bm, n = B.length || 1, bw = iw / n;
  const mx = Math.max(1, ...B.map(b => b.y + b.n)), mc = Math.max(1, ...B.map(b => b.cum || 0));
  const nice = (m) => { const s = [1, 2, 5, 10, 20, 25, 50, 100, 200]; const st = s.find(x => m / x <= 4) || 500; return { st, top: Math.ceil(m / st) * st }; };
  const ny = nice(mx), y = (v) => T + ih - v / ny.top * ih, yc = (v) => T + ih - v / mc * ih;
  let g = '';
  for(let v = 0; v <= ny.top; v += ny.st) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? '#eef0f3' : '#d1d5db'}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  const every = Math.ceil(n / Math.max(1, Math.floor(iw / 44)));
  B.forEach((b, j) => {
    const x = L + j * bw, w = Math.max(1, bw - Math.min(6, bw * .25)), cx = x + (bw - w) / 2;
    if(b.y) g += `<rect x="${cx}" y="${y(b.y)}" width="${w}" height="${y(0) - y(b.y)}" style="fill:var(--yes)" rx="${Math.min(2, w / 3)}"/>`;
    if(b.n) g += `<rect x="${cx}" y="${y(b.y + b.n)}" width="${w}" height="${y(b.y) - y(b.y + b.n)}" fill="#9ca3af"/>`;
    if(j % every === 0) g += `<text x="${x + bw / 2}" y="${HH - 6}" text-anchor="middle">${esc(b.l)}</text>`;
    g += `<rect x="${x}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-b="${j}"/>`;
  });
  if(mode !== 'hod' && B.length){
    g += `<polyline points="${B.map((b, j) => `${L + j * bw + bw / 2},${yc(b.cum)}`).join(' ')}" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" pointer-events="none"/>`;
    g += `<text x="${W - R + 6}" y="${yc(mc) + 3.5}" style="fill:var(--acc)">${mc}</text>`;
  }
  $('#tlChart').innerHTML = `<svg viewBox="0 0 ${W} ${HH}" preserveAspectRatio="none">${g}</svg><div class="tltip" hidden></div>`;
  const tip = $('#tlChart .tltip');
  $('#tlChart svg').onmousemove = (e) => {
    const j = e.target.dataset && e.target.dataset.b; if(j === undefined){ tip.hidden = true; return; }
    const b = B[+j], r = $('#tlChart').getBoundingClientRect();
    tip.innerHTML = `<b>${esc(b.tip)}</b><br>응답 ${b.y + b.n}건 · 참석 ${b.y} · 불참 ${b.n}<br>참석 인원 ${b.p}명${b.cum !== undefined ? `<br>누적 ${b.cum}건` : ''}`;
    tip.style.left = Math.min(r.width - 90, Math.max(90, e.clientX - r.left)) + 'px'; tip.style.top = (e.clientY - r.top - 10) + 'px'; tip.hidden = false;
  };
  $('#tlChart svg').onmouseleave = () => { tip.hidden = true; };
}
window.addEventListener('resize', () => { clearTimeout(drawTimeline.h); drawTimeline.h = setTimeout(() => { if(Object.keys(G).length) drawTimeline(); }, 200); });

function filtered(ignoreComp){
  const q = $('#q').value.trim().toLowerCase().replace(/-/g, '');
  return list().filter(g => {
    if(FILTER === 'yes' && gst(g) !== 'yes') return false;
    if(FILTER === 'no' && gst(g) !== 'no') return false;
    if(FILTER === 'pending' && gst(g) !== 'pending') return false;
    if(FILTER === 'chg' && !changed(g)) return false;
    if(FILTER === 'sentpend' && !sentPend(g)) return false;
    if(!ignoreComp && COMP === 'with' && !withComps(g)) return false;
    if(!ignoreComp && COMP === 'solo' && withComps(g)) return false;
    if(!q) return true;
    const hay = [g.rep.name, g.rep.org, g.rep.phone, g.email, g.route, g.sub && g.sub.name, ...(g.comps || []).map(c => c.name)].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0) || String(a.rep.name).localeCompare(b.rep.name, 'ko'));
}

function paintRows(){
  if(EDITING) return;
  const L = filtered();
  // 그룹 수 옆에 사람 수(본인 + 명단상 동행인)를 같이 보여준다 — 그룹 수만 보면 전체 인원이 헷갈려서(2026-10-29 요청)
  const base = filtered(true), W = base.filter(withComps);
  const ppl = (A) => A.reduce((n, g) => n + rosterN(g), 0);
  $('#seg').innerHTML = [['all', '전체', base.length, `총 ${ppl(base)}명`], ['with', '동행인 있음', W.length, `동행인 포함 ${ppl(W)}명`], ['solo', '혼자 참석', base.length - W.length, '']]
    .map(([k, l, n, p]) => `<button class="${COMP === k ? 'on' : ''}" data-comp="${k}">${l} ${n}${p ? ` <span style="font-weight:500;color:var(--tx3)">(${p})</span>` : ''}</button>`).join('');
  document.querySelectorAll('[data-comp]').forEach(b => b.onclick = () => { COMP = b.dataset.comp; OPEN = ''; paintRows(); });
  $('#listTitle').textContent = ({ all: '전체', yes: '참석', no: '불참', pending: '미응답', sentpend: '보냈는데 미응답', chg: '대리·동행인 변경' })[FILTER] + ` ${L.length}`;
  if(!L.length){ $('#rows').innerHTML = `<tr><td colspan="11" class="empty">해당하는 그룹이 없어요.</td></tr>`; return; }
  $('#rows').innerHTML = L.map(g => {
    const st = gst(g);
    const orig = g.orig ? g.orig.n : '';
    const now = st === 'pending' ? '' : heads(g);
    const comps = (g.comps || []).map(c => esc(c.name)).join(', ');
    return `<tr class="g" data-t="${g.t}">
      <td><span class="nm">${esc(g.rep.name)}</span>${g.vip ? '<span class="tag t-vip">VIP</span>' : ''}${changed(g) ? '<span class="tag t-chg">변경</span>' : ''}<div class="org">${esc([g.rep.org, g.rep.title].filter(Boolean).join(' · '))}</div></td>
      <td class="num">${esc(fmtPhone(g.rep.phone))}<div class="org" style="font-family:inherit">${g.email ? esc(g.email) : '<span style="color:var(--tx3)">이메일 없음</span>'}</div></td>
      <td class="hide-m mut">${esc(g.route || '')}</td>
      <td><span class="st ${st}">${stLabel(g)}</span>${g.src && g.updatedBy !== 'guest' ? `<div class="org">${esc(g.src)}</div>` : ''}</td>
      <td class="num" style="white-space:nowrap;font-size:12px">${g.created ? fmtTime(g.created) : '<span style="color:var(--tx3)">—</span>'}<div class="org" style="font-family:inherit">${esc(regLabel(g))}</div></td>
      <td class="num" style="white-space:nowrap;font-size:12px">${isSent(g) ? `<b>${fmtTime(g.sent.at)}</b>${g.sent.n > 1 ? ` <span class="mut">(${g.sent.n}회)</span>` : ''}` : '<span style="color:var(--tx3)">안 보냄</span>'}${g.sendNote ? `<br><b style="color:var(--err)">${esc(g.sendNote)}</b> <button class="lk" data-clrnote="${g.t}" title="발송 메모 지우기">✕ 지우기</button>` : ''}</td>
      <td class="mut num" style="white-space:nowrap;font-size:12px">${isOpen(g) ? `<b style="color:var(--ink)">열람</b> ${fmtTime(g.open.last)}${g.open.n > 1 ? ` (${g.open.n}회)` : ''}` : '<span style="color:var(--tx3)">안 열어봄</span>'}</td>
      <td class="num">${now === '' ? `<span class="mut">예상 ${orig}</span>` : (orig !== '' && orig !== now ? `<span class="mut">${orig} →</span> <b>${now}</b>` : `<b>${now}</b>`)}</td>
      <td class="hide-m comps">${g.sub && g.sub.name ? `<span class="tag t-sub" style="margin-left:0">대리</span> ${esc(g.sub.name)}${comps ? ' · ' : ''}` : ''}${comps || '<span class="mut">—</span>'}</td>
      <td class="mut num">${g.updatedAt ? fmtTime(g.updatedAt) + (g.updatedBy === 'guest' ? ' · 본인' : (g.updatedBy === 'guest-comp' ? ' · 동행인' : ' · 담당')) : ''}</td>
      <td style="white-space:nowrap"><button class="lk" data-copy="${g.t}">복사</button><a class="lk" href="/r/${g.t}" target="_blank" rel="noopener">열기</a></td>
    </tr>${OPEN === g.t ? editRow(g) : ''}`;
  }).join('');
  document.querySelectorAll('tr.g').forEach(tr => tr.onclick = (e) => {

  bindEdit();
}

// ── 엑셀 가져오기 ──
function parseSheet(wb){
  const want = ['구분', '성함', '연락처'];
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, rows.length); h++){
      const hdr = rows[h].map(x => String(x).trim());
      if(!want.every(w => hdr.includes(w))) continue;
      const col = (n) => hdr.indexOf(n);
      const C = { kind: col('구분'), name: col('성함'), title: col('직책'), org: col('소속'), phone: col('연락처'), email: col('이메일'), route: col('초청 경로'), note: col('비고') };
      const cell = (r, k) => C[k] < 0 ? '' : String(r[C[k]] == null ? '' : r[C[k]]).trim();
      const groups = []; let cur = null, orphan = 0;
      for(const r of rows.slice(h + 1)){
        const kind = cell(r, 'kind'), nm = cell(r, 'name');
        if(!kind && !nm) continue;
        const p = { name: nm, title: cell(r, 'title'), org: cell(r, 'org'), phone: cell(r, 'phone').replace(/\D/g, ''), email: kind === '동행인' ? cell(r, 'email').toLowerCase() : '' };
        if(kind === '동행인'){
          if(!cur){ orphan++; continue; }
          if(p.phone && p.phone === cur.rep.phone) p.phone = '';          // 동행인 칸에 대표 번호가 복사돼 있음
          if(!p.name || /미기재|미정/.test(p.name)) p.name = '이름 미기재';   // 손님이 링크에서 이름을 적을 수 있는 자리
          cur.comps.push(p);
        }else{
          cur = { rep: p, comps: [], email: cell(r, 'email'), route: cell(r, 'route'), note: cell(r, 'note'), vip: kind === 'VIP' || cell(r, 'route') === '연사' };
          groups.push(cur);
        }
      }
      // 한 그룹에 이름 미기재가 여럿이면 번호를 붙인다(이름이 같으면 서버에서 한 명으로 합쳐지므로)
      groups.forEach(g => { const ph = g.comps.filter(c => c.name === '이름 미기재'); if(ph.length > 1) ph.forEach((c, i) => { c.name = '이름 미기재 ' + (i + 1); }); });
      return { sheet: name, groups, orphan };
    }
  }
  return null;
}
// 이벤터스 참가자 리스트(다운받은 그대로)도 명단으로 가져온다(2026-11-03 요청).
// 한 줄 = 한 사람. 이미 명단에 있는 사람(대표·대리·동행인 번호, 직함의 hakdongmap.kr/<앞 6자>)은 건너뛰고 새 사람만 넣는다.
// '동행인 있음' 그룹 줄이고 소속이 같은 '새 신청' 그룹이 있으면 그 그룹의 동행인으로 붙인다(예: 더존하우징 윤세진 + 이도연·김신아).
// 이메일이 필수라 임시로 넣은 a@aqara.kr 같은 값은 버리고, 아카라 직원(@aqara.kr)·번호 없는 줄(테스트)은 뺀다.
function parseEventusRoster(wb){
  const nf = (s) => (s === 'Data Not Found' ? '' : s);
  const okEm = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && !/^[a-z0-9]{1,2}@aqara\.kr$/.test(s);
  const key = (s) => String(s || '').replace(/\s/g, '');
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, rows.length); h++){
      const hdr = rows[h].map(x => String(x).trim());
      if(!hdr.includes('이름') || !hdr.includes('휴대전화번호') || !hdr.some(x => x.startsWith('기본 카테고리'))) continue;
      const cell = (r, n) => { const i = hdr.indexOf(n); return i < 0 ? '' : nf(String(r[i] == null ? '' : r[i]).trim()); };
      const shortOf = (r) => { const m = /hakdongmap\.kr\/(?:r\/)?([A-Za-z0-9_-]{6})/.exec(cell(r, '직함')); return m ? m[1] : ''; };
      const L = allGroups().filter(g => !g.test), where = {}, byShort = {};
      L.forEach(g => { [g.rep, g.sub, ...(g.comps || [])].forEach((p, i) => { const d = telDigits(p && p.phone); if(d) where[d] = where[d] || (i === 0 ? g.rep.name : `${g.rep.name}님 그룹`); }); byShort[g.t.slice(0, 6)] = g; });
      const body = rows.slice(h + 1).filter(r => cell(r, '이름'));
      // 같은 파일에서 개별 링크가 있는(=이미 명단에 있는) 줄의 소속 → 그 그룹. 링크 없는 '동행인 있음' 줄은 여기에 동행인으로 붙인다(예: 윤세진 ← 이도연·김신아)
      const orgHost = {};
      body.forEach(r => { const g = byShort[shortOf(r)]; if(g && cell(r, '소속')) orgHost[key(cell(r, '소속'))] = g; });
      const recent = L.filter(isNew), att = {};
      const out = { sheet: name, groups: [], orphan: 0, eventus: true, exist: 0, staff: 0, nophone: 0, attached: [], attach: [], fresh: [], existNames: [] };
      for(const r of body){
        const nm = cell(r, '이름');
        const email = cell(r, '이메일').toLowerCase(), phone = telDigits(cell(r, '휴대전화번호')), sh = shortOf(r);
        if(/@aqara\.kr$/.test(email) && okEm(email)){ out.staff++; continue; }   // 실제 아카라 직원(임시값 a@aqara.kr 은 여기 안 걸림)
        if(!/^01\d{8,9}$/.test(phone)){ out.nophone++; continue; }
        if(where[phone] || (sh && byShort[sh])){ out.exist++; out.existNames.push(`${nm} (${where[phone] || byShort[sh].rep.name})`); continue; }
        const org = cell(r, '소속'), job = cell(r, '직함'), p = { name: nm, title: sh ? '' : job, org, phone, email: okEm(email) ? email : '' };
        const host = cell(r, '기본 카테고리 - 동행인 있음') === 'O' && org ? (orgHost[key(org)] || recent.find(g => key(g.rep.org) === key(org))) : null;
        where[phone] = host ? `${host.rep.name}님 그룹` : nm;
        if(host){ (att[host.t] = att[host.t] || { g: host, adds: [] }).adds.push(p); continue; }
        out.fresh.push(p);
        out.groups.push({ rep: { name: p.name, title: p.title, org: p.org, phone: p.phone }, comps: [], email: p.email, route: '이벤터스', note: '', vip: false });
      }
      Object.values(att).forEach(({ g, adds }) => {
        out.attached.push(`${g.rep.name} ← ${adds.map(a => a.name).join(', ')}`);
        out.attach.push({ t: g.t, comps: adds });
      });
      return out;
    }
  }
  return null;
}
// 구글 설문 응답 엑셀('(RSVP) …_1차(응답)' — 타임스탬프·참석 여부·성함·소속·연락처·이메일·동행인 명수·동행인 정보·초청 경로·직책)도 읽는다(2026-11-03 요청).
// 머리글이 같은 시트는 모두 읽고(설문 시트 + 손으로 붙인 '신규 추가' 시트), 같은 번호는 아래(나중) 줄 기준. 이미 명단에 있는 사람·불참 응답·아카라 직원은 뺀다.
// 예전에 일부러 뺀 사람(업계 외·중복 등)이 다시 보일 수 있어서 미리보기에서 한 명씩 고르게 한다.
function parseCompsText(txt){
  return String(txt || '').split(/[\n\/,·]+/).map(s => s.trim()).filter(Boolean).map(s => {
    const ph = (s.match(/01\d[-\s.]?\d{3,4}[-\s.]?\d{4}/) || [''])[0];
    const rest = s.replace(ph, ' ').replace(/[:()]/g, ' ').replace(/\s+/g, ' ').trim();
    const nm = (rest.match(/[가-힣]{2,4}/) || [''])[0];
    return { name: nm, title: rest.replace(nm, '').trim(), org: '', phone: telDigits(ph) };
  }).filter(c => c.name && !/^(없음|없습니다|미정|본인)$/.test(c.name));
}
function parseFormRoster(wb){
  const okEm = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  const byPhone = new Map(), sheets = [];
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, rows.length); h++){
      const hdr = rows[h].map(x => String(x).trim());
      if(!hdr.includes('성함') || !hdr.includes('연락처') || !hdr.some(x => /^참석 여부|^동행인 정보/.test(x))) continue;
      const ci = (re) => hdr.findIndex(x => re.test(x));
      const C = { ts: ci(/^타임스탬프/), att: ci(/^참석 여부/), name: hdr.indexOf('성함'), org: hdr.indexOf('소속'), phone: hdr.indexOf('연락처'), email: hdr.indexOf('이메일'),
        cn: ci(/^동행인 명수/), ci: ci(/^동행인 정보/), route: ci(/^초청 경로/), title: hdr.indexOf('직책'), link: ci(/개별 링크/), memo: ci(/^메모/) };
      const cell = (r, k) => C[k] < 0 ? '' : String(r[C[k]] == null ? '' : r[C[k]]).trim();
      sheets.push(name);
      rows.slice(h + 1).forEach(r => {
        const nm = cell(r, 'name').replace(/\s+/g, ''), phone = telDigits(cell(r, 'phone'));
        if(!nm || !phone) return;
        byPhone.set(phone, { nm, phone, att: cell(r, 'att'), org: cell(r, 'org'), title: cell(r, 'title'), email: cell(r, 'email').replace(/[^\x21-\x7e]/g, '').toLowerCase(),
          cn: cell(r, 'cn'), comps: cell(r, 'ci'), route: cell(r, 'route'), link: cell(r, 'link'), ts: cell(r, 'ts'), memo: cell(r, 'memo'), sheet: name });
      });
      break;
    }
  }
  if(!sheets.length) return null;
  const L = allGroups().filter(g => !g.test), phones = new Set(), byShort = {};
  L.forEach(g => { [g.rep, g.sub, ...(g.comps || [])].forEach(p => { const d = telDigits(p && p.phone); if(d) phones.add(d); }); byShort[g.t.slice(0, 6)] = g; });
  const out = { form: true, sheet: sheets.join(', '), groups: [], cand: [], exist: 0, no: 0, staff: 0, orphan: 0 };
  byPhone.forEach(x => {
    const sh = /hakdongmap\.kr\/(?:r\/)?([A-Za-z0-9_-]{6})/.exec(x.link);
    if(phones.has(x.phone) || (sh && byShort[sh[1]])){ out.exist++; return; }
    if(/불참/.test(x.att)){ out.no++; return; }
    if(/@aqara\.kr$/.test(x.email)){ out.staff++; return; }
    const comps = /^0/.test(x.cn) ? [] : parseCompsText(x.comps).filter(c => !c.phone || !phones.has(c.phone));
    out.cand.push({ sheet: x.sheet, ts: x.ts, g: { rep: { name: x.nm, title: x.title, org: x.org, phone: x.phone }, comps, email: okEm(x.email) ? x.email : '',
      route: x.route, note: [x.sheet !== sheets[0] ? x.sheet : '', x.memo].filter(Boolean).join(' · ').slice(0, 300), vip: false } });
  });
  out.groups = out.cand.map(c => c.g);
  return out;
}

  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });

          ${c.g.comps.length ? `<br><span style="color:var(--tx2)">동행 ${c.g.comps.map(x => esc(x.name + (x.title ? ' ' + x.title : '') + (x.phone ? ' ' + fmtPhone(x.phone) : ''))).join(', ')}</span>` : ''}

// ── 현황 엑셀 반영(2026-11-02) ──
// 담당자가 정리한 명단 엑셀('참석 확정 여부 · 발송 여부 · 응답 근거' 열)을 기존 그룹에 맞춰 넣는다.
// 이벤터스로 받은 응답처럼 링크 밖에서 모은 참석/불참, 번호 오류 같은 발송 문제를 관리 화면에 보이게 하려는 것. 새 그룹은 만들지 않는다.
function parseStatusSheet(wb){
  for(const name of wb.SheetNames){
    // 이벤터스 참가자 리스트(참석/불참 상태·응답시각 열) — 한 줄 = 초대받은 분 1명. 직함 칸의 hakdongmap.kr/<앞 6자>로 그룹을 바로 찾는다
    const er = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, er.length); h++){
      const hdr = er[h].map(x => String(x).trim());
      if(!['이름', '휴대전화번호', '참석/불참 상태'].every(w => hdr.includes(w))) continue;
      const ci = (n) => hdr.indexOf(n), cell = (r, n) => ci(n) < 0 ? '' : String(r[ci(n)] == null ? '' : r[ci(n)]).trim();
      const at = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/.exec(s); return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6] || '00'}+09:00`).getTime() : 0; };
      const groups = er.slice(h + 1).filter(r => cell(r, '이름')).map(r => {
        const sh = /hakdongmap\.kr\/(?:r\/)?([A-Za-z0-9_-]{6,12})/.exec(cell(r, '직함'));
        return { rep: { name: cell(r, '이름'), org: cell(r, '소속'), phone: telDigits(cell(r, '휴대전화번호')), email: cell(r, '이메일').toLowerCase(),
          st: cell(r, '참석/불참 상태'), why: '이벤터스', at: at(cell(r, '참석/불참 응답시각')), short: sh ? sh[1] : '' }, send: '', comps: [] };
      });
      return { sheet: name, groups, hasSend: false, eventus: true };
    }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, rows.length); h++){
      const hdr = rows[h].map(x => String(x).trim());
      if(!['구분', '성함', '연락처', '참석 확정 여부'].every(w => hdr.includes(w))) continue;
      const C = { kind: hdr.indexOf('구분'), name: hdr.indexOf('성함'), org: hdr.indexOf('소속'), phone: hdr.indexOf('연락처'), st: hdr.indexOf('참석 확정 여부'), send: hdr.indexOf('발송 여부'), why: hdr.indexOf('응답 근거') };
      const cell = (r, k) => C[k] < 0 ? '' : String(r[C[k]] == null ? '' : r[C[k]]).trim();
      const groups = []; let cur = null;
      for(const r of rows.slice(h + 1)){
        const kind = cell(r, 'kind'), nm = cell(r, 'name');
        if(!kind && !nm) continue;
        const p = { name: nm, st: cell(r, 'st'), why: cell(r, 'why') };
        if(kind === '동행인'){ if(cur) cur.comps.push(p); continue; }
        cur = { rep: Object.assign(p, { org: cell(r, 'org'), phone: telDigits(cell(r, 'phone')) }), send: cell(r, 'send'), comps: [] };
        groups.push(cur);
      }
      return { sheet: name, groups, hasSend: C.send >= 0 };
    }
  }
  return null;
}
function planStatus(p){
  const nz = (s) => String(s || '').replace(/\s/g, '');
  const L = allGroups().filter(g => !g.test), used = new Set();
  const uniq = (A) => { A = A.filter(g => !used.has(g.t)); return A.length === 1 ? A[0] : null; };
  const out = { items: [], apply: [], same: 0, conflict: [], miss: [], byPhone: [], sent: 0, notes: 0, sysOnly: 0, asComp: [], skip: 0 };
  const XS = { '참석': 'yes', '불참': 'no' };
  p.groups.forEach(x => {
    const r = x.rep;
    let g = (r.short ? uniq(L.filter(g => r.short.length > 6 ? g.t === r.short : g.t.slice(0, 6) === r.short)) : null)
      || uniq(L.filter(g => telDigits(g.rep.phone) === r.phone && nz(g.rep.name) === nz(r.name)))
      || (r.email ? uniq(L.filter(g => (g.email || "").toLowerCase() === r.email && nz(g.rep.name) === nz(r.name))) : null)
      || uniq(L.filter(g => nz(g.rep.name) === nz(r.name) && nz(g.rep.org) === nz(r.org)))
      || uniq(L.filter(g => nz(g.rep.name) === nz(r.name)));
    if(!g && r.phone.length >= 9){ g = uniq(L.filter(g => telDigits(g.rep.phone) === r.phone)); if(g) out.byPhone.push(`${r.name} → ${g.rep.name}`); }
    if(!g){
      // 아카라 직원·번호 없는 테스트 줄은 조용히 건너뜀(2026-11-03)
      if((r.email && /@aqara\.kr$/.test(r.email) && !/^[a-z0-9]{1,2}@aqara\.kr$/.test(r.email)) || (p.eventus && !r.phone)){ out.skip++; return; }
      // 대표가 아니라 다른 그룹의 동행인으로 있는 사람(이벤터스엔 한 줄씩 따로 올라감) — 번호, 없으면 이름+소속으로 찾는다
      const hasC = (g, f) => [...(g.comps || []), ...String((g.orig && g.orig.comps) || '').split(', ').map(n => ({ name: n }))].some(f);
      const host = (r.phone ? uniq(L.filter(g => hasC(g, c => c.phone && telDigits(c.phone) === r.phone))) : null)
        || uniq(L.filter(g => hasC(g, c => nz(c.name) === nz(r.name)) && (!r.org || nz(g.rep.org) === nz(r.org))))
        || uniq(L.filter(g => hasC(g, c => nz(c.name) === nz(r.name))));   // 소속 표기가 달라도(Stack designworks / 스택 디자인웍스) 이름이 하나뿐이면
      if(host){ out.asComp.push(`${r.name} → ${host.rep.name}님 그룹 동행인${XS[r.st] ? ' (이벤터스 ' + r.st + ')' : ''}`); return; }
      out.miss.push(`${r.name}${r.org ? ' (' + r.org + ')' : ''}`); return;
    }
    used.add(g.t);
    const it = { t: g.t };
    const xs = XS[r.st];
    const sys = g.status || 'pending';
    if(xs){
      if(sys === xs){ out.same++; if(r.at && g.src && g.updatedBy !== "guest" && g.srcAt !== r.at) it.at = r.at; }
      else if(g.updatedBy === 'guest' || (g.updatedBy && !g.src && sys !== 'pending')) out.conflict.push(`${g.rep.name}: 엑셀 ${r.st} / 관리 화면 ${ST[sys]}(${g.updatedBy === 'guest' ? '본인 링크' : '담당자'}) → 관리 화면 유지`);
      else {
        it.status = xs; it.src = /이벤터스/.test(r.why) ? '이벤터스' : '담당자 엑셀';
        if(r.at) it.at = r.at;
        // 동행인 참석 여부가 엑셀에 있으면 그대로, 전부 미응답이면 지금 명단 유지
        if(x.comps.some(c => XS[c.st])) it.comps = x.comps.filter(c => c.st === '참석').map(c => { const m = /이름 입력:\s*(\S+)/.exec(c.why); return m ? m[1] : c.name; });
        out.apply.push(`${g.rep.name} · ${r.st}${it.src === '이벤터스' ? ' (이벤터스)' : ''}`);
      }
    }else if(sys !== 'pending') out.sysOnly++;
    if(p.hasSend){
      if(/^(발송|재발송)/.test(x.send) && !isSent(g)){ it.sent = true; out.sent++; }
      const note = x.send && x.send !== '발송' ? x.send : '';
      if(note !== (g.sendNote || '')){ it.sendNote = note; out.notes++; }
    }
    if(Object.keys(it).length > 1) out.items.push(it);
  });
  return out;
}
// ── 설문 이메일 반영(2026-11-03): 설문 응답 엑셀(성함·연락처·이메일)의 이메일을 명단 기준으로 삼는다 ──
// 같은 번호로 여러 번 답했으면 아래(나중) 응답의 이메일, 형식이 틀린 값(test 등)은 건너뜀, 한글·공백은 지움(예: '내abc@naver.com').
function planEmails(wb){
  const cleanEm = (s) => String(s || '').replace(/[^\x21-\x7e]/g, '').toLowerCase();
  const okEm = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  for(const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    for(let h = 0; h < Math.min(15, rows.length); h++){
      const hdr = rows[h].map(x => String(x).trim());
      const ci = { name: hdr.indexOf('성함'), phone: hdr.indexOf('연락처'), email: hdr.indexOf('이메일') };
      if(ci.name < 0 || ci.phone < 0 || ci.email < 0) continue;
      const byP = {}, byN = {};
      rows.slice(h + 1).forEach(r => {
        const em = cleanEm(r[ci.email]); if(!okEm(em)) return;
        const p = telDigits(r[ci.phone]), n = String(r[ci.name] || '').replace(/\s/g, '');
        if(p) byP[p] = em;
        if(n){ (byN[n] = byN[n] || new Set()).add(p || '-'); byN[n].em = em; }
      });
      const L = allGroups().filter(g => !g.test), out = { sheet: name, items: [], same: 0, miss: [] };
      L.forEach(g => {
        const p = telDigits(g.rep.phone), n = String(g.rep.name || '').replace(/\s/g, '');
        const em = (p && byP[p]) || (byN[n] && byN[n].size === 1 && byN[n].has('-') ? byN[n].em : '');
        if(!em){ out.miss.push(g.rep.name); return; }
        if((g.email || '') === em) out.same++; else out.items.push({ t: g.t, email: em, name: g.rep.name, from: g.email || '' });
      });
      return out;
    }
  }
  return null;
}
$('#fileEm').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const P = planEmails(XLSX.read(await f.arrayBuffer(), { type: 'array' }));
    if(!P) return toast('‘성함 · 연락처 · 이메일’ 머리글이 있는 시트를 찾지 못했어요');
    modal(`<h3>설문 이메일 반영</h3>

      ${P.miss.length ? `<br><br><span style="color:var(--tx3)">설문에 없음: ${P.miss.map(esc).join(', ')}</span>` : ''}</div>
      <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>닫기</button>${P.items.length ? `<button class="btn pri" id="emGo">${P.items.length}명 이메일 저장</button>` : ''}</div>`);
    if(!P.items.length) return;
    $('#emGo').onclick = async () => {
      $('#emGo').disabled = true;
      const j = await api({ op: 'emails', items: P.items.map(x => ({ t: x.t, email: x.email })) });
      if(!j.ok){ $('#emGo').disabled = false; return toast(j.error || '저장 실패'); }
      closeModal(); toast(`이메일 ${j.n}명 저장했어요`); load();
    };
  }catch(err){ toast('엑셀을 읽지 못했어요: ' + err.message); }
};

      <br>문자 보냄 표시 추가 <b>${P.sent}</b> · 발송 메모(번호 오류 등) ${P.notes}
      ${P.apply.length ? `<details style="margin-top:8px"><summary>반영할 응답 ${P.apply.length}</summary><div style="font-size:12px;margin-top:4px">${more(P.apply, 120)}</div></details>` : ''}
      ${P.conflict.length ? `<details style="margin-top:6px" open><summary>엑셀과 다른 응답 ${P.conflict.length} — 관리 화면 값 유지</summary><div style="font-size:12px;margin-top:4px">${more(P.conflict, 40)}</div></details>` : ''}
      ${P.byPhone.length ? `<details style="margin-top:6px"><summary>이름이 달라 연락처로 맞춘 그룹 ${P.byPhone.length}</summary><div style="font-size:12px;margin-top:4px">${more(P.byPhone, 40)}</div></details>` : ''}

// ── 내보내기 ──
function personRows(L){
  const out = [];
  (L || list()).slice().sort((a, b) => String(a.rep.name).localeCompare(b.rep.name, 'ko')).forEach(g => {
    // 상태는 사람마다: 본인 = 본인 응답, 동행인 = 응답했으면 참석(명단에서 빠진 사람은 아래에서 불참으로)
    const ans = answered(g), st = ans ? ST[g.status] : ST.pending;
    const base = { '초대받은 분': g.rep.name, '초청 경로': g.route || '', 'VIP': g.vip ? 'VIP' : '', '마지막 문자 전송': isSent(g) ? fullTime(g.sent.at) : '', '링크 열람': isOpen(g) ? fullTime(g.open.last) : '', '응답 일시': fullTime(g.answeredAt), '마지막 변경':g.updatedAt ? new Date(g.updatedAt).toLocaleString('ko-KR') : '', '변경자': byLabel(g), 메모: g.memo || '', 링크: linkOf(g.t) };
    const rep = g.sub && g.sub.name ? g.sub : g.rep;
    out.push(Object.assign({ 상태: st, 구분: g.sub && g.sub.name ? '대리 참석' : '본인', 성함: rep.name, 직책: rep.title || '', 소속: rep.org || g.rep.org || '', 연락처: telDigits(rep.phone), 이메일: g.sub && g.sub.name ? '' : (g.email || '') }, base));
    // 동행인은 각자 개인 링크(대표자 링크 X). 동행인이 자기 링크로 답했으면(g.cans) 그 응답이 상태·응답 일시가 된다
    const cans = g.cans || {}, cop = g.copen || {};
    const cmeta = (s) => { const a = cans[s];
      return { 링크: clinkOf(g, s), '링크 열람': cop[s] ? fullTime(cop[s].last) : '', ...(a ? { '응답 일시': fullTime(a.at), '변경자': '동행인 본인' } : {}) }; };
    (g.comps || []).forEach(c => { const s = slotOf(c), a = cans[s];
      out.push(Object.assign({ 상태: a ? ST[a.v] : (ans ? '참석' : ST.pending), 구분: '동행인', 성함: c.name, 직책: c.title || '', 소속: c.org || g.rep.org || '', 연락처: telDigits(c.phone), 이메일: c.email || '' }, base, cmeta(s))); });
    // 처음 명단에 있었는데 빠진 동행인 = 불참(그룹이 응답했거나 동행인이 직접 불참)
    const now = new Set((g.comps || []).flatMap(c => [c.name, c.from].filter(Boolean)));
    // (2026-11-05) 미응답 그룹이라도 명단에서 빠진 동행인은 불참으로 — 카드 숫자(pcount)와 같은 기준
    String((g.orig && g.orig.comps) || '').split(', ').map(s => s.trim()).filter(n => n && !now.has(n))
      .forEach(n => out.push(Object.assign({ 상태: '불참', 구분: '동행인', 성함: n, 직책: '', 소속: g.rep.org || '', 연락처: '', 이메일: '' }, base, cmeta(n))));
  });
  return out;
}
const stamp = () => { const d = new Date(); return `${d.getMonth()+1}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`; };
const fullTime = (ms) => ms ? new Date(ms).toLocaleString('ko-KR') : '';
// 응답 현황: 초대 그룹 1줄씩(문자 발송 → 링크 열람 → 응답 흐름 + 인원)
function groupRows(L){
  return (L || list()).slice().sort((a, b) => ({ yes: 0, no: 1, pending: 2 })[gst(a)] - ({ yes: 0, no: 1, pending: 2 })[gst(b)] || String(a.rep.name).localeCompare(b.rep.name, 'ko')).map(g => {
    const ans = answered(g), now = new Set((g.comps || []).flatMap(c => [c.name, c.from].filter(Boolean)));
    const gone = ans ? String((g.orig && g.orig.comps) || '').split(', ').filter(n => n && !now.has(n)) : [];
    return { 상태: stLabel(g), '초대받은 분': g.rep.name, 직책: g.rep.title || '', 소속: g.rep.org || '', 연락처: telDigits(g.rep.phone), 이메일: g.email || '', '초청 경로': g.route || '', VIP: g.vip ? 'VIP' : '',
      '본인': ans ? ST[g.status] : '미응답', '명단 인원': rosterN(g), '참석 인원': ans ? heads(g) : '',
      '참석 동행인': ans ? (g.comps || []).map(c => c.name).join(', ') : '', '불참 동행인': gone.join(', '), '대리 참석': g.sub && g.sub.name ? g.sub.name : '',
      '최초 문자 발송': isSent(g) ? fullTime(g.sent.first || g.sent.at) : '', '마지막 문자 전송': isSent(g) ? fullTime(g.sent.at) : '', '발송 횟수': isSent(g) ? (g.sent.n || 1) : '', '발송 메모': g.sendNote || '', '링크 열람': isOpen(g) ? fullTime(g.open.first) : '', '열람 횟수': isOpen(g) ? g.open.n : '',
      '등록일시': fullTime(g.created), '등록 경로': regLabel(g), '응답 일시': fullTime(g.answeredAt), '마지막 변경': fullTime(g.updatedAt), '변경자': byLabel(g), 메모: g.memo || '', 링크: linkOf(g.t) };
  });
}
function summaryRows(){

    ['문자 발송', s.sent + '그룹', pct(s.sent, s.all) + ' (관리 화면에서 보냄으로 표시한 그룹)'],
    ['링크 열람', s.open + '그룹', '발송 대비 ' + pct(s.open, s.sent)],
    ['응답', (s.yes + s.no) + '그룹', '응답률 ' + pct(s.yes + s.no, s.all)],
    ['참석 확정', s.P.y + '명', `본인 ${s.P.yr} + 동행 ${s.P.y - s.P.yr} · ${s.yes}그룹`],
    ['불참', s.P.n + '명', `빠진 동행인 포함 · 전원 불참 ${s.no}그룹`],
    ['미응답', s.P.p + '명', `${s.pending}그룹`],

}

  rows.forEach((r, i) => { const a = XLSX.utils.encode_cell({ r: i + 2, c: 2 }); if(ws[a]){ ws[a].t = 's'; ws[a].z = '@'; } });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const tg = tag && tag !== '참석·불참·미응답' ? tag + '_' : '';
  XLSX.writeFile(wb, `참가자리스트_엑셀등록하기_대표자_${tg}${rows.length}그룹_${stamp()}.xlsx`);
  toast(`${tag ? tag + ' ' : ''}${rows.length}그룹(대표자) 내려받음 · 동행인 있음 ${rows.filter(r => r[3].includes('동행인')).length}` + (tmp ? ` · 임시 이메일 ${tmp}명` : '') + (fake ? ` · 017 가상번호 ${fake}명` : ''));
}
function toCsv(rows){
  if(!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const q = (v) => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [keys.join(','), ...rows.map(r => keys.map(k => q(r[k])).join(','))].join('\r\n');
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── 링크·문자 추출 ──
// 2026-10-30 사용자 원문을 다듬은 것({이름}·{링크}는 사람마다 바뀜). 문자엔 버튼이 없어서 '참석/불참' 버튼 대신 링크로 안내
const SMS_DEFAULT = `[아카라라이프] 세미나 참석 확인

{이름}님, 안녕하세요.
'공간 디자인의 새로운 패러다임: 스마트홈 인테리어 2026' 세미나에 신청해 주셔서 감사합니다.
원활한 행사 준비를 위해 참석 여부를 한 번 더 확인 부탁드립니다.

■ 일시: 2026년 11월 19일(목) 14:00~17:00
■ 장소: 코엑스 4층 컨퍼런스룸(남) 401호

아래 링크를 눌러 참석 여부를 알려주세요.
{링크}

소중한 응답에 미리 감사드립니다.`;
function smsText(g, tpl){ return tpl.replace(/\{이름\}/g, g.rep.name).replace(/\{링크\}/g, linkOf(g.t)); }
function linkRows(L, tpl){
  return L.map(g => ({ 이름: g.rep.name, 소속: g.rep.org || '', 연락처: telDigits(g.rep.phone), 이메일: g.email || '', 상태: stLabel(g), '마지막 문자 전송': isSent(g) ? fullTime(g.sent.at) : '', 링크: linkOf(g.t), 문자: smsText(g, tpl || SMS_DEFAULT) }));
}
// 받은 대상을 '문자 보냄'으로 기록 → 목록·KPI의 문자/열람 현황에 반영
async function markSent(L){
  if(!$('#markSent') || !$('#markSent').checked || !L.length) return;
  const j = await api({ op: 'sent', ts: L.map(g => g.t) });
  if(!j.ok) return toast(j.error || '문자 보냄 기록 실패');
  toast(`${L.length}그룹을 '문자 보냄'으로 기록했어요`); load();
}
$('#btnLinks').onclick = () => {
  const counts = stats();
  modal(`<h3>링크·문자 추출</h3>
    <p>대상을 고르고 문구를 다듬은 뒤 CSV로 받아 문자/메일 발송 도구에 붙여 넣으세요. {이름}·{링크}는 사람마다 바뀝니다.</p>
    <div class="tools" style="margin-top:12px" id="tg">
      <label class="btn"><input type="radio" name="tg" value="pending" checked> 미응답 ${counts.pending}</label>
      <label class="btn"><input type="radio" name="tg" value="unsent"> 아직 안 보냄 ${list().filter(g => !isSent(g) && gst(g) === 'pending').length}</label>
      <label class="btn"><input type="radio" name="tg" value="all"> 전체 ${counts.all}</label>
      <label class="btn"><input type="radio" name="tg" value="yes"> 참석 ${counts.yes}</label>
      <label class="btn"><input type="radio" name="tg" value="view"> 지금 목록 ${filtered().length}</label>
    </div>
    <textarea id="tpl">${esc(SMS_DEFAULT)}</textarea>
    <div class="prev" id="tplPrev"></div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px"><input type="checkbox" id="markSent" checked> CSV 받기·연락처 복사 때 이 대상을 <b>'문자 보냄'</b>으로 기록 (응답 현황에서 발송·열람을 따라가요)</label>
    <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>닫기</button><button class="btn" id="cpNums">연락처만 복사</button><button class="btn pri" id="dlLinks">CSV 받기</button></div>`);
  const target = () => { const v = document.querySelector('[name=tg]:checked').value;
    if(v === 'view') return filtered();
    if(v === 'unsent') return list().filter(g => !isSent(g) && gst(g) === 'pending');
    if(v === 'sentpend') return list().filter(sentPend);
    return list().filter(g => v === 'all' || gst(g) === v); };
  const prev = () => { const L = target(); $('#tplPrev').innerHTML = L.length ? `${L.length}명 · 미리보기<br>${esc(smsText(L[0], $('#tpl').value)).replace(/\n/g, '<br>')}` : '대상이 없어요.'; };
  document.querySelectorAll('[name=tg]').forEach(r => r.onchange = prev); $('#tpl').oninput = prev; prev();
  $('#dlLinks').onclick = () => { const L = target(); if(!L.length) return toast('대상이 없어요'); download(`RSVP_링크_${stamp()}.csv`, toCsv(linkRows(L, $('#tpl').value))); markSent(L); };
  $('#cpNums').onclick = async () => { const L = target(); await navigator.clipboard.writeText(L.map(g => fmtPhone(g.rep.phone)).filter(Boolean).join('\n')); toast(`연락처 ${L.length}개를 복사했어요`); markSent(L); };
};

function modal(html){ $('#modal').innerHTML = `<div class="modal"><div class="box">${html}</div></div>`;
  $('#modal').querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
  $('#modal .modal').onclick = (e) => { if(e.target.classList.contains('modal')) closeModal(); }; }
function closeModal(){ $('#modal').innerHTML = ''; }

$('#btnClose').onclick = async () => {
  const next = !META.closed;
  if(!confirm(next ? '응답을 마감할까요? 손님은 링크에서 보기만 할 수 있게 됩니다.' : '응답을 다시 열까요?')) return;
  const j = await api({ op: 'meta', closed: next }); if(!j.ok) return toast(j.error || '실패');
  META.closed = next; paint();
};
$('#btnReset').onclick = async () => {
  const n = list().filter(g => answered(g) || g.updatedBy).length;
  if(VIEW === 'test'){
    if(!confirm(`테스트 대상 ${list().length}곳의 응답·열람·발송 기록을 모두 초기화할까요? (실제 명단은 그대로)`)) return;
    const j = await api({ op: 'reset', test: true }); if(!j.ok) return toast(j.error || '초기화 실패');
    toast(`테스트 ${j.reset}곳을 미응답으로 되돌렸어요`); return load();
  }
  if(!confirm(`응답을 모두 초기화할까요?\n\n· 응답했거나 고친 그룹 ${n}곳이 모두 '미응답'으로 돌아갑니다\n· 변경 이력도 지워집니다\n· 보낸 링크는 그대로 쓸 수 있어요\n\n되돌릴 수 없습니다.`)) return;
  if(!confirm('정말 초기화할까요? (마지막 확인)')) return;
  const j = await api({ op: 'reset' }); if(!j.ok) return toast(j.error || '초기화 실패');
  toast(`${j.reset}곳을 미응답으로 초기화했어요 — 명단 엑셀을 한 번 더 가져오면 연락처·소속까지 명단 값으로 돌아가요`);
  load();
};
// ── 직접 입력: 한 그룹 추가(테스트 탭이면 테스트 대상) ──
$('#btnAdd').onclick = () => {
  const test = VIEW === 'test';
  modal(`<h3>${test ? '🧪 테스트 대상 입력' : '직접 입력 — 명단에 한 명 추가'}</h3>
    <p>${test ? '실제 명단에는 들어가지 않아요. 내 번호를 넣고 만들어진 링크로 손님 화면을 시험해 보세요.' : '엑셀 없이 명단에 바로 추가해요. 같은 연락처가 이미 있으면 막아요.'}</p>
    <div class="edg" id="addF" style="margin-top:12px">
      <div><label>성함 *<input data-a="name" placeholder="${test ? '테스트 홍길동' : ''}"></label></div>
      <div><label>직책<input data-a="title"></label></div>
      <div><label>소속<input data-a="org"></label></div>
      <div><label>연락처<input data-a="phone" placeholder="010-0000-0000"></label></div>
      <div><label>이메일<input data-a="email"></label></div>
      <div><label>초청 경로<input data-a="route" value="${test ? '테스트' : ''}"></label></div>
      <div class="full"><label>동행인 — 한 줄에 한 명 · <span style="font-weight:400">성함 / 직책 / 연락처 / 이메일</span> (없으면 비워 두기)<textarea data-a="comps" rows="3" style="height:auto;padding:6px 9px"></textarea></label></div>
    </div>
    <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>닫기</button><button class="btn pri" id="addGo">${test ? '테스트 링크 만들기' : '명단에 추가'}</button></div>
    <div id="addOut"></div>`);
  $('#addGo').onclick = async () => {
    const v = (k) => ($(`[data-a="${k}"]`) || {}).value || '';
    if(!v('name').trim()) return toast('성함을 입력해 주세요');
    const comps = v('comps').split('\n').map(l => l.split('/').map(x => x.trim())).filter(a => a[0]).map(a => ({ name: a[0], title: a[1] || '', phone: a[2] || '', email: a[3] || '', org: v('org') }));
    $('#addGo').disabled = true;
    const j = await api({ op: 'add', test, rep: { name: v('name'), title: v('title'), org: v('org'), phone: v('phone') }, email: v('email'), route: v('route'), comps });
    $('#addGo').disabled = false;
    if(!j.ok) return toast(j.error || '추가 실패');
    G[j.t] = j.group; paint();
    $('#addOut').innerHTML = `<div class="prev" style="margin-top:12px">✅ <b>${esc(j.group.rep.name)}</b>님 ${test ? '테스트 링크' : '개인 링크'}가 만들어졌어요.<br><span class="num">${esc(linkOf(j.t))}</span>
      <div class="tools" style="margin-top:8px"><button class="btn" id="addCp">링크 복사</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="/r/${j.t}" target="_blank" rel="noopener">열기</a><button class="btn" id="addSms">문자 문구 복사</button></div></div>`;
    $('#addCp').onclick = async () => { await navigator.clipboard.writeText(linkOf(j.t)); toast('링크를 복사했어요'); };
    $('#addSms').onclick = async () => { await navigator.clipboard.writeText(smsText(Object.assign({ t: j.t }, j.group), SMS_DEFAULT)); toast('문자 문구를 복사했어요'); };
    $('#addF').querySelectorAll('input,textarea').forEach(el => { if(el.dataset.a !== 'route') el.value = ''; });
  };
};
// ── 마지막 문자 전송 시각 일괄 입력(2026-11-03): 외부 도구로 보낸 시각을 실제 명단 전체에 기록 ──
$('#btnSentAt').onclick = () => {
  const L = allGroups().filter(g => !g.test);
  modal(`<h3>마지막 문자 전송 시각 입력</h3>
    <p>실제 명단 중 이 시각 전에 명단에 있던 그룹 전체의 '마지막 문자 전송'을 이 시각으로 기록해요(그 뒤 새 신청은 제외). 이보다 늦게 보낸 기록이 있는 그룹은 늦은 시각을 그대로 둬요.</p>
    <div style="margin-top:12px"><label>전송 시각<input type="datetime-local" id="sentAtIn" value="2026-11-03T11:09"></label></div>
    <div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>닫기</button><button class="btn pri" id="sentAtGo">전체에 기록</button></div>`);
  $('#sentAtGo').onclick = async () => {
    const at = new Date($('#sentAtIn').value).getTime();
    if(!Number.isFinite(at)) return toast('시각을 입력해 주세요');
    $('#sentAtGo').disabled = true;
    const T = L.filter(g => (g.created || 0) <= at).map(g => g.t);   // 그 시각 뒤에 들어온 새 신청은 안 보낸 것으로 둔다
    const j = await api({ op: 'sent', ts: T, at });
    $('#sentAtGo').disabled = false;
    if(!j.ok) return toast(j.error || '기록 실패');
    closeModal(); toast(`${j.n}그룹에 ${fmtTime(at)} 기록했어요`); load();
  };
};
// 발송 메모(빨간 글씨) 지우기 — 행 클릭(편집 열기)보다 먼저 잡는다
document.addEventListener('click', async (e) => {
  const b = e.target.closest && e.target.closest('[data-clrnote]'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  const t = b.dataset.clrnote, g = G[t]; if(!g) return;
  if(!confirm(`${g.rep.name}님 발송 메모 "${g.sendNote}"를 지울까요?`)) return;
  const j = await api({ op: 'sendnote', t, sendNote: '' }); if(!j.ok) return toast(j.error || '실패');
  delete g.sendNote; toast('발송 메모를 지웠어요'); paintRows();
}, true);
$('#btnReload').onclick = load;
$('#q').oninput = () => { OPEN = ''; paintRows(); };
setInterval(() => { if(!EDITING && !$('#modal').innerHTML && document.visibilityState === 'visible') load(); }, 30000);
load();
</script>
