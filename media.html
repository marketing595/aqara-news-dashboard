<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아카라라이프 미디어 라이브러리</title>
<meta name="robots" content="noindex, nofollow" />
<meta property="og:title" content="아카라라이프 미디어 라이브러리" />
<meta property="og:description" content="로고·가이드·제품 이미지·카탈로그 등 아카라라이프 브랜드 자산" />
<link rel="icon" href="/favicon.png?v=4" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script>
  /* 마케팅 포털(index.html)과 같은 토큰을 씁니다 — 색·서체·그림자 모두 동일 */
  tailwind.config = { theme: { extend: {
    colors: {
      brand: { DEFAULT:'#FBC400', ink:'#8A6A00' },
      ink:   '#1D1D1F',
      muted: '#6E6E73'
    },
    fontFamily: { sans: ['"Pretendard Variable"','Pretendard','system-ui','"Malgun Gothic"','sans-serif'] },
    boxShadow: {
      card:'0 1px 2px rgba(38,40,42,.04),0 1px 3px rgba(38,40,42,.05)',
      cardhover:'0 12px 32px -14px rgba(38,40,42,.22)'
    }
  } } };
</script>
<style>
  body{ font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
        background:#F4F4F2; color:#1D1D1F; -webkit-font-smoothing:antialiased;
        letter-spacing:-0.015em; line-height:1.6; word-break:keep-all; font-feature-settings:"tnum" 1; }
  .card{ background:#fff; border:1px solid #E6E6E3; border-radius:16px;
         box-shadow:0 1px 2px rgba(38,40,42,.04),0 1px 3px rgba(38,40,42,.05); }
</style>
</head>
<body>

<header class="bg-ink text-white">
  <div class="max-w-[1200px] mx-auto px-5 sm:px-8 py-4 flex items-center justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[11px] font-extrabold tracking-wider" style="color:#FBC400">AQARA LIFE</p>
      <h1 class="text-[17px] sm:text-[19px] font-extrabold leading-tight tracking-tight">미디어 라이브러리 <span class="text-[12px] font-semibold text-white/40 ml-1">Media Library</span></h1>
    </div>
    <span id="scope" class="text-[11px] text-white/45 text-right shrink-0"></span>
  </div>
</header>

<main class="max-w-[1200px] mx-auto px-5 sm:px-8 py-6">

  <div class="card p-4 sm:p-5 mb-5">
    <p class="text-[13px] text-muted leading-relaxed">
      아카라라이프의 로고·브랜드 가이드·제품 이미지·카탈로그 등 <b class="text-ink">배포용 자산</b>입니다.
      항목을 누르면 구글 드라이브에서 열리며 내려받을 수 있습니다.
    </p>
    <div class="flex flex-wrap items-center gap-2 mt-3">
      <select id="cat" onchange="paint()" class="text-[13px] border border-[#E6E6E3] rounded-lg px-2.5 py-1.5 bg-white">
        <option value="">전체 카테고리</option>
      </select>
      <input id="q" oninput="paint()" placeholder="자료 이름 검색" class="text-[13px] border border-[#E6E6E3] rounded-lg px-3 py-1.5 w-44" />
      <span id="count" class="text-[12px] text-muted"></span>
    </div>
  </div>

  <div id="grid"></div>

  <p class="text-center text-[11px] text-muted mt-8 leading-relaxed">
    문의 · <a href="mailto:support@aqara.kr" class="underline hover:text-ink">support@aqara.kr</a><br>
    본 자산의 저작권은 (주)아카라라이프에 있으며, 로고·서체는 브랜드 가이드에 따라 사용해 주세요.
  </p>
</main>

<script>
  var LIB={categories:[]};
  var ONLY=new URLSearchParams(location.search).get('cat')||'';   // ?cat=카테고리명 → 그 카테고리만 공유
  var FOLDER_ROW_MARK='<!--__FOLDER_ROW__-->';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function icon(k){ return k==='pdf'?'📄':k==='video'?'🎬':k==='image'?'🖼️':k==='ppt'?'📊':k==='folder'?'📁':'📎'; }
  function kindLabel(k){ return k==='pdf'?'PDF':k==='video'?'VIDEO':k==='image'?'IMAGE':k==='ppt'?'PPT':k==='folder'?'FOLDER':'FILE'; }
  function itemUrl(it){ return it.kind==='folder'
    ? 'https://drive.google.com/drive/folders/'+it.id
    : 'https://drive.google.com/file/d/'+it.id+'/view'; }

  /* 자산 한 줄 — 얇은 구분선 · 왼쪽 썸네일 · 오른쪽에 종류·용량 · 호버 시에만 포인트 컬러 */
  function row(it){
    var thumb = it.kind==='image'
      ? '<img src="https://drive.google.com/thumbnail?id='+esc(it.id)+'&sz=w120" loading="lazy" class="w-full h-full object-cover" onerror="this.parentNode.innerHTML=\'<span class=&quot;text-[15px]&quot;>🖼️</span>\'"/>'
      : '<span class="text-[15px]">'+icon(it.kind)+'</span>';
    return '<a href="'+itemUrl(it)+'" target="_blank" rel="noopener" title="'+esc(it.title)+'"'
      +' class="group flex items-center gap-3.5 px-4 sm:px-5 py-2.5 border-b border-[#F1F1EE] last:border-b-0 hover:bg-[#FAFAF8] transition">'
      +'<span class="w-8 h-8 rounded-lg bg-[#F4F1EA] border border-[#ECE9E1] flex items-center justify-center overflow-hidden shrink-0">'+thumb+'</span>'
      +'<span class="min-w-0 flex-1 text-[13.5px] font-semibold text-ink leading-snug truncate group-hover:text-brand-ink transition">'+esc(it.title)+'</span>'
      +'<span class="text-[11px] text-muted tracking-tight shrink-0">'+kindLabel(it.kind)+(it.size?(' · '+esc(it.size)):'')+'</span>'
      +'<span class="w-4 text-right text-[13px] text-[#C9C9C4] group-hover:text-brand-ink group-hover:translate-x-0.5 transition shrink-0">↗</span></a>';
  }

  /* 카테고리 이름 옆 영문 병기 · 고정 배지 (카탈로그 톤) */
  function meta(c, count){
    return '<div class="flex items-center gap-2 flex-wrap">'
      +'<h3 class="text-[15px] font-extrabold text-ink tracking-tight">'+esc(c.name)+'</h3>'
      +(c.en?'<span class="text-[11px] text-muted tracking-tight">'+esc(c.en)+'</span>':'')
      +(c.pinned?'<span class="text-[10px] font-bold text-brand-ink bg-[#FFFBEA] border border-[#F0E7C0] rounded px-1.5 py-[1px] leading-[1.5]">고정</span>':'')
      +(count!=null?'<span class="text-[11px] text-muted">· '+count+'개</span>':'')
      +'</div>';
  }

  function paint(){
    var cats=(LIB.categories||[]).filter(function(c){ return !ONLY || c.name===ONLY; });
    var sel=document.getElementById('cat');
    if(sel.options.length!==cats.length+1){
      var cur=sel.value;
      sel.innerHTML='<option value="">전체 카테고리</option>'+cats.map(function(c){ return '<option>'+esc(c.name)+'</option>'; }).join('');
      if(cats.some(function(c){ return c.name===cur; })) sel.value=cur;
    }
    sel.classList.toggle('hidden', !!ONLY);
    var cf=sel.value, q=(document.getElementById('q').value||'').toLowerCase().trim();
    var list=cats.filter(function(c){ return !cf||c.name===cf; })
                 .slice().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); });

    // 폴더 전용 블록은 흩어놓지 않고 한 줄(최대 3개)로 모아, 처음 나온 자리에 끼워넣는다
    var out='', buf=[], marked=false, n=0;

    list.forEach(function(c){
      var items=(c.items||[]).filter(function(it){ return !q || (it.title||'').toLowerCase().indexOf(q)>-1; });
      n+=items.length;
      var folderUrl=c.url?esc(c.url):'https://drive.google.com/drive/folders/'+esc(c.folderId);   // url 이 있으면 외부 사이트로 연결

      if(!items.length){
        if(q) return;                       // 검색 중이면 빈 카테고리는 숨김
        if(!marked){ out+=FOLDER_ROW_MARK; marked=true; }
        buf.push('<div class="group relative rounded-2xl border '+(c.pinned?'border-[#EADFB4]':'border-[#E6E6E3]')
          +' bg-white shadow-card hover:border-[#C9C9C4] hover:shadow-cardhover transition">'
          +'<a href="'+folderUrl+'" target="_blank" rel="noopener" class="flex flex-col h-full p-5">'
          +'<span class="block">'+meta(c, null)+'</span>'
          +(c.desc?'<span class="block mt-2 text-[12px] text-muted leading-snug">'+esc(c.desc)+'</span>':'')
          +'<span class="mt-auto pt-4 flex items-center justify-between gap-2">'
          +'<span class="text-[12px] font-semibold text-muted group-hover:text-brand-ink transition">'+(c.url?'사이트에서 보기':'드라이브에서 다운로드')+'</span>'
          +'<span class="text-[13px] text-[#C9C9C4] group-hover:text-brand-ink group-hover:translate-x-0.5 transition">↗</span>'
          +'</span></a></div>');
        return;
      }

      out+='<section class="mb-5 rounded-2xl border '+(c.pinned?'border-[#EADFB4]':'border-[#E6E6E3]')+' bg-white shadow-card overflow-hidden">'
        +'<div class="flex items-end justify-between flex-wrap gap-3 px-4 sm:px-5 pt-4 pb-3 border-b border-[#EFEFEC]">'
        +'<div class="min-w-0">'+meta(c, items.length)
        +(c.desc?'<p class="mt-1 text-[12px] text-muted leading-snug">'+esc(c.desc)+'</p>':'')+'</div>'
        +'<a href="'+folderUrl+'" target="_blank" rel="noopener" class="text-[11.5px] font-semibold text-muted hover:text-ink border border-[#E6E6E3] hover:border-[#D6D6D2] bg-white rounded-lg px-2 py-1 transition whitespace-nowrap shrink-0">드라이브 폴더 ↗</a>'
        +'</div><div>'+items.map(row).join('')+'</div></section>';
    });

    // 모아둔 폴더 블록을 한 줄로 만들어 표시해 둔 자리에 넣는다(제목에 $ 가 있어도 안전하게 함수로)
    var folderRow = buf.length ? '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">'+buf.join('')+'</div>' : '';
    out = out.replace(FOLDER_ROW_MARK, function(){ return folderRow; });

    document.getElementById('grid').innerHTML = out ||
      '<div class="card text-center py-16 text-muted"><div class="text-4xl mb-2">📁</div>자료를 찾지 못했습니다.</div>';
    document.getElementById('count').textContent = n ? (n.toLocaleString()+'개 자료') : '';
    document.getElementById('scope').textContent = ONLY ? ONLY : '';
  }

  fetch('media.json?_='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ LIB=(d&&d.categories)?d:{categories:[]}; paint(); })
    .catch(function(){
      document.getElementById('grid').innerHTML =
        '<div class="card text-center py-16 text-muted">자료 목록을 불러오지 못했습니다.</div>';
    });
</script>
</body>
</html>
