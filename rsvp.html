<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>참석 확인 · SMART HOME INTERIOR 2026</title>
<meta property="og:title" content="SMART HOME INTERIOR 2026 · 참석 확인">
<meta property="og:description" content="참석 여부와 동행인 정보를 확인해 주세요.">
<link rel="icon" href="/favicon-seminar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --acc:#ff4b00; --acc-d:#e04200; --acc-soft:#fff1ea;
  --ink:#16181d; --tx:#2b2f37; --tx2:#5d6370; --tx3:#8b909b;
  --bg:#f3f4f6; --card:#fff; --line:#e3e5ea; --line2:#d3d6dd;
  --ok:#14804a; --err:#d93025;
  --r:14px;
  --f:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:520px;margin:0 auto}

/* 상단 KV */
.kv{background:var(--acc);color:#fff;padding:22px 20px 26px;position:relative;overflow:hidden}
.kv::after{content:"";position:absolute;right:-56px;top:-48px;width:190px;height:190px;border-radius:50%;background:#000;opacity:.92}
.kv::before{content:"";position:absolute;right:62px;top:88px;width:64px;height:64px;border-radius:50%;background:#000;opacity:.92}
.kv .in{position:relative;z-index:1;max-width:520px;margin:0 auto}
.kv .logo{height:16px;display:block;margin-bottom:28px;filter:brightness(0) invert(1)}
.kv .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;opacity:.85}
.kv h1{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin-top:6px;max-width:15ch}
.kv .meta{margin-top:16px;font-size:13.5px;line-height:1.7;opacity:.95}
.kv .meta b{font-weight:600}

main{padding:20px 16px 120px}
.card{background:var(--card);border-radius:var(--r);padding:22px 20px;border:1px solid var(--line)}
.card + .card{margin-top:12px}
h2{font-size:21px;line-height:1.35;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.lead{color:var(--tx2);font-size:14px;margin-top:8px}

/* 참석/불참 */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.choice button{height:58px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;font-size:16px;font-weight:700;color:var(--tx);transition:background .15s,border-color .15s,color .15s}
.choice button:hover{border-color:var(--tx3)}
.choice button[aria-pressed="true"].yes{background:var(--acc);border-color:var(--acc);color:#fff}
.choice button[aria-pressed="true"].no{background:var(--ink);border-color:var(--ink);color:#fff}
.choice.sm{margin-top:0;gap:8px}
.choice.sm button{height:44px;font-size:15px;border-radius:10px}
.qr-note{color:var(--err);font-size:12.5px;font-weight:600;margin:-4px 0 12px}
.choice button:focus-visible,.btn:focus-visible,.link:focus-visible,.del:focus-visible{outline:3px solid rgba(255,75,0,.35);outline-offset:2px}

/* 섹션 */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h3{font-size:15px;font-weight:700;color:var(--ink)}
.sec-h .cnt{font-size:13px;color:var(--tx3)}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 14px 4px;background:#fff}
.person + .person{margin-top:10px}
.person.dim{background:#fafafa}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.p-name{font-weight:700;color:var(--ink);font-size:16px}
.p-tag{font-size:11.5px;font-weight:600;color:var(--tx2);background:#eef0f3;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.p-tag.acc{background:var(--acc-soft);color:var(--acc-d)}
.p-num{font-size:12.5px;font-weight:700;color:var(--tx3)}
.strike{text-decoration:line-through;color:var(--tx3)}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.fld span i{font-style:normal;color:var(--acc-d);margin-left:2px}
.fld input{width:100%;height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:#fff;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,75,0,.14)}
.fld input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(217,48,37,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.del{font-size:13px;font-weight:600;color:var(--tx2);padding:6px 8px;margin:-6px -8px -6px 0;border-radius:8px}
.del:hover{color:var(--err);background:#fdeeee}
.link{font-size:13.5px;font-weight:600;color:var(--acc-d);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.add{width:100%;height:48px;margin-top:10px;border:1.5px dashed var(--line2);border-radius:12px;font-weight:600;color:var(--tx2);background:#fff}
.add:hover{border-color:var(--acc);color:var(--acc-d)}
.hint{font-size:12.5px;color:var(--tx3);margin-top:8px}
.empty{font-size:13.5px;color:var(--tx3);padding:14px;border:1px dashed var(--line2);border-radius:12px;text-align:center;background:#fff}

/* 하단 저장 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:13px;color:var(--tx2);line-height:1.35}
.bar .sum b{display:block;font-size:16px;color:var(--ink)}
.btn{height:50px;padding:0 26px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;white-space:nowrap}
.btn:hover{background:var(--acc-d)}
.btn:disabled{background:#c9ccd3;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
.btn.ghost:hover{border-color:var(--tx3);background:#fff}

/* 완료 */
.done-mark{width:52px;height:52px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-bottom:16px}
.done-mark.no{background:var(--ink)}
.done-mark svg{width:26px;height:26px}
.list{margin-top:18px;border-top:1px solid var(--line)}
.list li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list li span:last-child{color:var(--tx2);text-align:right}
.note{margin-top:16px;font-size:13px;color:var(--tx2);background:#f6f7f9;border-radius:10px;padding:12px 14px;line-height:1.6}
.stamp{font-size:12.5px;color:var(--tx3);margin-top:14px}

.msg{padding:56px 8px;text-align:center;color:var(--tx2)}
.msg h2{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.closed{background:#fff7e0;border:1px solid #f1d58a;color:#6b5000;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:14px}
[hidden]{display:none!important}
@media (max-width:360px){ .row2{grid-template-columns:1fr} .kv h1{font-size:23px} .btn{padding:0 18px} }
</style>
</head>
<body>
<header class="kv">
  <div class="in">
    <img class="logo" src="/aqaralife-logo-black-v2.png" alt="AqaraLife">
    <div class="eyebrow">SEMINAR · RSVP</div>
    <h1 id="evTitle">SMART HOME INTERIOR 2026</h1>
    <div class="meta" id="evMeta"></div>
  </div>
</header>

<main class="wrap" id="app"><div class="msg">불러오는 중…</div></main>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum" id="sum"></div>
    <button class="btn" id="saveBtn" type="button">응답 저장하기</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 짧은 링크 /r/<토큰> 은 middleware가 주소를 그대로 둔 채 이 페이지를 보여주므로 경로에서도 토큰을 읽는다
const T = (new URLSearchParams(location.search).get('t') || (location.pathname.match(/\/r\/([A-Za-z0-9_-]{12})\/?$/) || [])[1] || '').trim();
let D = null;          // 서버 값
let F = null;          // 편집 중인 값
let MODE = 'form';     // form | done
let DIRTY = false;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPhone = (v) => { const d = String(v || '').replace(/\D/g, '');
  if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if(d.length === 10) return d.startsWith('02') ? d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3') : d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  return d; };
const phoneOk = (v) => { const d = String(v || '').replace(/\D/g, ''); return !d || /^0\d{8,10}$/.test(d); };
const clone = (o) => JSON.parse(JSON.stringify(o));
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); }
function fmtTime(ms){ if(!ms) return ''; const d = new Date(ms); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function showMsg(title, body){
  $('#app').innerHTML = `<div class="msg"><h2>${esc(title)}</h2><p>${body}</p></div>`;
  $('#bar').hidden = true;
}

async function load(){
  if(!/^[A-Za-z0-9_-]{12}$/.test(T)) return showMsg('링크를 확인해 주세요', '받으신 문자의 링크를 그대로 눌러 들어와 주세요.');
  try{
    const r = await fetch('/api/rsvp?op=get&t=' + encodeURIComponent(T), { cache: 'no-store' });
    const j = await r.json();
    if(!j.ok){ return j.error === 'link'
      ? showMsg('링크를 확인해 주세요', '이 링크로는 참석 정보를 찾을 수 없어요. 받으신 문자의 링크를 그대로 눌러 주세요.')
      : showMsg('잠시 후 다시 시도해 주세요', esc(j.error || '')); }
    setData(j);
    MODE = j.answered ? 'done' : 'form';
    render();
  }catch(e){ showMsg('연결이 원활하지 않아요', '잠시 후 새로고침해 주세요.'); }
}
function setData(j){
  D = j;
  // 본인 참석 여부(status) + 함께 오시는 분 각자의 참석 여부(on). 서버의 comps = 참석하는 동행인, removed = 불참으로 고른 동행인
  F = { status: j.status === 'pending' ? '' : j.status, rep: clone(j.rep),
    people: [...clone(j.comps || []).map(c => Object.assign(withPH(c), { on: j.status === 'pending' ? null : true })),
             ...clone(j.removed || []).map(n => Object.assign(withPH({ name: n, title: '', org: '', phone: '' }), { on: false }))] };
  DIRTY = false;
  const ev = j.event || {};
  $('#evTitle').textContent = ev.title || 'SMART HOME INTERIOR 2026';
  $('#evMeta').innerHTML = `${ev.sub ? esc(ev.sub) + '<br>' : ''}<b>일시</b> ${esc(ev.date || '')}<br><b>장소</b> ${esc(ev.place || '')}`;
}

const goingComps = () => F.people.filter(p => p.on === true);
function headCount(){ return (F.status === 'yes' ? 1 : 0) + goingComps().length; }
// 명단에 동행인이 있었던 분인지 — 혼자 오는 분에겐 동행인 칸 자체를 보여주지 않는다
const hasComps = () => F.people.length > 0;
// 이름 미기재 자리(_ph = 원래 자리 이름): 손님이 이름을 적을 수 있는 유일한 예외
const isPH = (n) => /미기재|미정/.test(String(n || ''));
function withPH(c){ c._ph = c.from || (isPH(c.name) ? c.name : ''); if(c._ph && isPH(c.name)) c.name = ''; return c; }
const QR_NOTE = '<p class="qr-note">이 연락처로 입장 큐알이 발송됩니다.</p>';
const pick = (attr, i, on, ro) => `
  <div class="choice sm" role="group">
    <button type="button" class="yes" ${attr}="${i}" data-v="1" aria-pressed="${on === true}" ${ro ? 'disabled' : ''}>참석</button>
    <button type="button" class="no" ${attr}="${i}" data-v="0" aria-pressed="${on === false}" ${ro ? 'disabled' : ''}>불참</button>
  </div>`;

// 손님이 할 수 있는 것: 본인과 함께 오시는 분 각자의 참석/불참, 참석하는 분의 연락처(입장 QR 발송용).
// 동행인 이름 수정·새 동행인 추가·대리 참석은 담당자만(단, '이름 미기재' 자리는 이름을 적을 수 있음).
function render(){
  if(MODE === 'done') return renderDone();
  const ro = D.closed;
  const rep = F.rep;
  const people = F.people.map((c, i) => `
    <div class="person ${c.on === false ? 'dim' : ''}">
      <div class="p-top"><span class="p-name">${c._ph ? '동행인' : esc(c.name)}<span class="p-tag ${c._ph ? 'acc' : ''}">${c._ph ? '이름 미기재' : '동행'}</span></span></div>
      ${pick('data-cp', i, c.on, ro)}
      ${c.on === true ? `
      ${c._ph ? `<label class="fld" style="margin-top:12px"><span>성함<i>*</i></span><input data-c="${i}" data-k="name" value="${esc(c.name)}" placeholder="오시는 분 성함을 적어 주세요" autocomplete="off" ${ro ? 'disabled' : ''}></label>` : ''}
      <label class="fld" style="margin-top:12px"><span>연락처<i>*</i></span><input data-c="${i}" data-k="phone" type="tel" inputmode="numeric" value="${esc(fmtPhone(c.phone))}" placeholder="010-0000-0000" ${ro ? 'disabled' : ''}></label>
      ${QR_NOTE}` : '<div style="height:12px"></div>'}
    </div>`).join('');

  $('#app').innerHTML = `
    <section class="card">
      <h2>${esc(rep.name)}님,<br>세미나에 참석하시나요?</h2>
      <p class="lead">${hasComps() ? '본인과 함께 오시는 분 각각 참석 여부를 알려 주세요.' : '참석 여부와 연락처를 확인해 주세요.'} 저장한 뒤에도 이 링크로 언제든 다시 바꿀 수 있어요.</p>
      ${ro ? '<div class="closed">응답이 마감되어 지금은 수정할 수 없어요. 변경이 필요하면 담당자에게 연락해 주세요.</div>' : ''}
      <div class="choice" role="group" aria-label="참석 여부">
        <button type="button" class="yes" data-st="yes" aria-pressed="${F.status === 'yes'}" ${ro ? 'disabled' : ''}>참석합니다</button>
        <button type="button" class="no" data-st="no" aria-pressed="${F.status === 'no'}" ${ro ? 'disabled' : ''}>불참합니다</button>
      </div>
      ${F.status === 'yes' ? `
      <div class="person" style="margin-top:16px">
        <div class="p-top"><span class="p-name">${esc(rep.name)}<span class="p-tag">본인</span></span></div>
        ${D.sub && D.sub.name ? `<p class="hint" style="margin:-4px 0 12px">${esc(D.sub.name)}님이 대신 참석해요.</p>` : ''}
        <label class="fld"><span>연락처<i>*</i></span><input data-r="phone" type="tel" inputmode="numeric" value="${esc(fmtPhone(rep.phone))}" placeholder="010-0000-0000" ${ro ? 'disabled' : ''}></label>
        ${QR_NOTE}
      </div>` : ''}
    </section>

    ${hasComps() && F.status ? `
    <section class="card">
      <div class="sec-h" style="margin-bottom:12px"><h3>함께 오시는 분</h3><span class="cnt">참석 ${goingComps().length}명 / ${F.people.length}명</span></div>
      ${people}
    </section>` : ''}`;
  paintBar();
  bind();
}

function paintBar(){
  const bar = $('#bar');
  if(MODE !== 'form' || D.closed){ bar.hidden = true; return; }
  bar.hidden = false;
  const n = headCount(), c = goingComps().length, undecided = F.status && F.people.some(p => p.on == null);
  $('#sum').innerHTML = !F.status ? '<b>참석 여부를 선택해 주세요</b>'
    : undecided ? '<b>함께 오시는 분도 선택해 주세요</b>참석 또는 불참'
    : n === 0 ? '<b>불참</b>저장하면 담당자에게 전달돼요'
    : `<b>총 ${n}명 참석</b>${[F.status === 'yes' ? '본인' : '본인 불참', c ? `동행인 ${c}명` : ''].filter(Boolean).join(' + ')}`;
  $('#saveBtn').disabled = !F.status || undecided;
  $('#saveBtn').textContent = D.answered ? '변경 내용 저장' : '응답 저장하기';
}

function bind(){
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { F.status = b.dataset.st; DIRTY = true; render(); });
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { F.people[+b.dataset.cp].on = b.dataset.v === '1'; DIRTY = true; render(); });
  document.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => {
      DIRTY = true; inp.classList.remove('bad');
      if(inp.dataset.r) F.rep[inp.dataset.r] = inp.value;
      else if(inp.dataset.c != null) F.people[+inp.dataset.c][inp.dataset.k] = inp.value;
    };
    if(inp.type === 'tel') inp.onblur = () => { inp.value = fmtPhone(inp.value); };
  });
}

function validate(){
  let first = null;
  const mark = (sel) => { const el = document.querySelector(sel); if(el){ el.classList.add('bad'); if(!first) first = el; } };
  const need = (v) => !String(v || '').replace(/\D/g, '') || !phoneOk(v);
  if(F.status === 'yes' && need(F.rep.phone)) mark('[data-r="phone"]');
  F.people.forEach((c, i) => {
    if(c.on !== true) return;
    if(c._ph && !c.name.trim()) mark(`[data-c="${i}"][data-k="name"]`);
    if(need(c.phone)) mark(`[data-c="${i}"][data-k="phone"]`);
  });
  if(first){ first.focus(); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); toast('빨간 칸을 확인해 주세요'); return false; }
  return true;
}

async function save(){
  if(!F.status || !validate()) return;
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = '저장 중…';
  try{
    const r = await fetch('/api/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'save', t: T, status: F.status, rep: { phone: F.rep.phone },
        comps: goingComps().map(c => ({ name: c.name.trim() || c._ph, from: c._ph || undefined, phone: c.phone })) }) });
    const j = await r.json();
    if(!j.ok){ toast(j.error || '저장하지 못했어요. 다시 시도해 주세요.'); paintBar(); return; }
    setData(j); MODE = 'done'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }catch(e){ toast('연결이 원활하지 않아요. 다시 시도해 주세요.'); paintBar(); }
}

function renderDone(){
  const yes = D.status === 'yes', ev = D.event || {};
  const n = (yes ? 1 : 0) + D.comps.length, any = n > 0;
  const who = D.sub ? D.sub : D.rep;
  const items = [
    yes ? `<li><span>${esc(who.name)}${D.sub ? ` <span class="p-tag acc">${esc(D.rep.name)}님 대신</span>` : ' <span class="p-tag">본인</span>'}</span><span>참석</span></li>`
        : `<li><span>${esc(D.rep.name)} <span class="p-tag">본인</span></span><span>불참</span></li>`,
    ...D.comps.map(c => `<li><span>${isPH(c.name) ? '동행인(이름 미기재)' : esc(c.name)} <span class="p-tag">동행</span></span><span>참석</span></li>`),
    ...(D.removed || []).map(nm => `<li><span>${isPH(nm) ? '동행인(이름 미기재)' : esc(nm)} <span class="p-tag">동행</span></span><span>불참</span></li>`)
  ].join('');
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const cross = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  $('#app').innerHTML = `
    <section class="card">
      <div class="done-mark ${any ? '' : 'no'}">${any ? check : cross}</div>
      <h2>${any ? `참석으로 저장했어요<br>총 ${n}명` : '불참으로 저장했어요'}</h2>
      <p class="lead">${any ? '입력하신 연락처로 입장 큐알이 발송됩니다.' : '알려 주셔서 감사합니다. 일정이 바뀌면 이 링크에서 다시 참석으로 바꿔 주세요.'}</p>
      <ul class="list">${items}</ul>
      ${D.closed ? '<div class="closed">응답이 마감되었어요. 변경이 필요하면 담당자에게 연락해 주세요.</div>'
        : '<button type="button" class="btn ghost" id="editBtn" style="width:100%;margin-top:20px">응답 수정하기</button>'}
      ${D.updatedAt ? `<p class="stamp">마지막 저장 ${fmtTime(D.updatedAt)} · 이 화면을 캡처해 두셔도 좋아요</p>` : ''}
    </section>
    ${any ? `<section class="card">
      <div class="sec-h" style="margin-bottom:6px"><h3>참석 안내</h3></div>
      <ul class="list" style="margin-top:6px">
        <li><span>일시</span><span>${esc(ev.date || '')}</span></li>
        <li><span>장소</span><span>${esc(ev.place || '')}${ev.addr ? `<br><small>${esc(ev.addr)}</small>` : ''}</span></li>
      </ul>
      ${ev.way ? `<p class="note">${esc(ev.way)}</p>` : ''}
      ${ev.map ? `<a class="btn ghost" href="${esc(ev.map)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;text-decoration:none">오시는 길 · 네이버 지도</a>` : ''}
    </section>` : ''}`;
  $('#bar').hidden = true;
  const e = $('#editBtn'); if(e) e.onclick = () => { MODE = 'form'; render(); };
}

$('#saveBtn').onclick = save;
window.addEventListener('beforeunload', (e) => { if(DIRTY && MODE === 'form'){ e.preventDefault(); e.returnValue = ''; } });
load();
</script>
</body>
</html>
