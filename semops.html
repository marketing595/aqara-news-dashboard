<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>세미나 운영 콘솔</title>
<link rel="icon" href="/favicon-seminar.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  세미나 운영 콘솔 (2026-11-18) — SMART HOME INTERIOR 2026 · 11/19 코엑스 401호
  · 원본: (최종) 11월 세미나_전체 큐시트_F.xlsx 5개 시트를 아래 DATA로 굳힘 (tools 없이 semops.src.html → semops.html 빌드)
  · 공개 페이지(middleware 제외): 링크 있는 현장 스태프·마케팅팀이 로그인 없이 봄. 개인정보 없음(스태프 이름·대본만)
  · 실시간: Firebase semops/live(현재 큐), semops/chk/<키>(체크), 익명 로그인
  · 소리: 이 기기에서만 재생. sfx/*.mp3 기본 탑재 + 없는 파일은 '파일 넣기'로 이 브라우저(IndexedDB)에 저장
-->
<style>
:root{
  --bg:#0F1012;--bg2:#17181B;--card:#1D1F23;--card2:#25282D;--line:#2E3137;--tx:#F3F3F1;--tx2:#A9ADB4;--tx3:#6E737B;
  --acc:#FF4D00;--acc2:#FF7A3D;--ok:#2BC48A;--warn:#FFB020;--bad:#FF5A5A;--live:#FF4D00;--sfx:#7C5CFF;--bgm:#1FA3FF;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F3EF;--bg2:#ECEAE4;--card:#FFFFFF;--card2:#F6F5F1;--line:#E2DFD8;--tx:#141414;--tx2:#5B5F66;--tx3:#9A9DA3;
  }
}
:root[data-theme="light"]{--bg:#F4F3EF;--bg2:#ECEAE4;--card:#FFFFFF;--card2:#F6F5F1;--line:#E2DFD8;--tx:#141414;--tx2:#5B5F66;--tx3:#9A9DA3}
:root[data-theme="dark"]{--bg:#0F1012;--bg2:#17181B;--card:#1D1F23;--card2:#25282D;--line:#2E3137;--tx:#F3F3F1;--tx2:#A9ADB4;--tx3:#6E737B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.ttl b{font-size:16px;font-weight:900;letter-spacing:-.02em}
.ttl span{font-size:12px;color:var(--tx2);font-weight:600}
.clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:800;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.tabs{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:36px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--tx2);font-size:14px;font-weight:800;white-space:nowrap}
.tab.on{background:var(--card2);color:var(--tx)}
.tab .n{font-size:11px;opacity:.7;margin-left:4px}
main{padding:14px 16px 120px;max-width:1500px;margin:0 auto}
.hidden{display:none!important}

/* ── 진행(라이브) ── */
.live{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cols3{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.col{border-radius:14px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-top:4px solid var(--tx3);min-width:0}
.c-mc{border-top-color:var(--acc)}.c-scr{border-top-color:var(--bgm)}.c-snd{border-top-color:var(--sfx)}
.colh{font-size:15px;font-weight:900;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.colh small{font-size:11.5px;font-weight:700;color:var(--tx3)}
.c-mc .colh{color:var(--acc2)}.c-scr .colh{color:var(--bgm)}.c-snd .colh{color:var(--sfx)}
.scrWhat{font-size:clamp(20px,1.8vw,26px);font-weight:900;letter-spacing:-.02em;line-height:1.25}
.scrWhat.dim{color:var(--tx2);font-size:18px}
.keep{font-size:12px;font-weight:800;color:var(--tx3);margin-bottom:4px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file{font-size:13px;font-weight:800;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--bgm) 16%,var(--card));border:1px solid color-mix(in srgb,var(--bgm) 40%,transparent);font-variant-numeric:tabular-nums}
.stype{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.nextrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg2);font-size:14px}
.nextrow .nl{font-size:11px;font-weight:900;color:var(--tx3);letter-spacing:.06em}
.nextrow .t2{color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.tag.scr{color:var(--bgm)}.tag.snd{color:var(--sfx)}
.li .ic2{font-size:10px;margin-left:3px;opacity:.8}.live>*{min-width:0}.nav button:disabled{opacity:.45;cursor:not-allowed}.gonext{white-space:normal;line-height:1.3}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:120px}
.li{display:grid;grid-template-columns:22px 30px 44px 1fr;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.li:hover{background:var(--card2)}
.li .no{color:var(--tx3);font-weight:800;font-variant-numeric:tabular-nums}
.li .tm{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:12px}
.li .sg{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ic{font-size:11px;color:var(--sfx);margin-left:4px}
.li.done .sg,.li.done .tm{color:var(--tx3);text-decoration:line-through}
.li.cur{background:var(--acc);color:#fff}
.li.cur .no,.li.cur .tm,.li.cur .ic{color:#fff}
.li.view:not(.cur){outline:2px solid var(--acc);outline-offset:-2px}
.li.sec{background:var(--bg2);font-size:11px;color:var(--tx3);font-weight:800;letter-spacing:.04em;cursor:default;grid-template-columns:1fr;padding:6px 10px}
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--tx3);display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:transparent;padding:0;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}

.now{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.nowhd{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.badge{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--live);color:#fff;letter-spacing:.04em}
.badge.peek{background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.nowhd .big{font-size:26px;font-weight:900;letter-spacing:-.03em}
.nowhd .t{font-size:18px;font-weight:800;color:var(--tx2);font-variant-numeric:tabular-nums}
.nowbd{padding:16px 18px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h4{margin:0 0 4px;font-size:11.5px;font-weight:800;color:var(--tx3);letter-spacing:.04em}
.box p{margin:0;font-size:15px;font-weight:700;white-space:pre-wrap;line-height:1.45}
.box.go{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card2))}
.box.go h4{color:var(--acc2)}
.script{font-size:clamp(17px,1.5vw,21px);line-height:1.7;font-weight:600;white-space:pre-wrap;word-break:keep-all}
.script .stage{color:var(--warn);font-weight:700;font-size:.85em}
.empty{color:var(--tx3);font-size:14px}
.nav{display:flex;gap:10px;padding:0 18px 18px}
.nav button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:16px;font-weight:900;padding:0 18px}
.nav .gonext{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-size:19px}
.nav .gonext:disabled{opacity:.4}
.nav .back{background:var(--card2)}
.kbd{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.75;margin-left:6px;font-weight:700}
.peekbar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 18px;background:color-mix(in srgb,var(--warn) 18%,var(--card));font-size:13px;font-weight:800}
.peekbar button{height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--warn);color:#111;font-weight:900}

.side{display:grid;gap:14px;position:sticky;top:120px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel>h3{margin:0 0 10px;font-size:13px;font-weight:900;color:var(--tx2);display:flex;align-items:center;justify-content:space-between}
.next .seg{font-size:17px;font-weight:900}
.next .meta{font-size:12.5px;color:var(--tx2);margin-top:4px;white-space:pre-wrap}

/* ── 사운드 버튼 ── */
.snd{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);padding:10px 12px;overflow:hidden}
.snd+.snd{margin-top:8px}
.snd .pl{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sfx);color:#fff;font-size:16px;font-weight:900}
.snd.bgm .pl{background:var(--bgm)}
.snd .nm{font-size:15px;font-weight:900;line-height:1.25}
.snd .nm small{display:block;font-size:11.5px;font-weight:700;color:var(--tx2);margin-top:2px}
.snd .rt{font-size:11px;font-weight:800;color:var(--tx3);text-align:right;white-space:nowrap}
.snd .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--sfx);width:0}
.snd.bgm .prog{background:var(--bgm)}
.snd.playing{border-color:var(--sfx);background:color-mix(in srgb,var(--sfx) 16%,var(--card2))}
.snd.bgm.playing{border-color:var(--bgm);background:color-mix(in srgb,var(--bgm) 16%,var(--card2))}
.snd.playing .pl{animation:pulse 1s infinite}
.snd.missing{opacity:.55;border-style:dashed}
.snd.missing .pl{background:var(--tx3)}
.snd:disabled{cursor:not-allowed}
@keyframes pulse{50%{transform:scale(.9)}}
.stopall{width:100%;height:46px;margin-top:10px;border-radius:12px;border:0;background:var(--bad);color:#fff;font-size:15px;font-weight:900}
.hint{font-size:12px;color:var(--tx3);line-height:1.5;margin-top:8px}
.warnbox{font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);margin-top:8px;font-weight:600}

/* ── 음향 보드 ── */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.slot .snd{margin:0}
.slot .desc{font-size:12.5px;color:var(--tx2);line-height:1.5}
.slot .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-weight:800}
.chip{padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.lnk{background:none;border:0;padding:0;font-size:12px;font-weight:800;color:var(--acc2);text-decoration:underline;text-underline-offset:2px}
.drop{outline:2px dashed var(--acc);outline-offset:-4px}
.mixer{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.mixer label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.mixer input[type=range]{width:160px;accent-color:var(--acc)}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:800}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
h2.sec{font-size:15px;font-weight:900;margin:18px 0 10px;color:var(--tx2)}

/* ── 표(마이크·사운드체크·비상) ── */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.tbl th{background:var(--bg2);text-align:left;font-size:12px;color:var(--tx3);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;white-space:pre-wrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.done td{color:var(--tx3)}
.tbl td.k{font-weight:900}
.cards{display:none}

/* ── 바로가기 ── */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lk{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.lk b{display:block;font-size:16px;font-weight:900}
.lk span{display:block;font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.5}
.lk i{font-style:normal;font-size:11px;font-weight:800;color:var(--warn)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:800;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.nowplay{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:800;flex-wrap:wrap}
.nowplay .np{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.nowplay .np button{border:0;background:none;padding:0 0 0 4px;font-weight:900;color:var(--bad)}
.nowplay .x{margin-left:auto;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--bad);color:#fff;font-weight:900}

@media (max-width:1280px){ .cols3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .c-mc{grid-column:1 / -1} }
@media (max-width:1100px){
  .live{grid-template-columns:1fr}
  .cols3{grid-template-columns:1fr}
  .list{position:static;max-height:260px;order:3}
  .side{position:static}
}
@media (max-width:640px){
  .bar{padding:8px 16px}
  .clock{font-size:20px;margin-left:0}.ttl b{font-size:14px}main{padding:12px 16px 120px}
  .grid2{grid-template-columns:1fr}
  .nowhd .big{font-size:21px}
  .nav button{height:52px;padding:0 12px}
  .tbl{display:none}
  .cards{display:grid;gap:10px}
  .cards .box p{font-size:14px}
  .mixer input[type=range]{width:120px}
}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="ttl"><b>SMART HOME INTERIOR 2026 · 운영 콘솔</b><span>11월 19일(목) 코엑스 401호 · 큐시트 F 기준</span></div>
    <div class="clock" id="clock">--:--:--</div>
    <span class="pill" id="sync"><span class="dot" id="syncDot"></span><span id="syncTx">연결 중</span></span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="live">▶ 진행</button>
    <button class="tab" data-tab="sound">🔊 음향 보드</button>
    <button class="tab" data-tab="mic">🎤 마이크</button>
    <button class="tab" data-tab="check">✅ 사운드체크</button>
    <button class="tab" data-tab="sos">🚨 비상 대응</button>
    <button class="tab" data-tab="links">🔗 바로가기</button>
  </nav>
</div>

<main>
  <section id="t-live" class="live">
    <div class="list" id="cueList" aria-label="큐 목록"></div>
    <div class="now" id="now"></div>
  </section>

  <section id="t-sound" class="hidden">
    <div class="mixer">
      <label>🔊 효과음 <input type="range" id="volSfx" min="0" max="100"><span id="volSfxTx"></span></label>
      <label>🎵 BGM <input type="range" id="volBgm" min="0" max="100"><span id="volBgmTx"></span></label>
      <span class="chip" id="readyChip"></span>
      <span style="flex:1"></span>
      <label class="btn" style="cursor:pointer">📁 폴더에서 한 번에 넣기<input type="file" id="dirIn" webkitdirectory multiple hidden></label>
      <button class="btn" data-stopall>■ 전체 정지</button>
    </div>
    <div class="warnbox" id="soundWarn" style="margin:0 0 12px"></div>
    <h2 class="sec">효과음 (SFX) — 누르면 처음부터 재생, 숫자키 1~8</h2>
    <div class="board" id="boardSfx"></div>
    <h2 class="sec">배경음악 (BGM) — 반복 재생, 다시 누르면 서서히 꺼짐</h2>
    <div class="board" id="boardBgm"></div>
    <p class="hint" id="soundFoot"></p>
  </section>

  <section id="t-mic" class="hidden"><div id="micBody"></div></section>
  <section id="t-check" class="hidden"><div id="checkBody"></div></section>
  <section id="t-sos" class="hidden"><div id="sosBody"></div></section>
  <section id="t-links" class="hidden"><div class="links" id="linkBody"></div></section>
</main>

<div class="nowplay hidden" id="nowplay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

    });
  } catch(e){ sync('bad', '오프라인'); }
