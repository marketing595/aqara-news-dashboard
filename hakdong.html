<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>학동 스마트 인테리어 MAP · AqaraLife</title>
  <meta name="description" content="학동역~도산대로 인테리어 거리, 발품 파는 분들을 위한 쇼룸 가이드 지도. 타일·주방·스위치·가구 쇼룸 + 아카라라이프 쇼룸 웰컴 쿠폰." />
  <meta property="og:title" content="학동 스마트 인테리어 MAP · AqaraLife" />
  <meta property="og:description" content="쇼룸 투어 필수 지도 · 학동 인테리어 발품 길잡이. 아카라라이프 쇼룸에서 커피 한 잔 쉬어가세요." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/favicon-hakdong.png?v=1" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon-hakdong.png?v=1" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- 네이버 지도 API v3 (네이버 클라우드 Maps · Dynamic Map). Client ID는 등록한 사이트 주소에서만 동작한다 -->
  <script>window.navermap_authFailure=function(){ window.NAVER_AUTH_FAIL=true; var m=document.getElementById("map"); if(m) m.innerHTML="<p class=\"mapfail\">지도를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>"; };</script>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=lol15vdpcd"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <!-- Firebase: ONLY MKT에서 고친 스팟 정보(hakdong/spots) 반영 + 쿠폰 발급 집계(hakdong/coupons). 연결 안 돼도 페이지는 동작 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    /* ─────────────────────────────────────────────────────────────────
       학동 스마트 인테리어 MAP — 2026-10-16 재설계
         레이아웃 : 에어비앤비·네이버 지도식 split-screen. 좌 = 필터·목록 패널 / 우 = 전체 지도
         기억점   : '자재 샘플 칩'. 학동은 타일·마루·수전 쇼룸 거리라, 카테고리·목록 번호·지도 핀을
                    모두 같은 작은 사각 칩으로 그린다 → 목록 번호와 지도 핀이 한눈에 이어진다
         규칙     : 폰트는 Pretendard 하나, 아이콘은 Iconify(lucide) 하나.
                    대문자 영문 라벨·장식용 번호·가운뎃점 메타 줄·화살표 링크 금지.
                    옐로(#FBC400)는 채움 전용(버튼·아카라 핀·선택 표시). 밝은 배경 위 글자색 금지
       ───────────────────────────────────────────────────────────────── */
    :root{
      --paper:#FFFFFF; --ground:#F4F4F2;
      --ink:#1A1A1A; --ink2:#55554F; --muted:#8A8A84; --muted2:#6B6B66;   /* muted2 = 흰 배경 4.5:1 이상 */
      --line:#E7E6E2; --line2:#D6D5D0;
      --accent:#FBC400; --accent-soft:#FFF7DB; --on-accent:#1A1A1A;
      --dark:#1A1A1A;
      --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
      --hdr:56px; --pad:20px; --chip:6px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
      -webkit-font-smoothing:antialiased;letter-spacing:-0.01em;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;color:inherit}
    /* 첫 방문 튜토리얼 */
    .tour{position:fixed;inset:0;z-index:10000}   /* 헤더(9999)보다 위 */
    .tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,20,18,.58);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
    .tour-card{position:fixed;width:min(320px,calc(100vw - 24px));background:var(--paper);border-radius:14px;padding:18px 18px 14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.45);transition:left .25s ease,top .25s ease}
    .tour-card .tour-step{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted2);font-variant-numeric:tabular-nums}
    .tour-card h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-0.03em}
    .tour-card p{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
    .tour-acts{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
    .tour-skip{border:0;background:none;padding:8px 4px;font-size:13px;color:var(--muted2)}
    .tour-skip:hover{color:var(--ink)}
    .logo{height:1.05em;width:auto;vertical-align:-0.12em;display:inline-block}
    iconify-icon{display:inline-block;width:1em;height:1em;flex:none;vertical-align:-0.125em}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
    @media (prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    }

    /* ─── 헤더 : 왼쪽 서비스 이름, 오른쪽 이동 + 쿠폰 ─── */
    header{position:sticky;top:0;z-index:9999;height:var(--hdr);background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center}
    .hdr-in{width:100%;padding:0 24px;display:flex;justify-content:flex-end;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand .mark{width:28px;height:28px;border-radius:var(--chip);background:var(--accent);display:grid;place-items:center;font-size:16px;color:var(--on-accent);flex:none}
    .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand span{font-size:13px;color:var(--muted2);white-space:nowrap}
    .hdr-nav{display:flex;gap:4px;align-items:center}
    .nav-link{font-size:14px;font-weight:500;background:none;border:0;padding:8px 12px;border-radius:980px;white-space:nowrap;transition:background .15s}
    .nav-link:hover{background:var(--ground)}

    /* 버튼 */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;transition:border-color .15s,background .15s;white-space:nowrap;line-height:1.2}
    .btn:hover{border-color:var(--ink)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .btn.primary:hover{background:#FFD22E;border-color:#FFD22E}
    .btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
    .btn.sm{padding:7px 12px;font-size:13px}
    .hdr-nav .btn{margin-left:8px;padding:9px 16px;font-size:14px}

    /* ─── 레이아웃 ─── */
    .wrap{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}
    aside{background:var(--paper);display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}

    /* 상단 타이틀 — 어두운 띠 대신 흰 바탕 위 타이포 위계로 */
    .hero-section{padding:28px var(--pad) 24px;background:#F3F4F6;border-bottom:1px solid #E5E7EB}   /* 흰 패널과 구분되는 연회색 띠 + 경계선 */
    .hero-title{font-size:28px;font-weight:700;letter-spacing:-0.04em;line-height:1.2;margin:0 0 8px;color:#111827}
    .hero-subtitle{font-size:13px;font-weight:500;color:#4B5563;margin:0;letter-spacing:0}   /* 연회색 위 대비 7:1 */

    /* 카카오맵식 아이콘 메뉴 : 아이콘 위, 글자 아래. 4칸을 같은 폭으로 */
    .mytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px 8px 0;border-bottom:1px solid var(--line)}
    .mytabs button{border:0;background:none;padding:12px 0 10px;font-size:12px;font-weight:600;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;position:relative}
    .mytabs button svg,.mytabs button iconify-icon{width:22px;height:22px;font-size:22px}
    .mytabs button svg{fill:none;stroke:currentColor;stroke-width:1.8}
    .mytabs button em{position:absolute;top:6px;left:calc(50% + 8px);font-style:normal;font-size:10px;font-weight:700;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--line);color:var(--ink2);font-variant-numeric:tabular-nums}
    .mytabs button.route.has em{background:var(--accent);color:var(--on-accent)}
    .mytabs button:hover{color:var(--ink)}
    .mytabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
    .mytabs button.route.on svg,.mytabs button.route.has svg{fill:var(--accent);stroke:#B98F00}

    /* 검색 + 카테고리 필터 */
    .tools{padding:14px var(--pad) 12px;border-bottom:1px solid var(--line)}
    .search{position:relative}
    .search input{width:100%;height:44px;border:1px solid var(--line2);border-radius:980px;background:var(--paper);padding:0 16px 0 42px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
    .search input::placeholder{color:var(--muted)}
    .search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,26,.06)}
    .search iconify-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--muted2)}
    .cats{display:flex;flex-wrap:wrap;gap:6px 5px;margin-top:12px}
    .cats::-webkit-scrollbar{display:none}
    .cat{flex:none;border:1px solid var(--line2);background:var(--paper);height:32px;padding:0 11px;border-radius:980px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
    .cat .dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
    .cat .no{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
    .cat.on .no{color:rgba(255,255,255,.6)}
    .cat .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
    .cat:hover{border-color:var(--ink)}
    .cat.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
    .cat.on .n{color:rgba(255,255,255,.7)}
    .cat.on .dot{box-shadow:0 0 0 1.5px #fff}

    /* 카테고리 설명 한 줄 (사용자 요청: 블루그레이 띠 유지) */
    .catdesc{padding:11px var(--pad);font-size:13px;color:#24495C;background:#E4ECF0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
    .catdesc .dot{width:10px;height:10px;border-radius:2px;flex:none;margin-top:5px}
    .catdesc b{display:block;color:#173A4C;font-weight:700}
    .catdesc .ko{display:block}

    /* ─── 목록 ─── */
    .list{overflow:auto;flex:1;min-height:0;padding:0 0 24px;scroll-behavior:smooth}
    .sec{display:flex;align-items:center;gap:8px;padding:22px var(--pad) 8px;position:sticky;top:0;background:var(--paper);z-index:2}
    .sec i{flex:1}
    .sec .no{font-size:12px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
    .sec em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
    .sec div{display:flex;align-items:baseline}
    .sec b{font-size:13px;font-weight:700;color:var(--ink2)}
    .sec .cnt{font-size:13px;color:var(--muted)}

    .spot{display:grid;grid-template-columns:28px 1fr auto;column-gap:12px;row-gap:3px;padding:14px var(--pad);cursor:pointer;position:relative;transition:background .15s}
    .spot + .spot{border-top:1px solid var(--line)}
    .spot:hover{background:#FAFAF8}
    .spot.active{background:var(--ground)}
    /* 번호 = 지도 핀과 같은 샘플 칩 */
    .spot .num{width:24px;height:24px;border-radius:var(--chip);background:var(--c);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center;align-self:center}
    .spot.hq .num{background:var(--accent);color:var(--on-accent)}
    .spot.hq{background:var(--accent-soft)}
    .spot.hq:hover{background:#FFF2C6}
    .spot .nm1{font-size:15px;font-weight:700;letter-spacing:-0.025em;line-height:24px;align-self:center;min-width:0}
    .spot .ds1{grid-column:2;font-size:13px;color:var(--ink2);line-height:1.55}
    .spot > .save.big{grid-column:3;grid-row:1 / span 2;align-self:center}
    .spot .chk{font-size:12px;color:var(--muted2);font-weight:500;margin-left:6px}
    .hqtag{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:4px;margin-left:7px;vertical-align:2px;white-space:nowrap;letter-spacing:0}
    /* 코스 탭 행 */
    .spot .en{display:block;font-size:12px;color:var(--muted2)}
    .spot .nm{font-size:15px;font-weight:700;letter-spacing:-0.025em;line-height:1.35;margin:1px 0 4px}
    .spot .ds{font-size:13px;color:var(--ink2);line-height:1.55}
    .spot .ad{font-size:12px;color:var(--muted2);margin-top:6px;display:flex;gap:8px;align-items:center}
    .spot .ad span{flex:1;min-width:0}
    .spot .ad .nv{color:var(--ink);font-weight:600;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:3px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
    .spot .ad .nv:hover{text-decoration-color:var(--ink)}

    /* 저장(별) */
    .save{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--muted2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
    .save svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2}
    .save.on svg{fill:var(--accent);stroke:#B98F00}
    .pp .save{font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;color:var(--ink)}
    .pp .save:hover{border-color:var(--ink)}
    .pp .save.on{background:var(--accent-soft);border-color:#E9C24A}
    .save.big{flex-direction:column;gap:1px;min-width:44px;padding:4px 2px;justify-content:center;border-radius:10px;transition:background .15s}
    .save.big span{font-size:11px;font-weight:600;color:var(--muted2)}
    .save.big svg{width:22px;height:22px;stroke-width:1.7;stroke:#9C9C96}
    .save.big:hover{background:var(--ground)}
    .save.big:hover svg{stroke:var(--ink)}
    .save.big.on svg{fill:var(--accent);stroke:#B98F00}

    /* 지도 위 컨트롤 — 흰 원·알약 + 옅은 그림자, 네이버·에어비앤비 지도 공통 문법 */
    .mapfab{position:absolute;left:16px;top:16px;z-index:500;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--paper);border-radius:980px;padding:10px 16px 10px 13px;font-size:14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.16)}
    .mapfab svg{width:16px;height:16px;fill:var(--accent);stroke:#B98F00;stroke-width:1.8}
    .mapfab em{font-style:normal;color:var(--muted2);font-weight:500}
    /* 카카오맵식 오른쪽 컨트롤 기둥 : 지도/스카이뷰 → 확대·축소 → 내 위치를 한 줄로 */
    .mapctl{position:absolute;right:16px;top:16px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .maptype{display:flex;background:var(--paper);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.16);overflow:hidden}
    .maptype button{border:0;background:none;padding:0 13px;height:36px;font-size:13px;font-weight:600;color:var(--muted2)}
    .maptype button + button{border-left:1px solid var(--line)}
    .maptype button.on{background:var(--ink);color:#fff}
    .zoombox{display:flex;flex-direction:column;background:var(--paper);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.16);overflow:hidden}
    .zoombox button{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:var(--ink);padding:0}
    .zoombox button + button{border-top:1px solid var(--line)}
    .zoombox button:hover,.maptype button:not(.on):hover{background:var(--ground)}
    .locbtn{width:40px;height:40px;border-radius:8px;border:0;background:var(--paper);color:var(--ink2);display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.16);padding:0;font-size:20px}
    /* 이 지역 재검색 : 지도를 직접 움직였을 때만 아래 가운데에 뜬다 */
    .research{position:absolute;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:500;border:0;background:var(--ink);color:#fff;border-radius:980px;padding:0 18px 0 14px;height:40px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;white-space:nowrap}
    .research.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .research iconify-icon{font-size:15px}
    .areabar{padding:10px var(--pad);font-size:13px;color:var(--ink2);background:var(--ground);border-bottom:1px solid var(--line);display:none;align-items:center;gap:8px}
    .areabar.show{display:flex}
    .areabar span{flex:1}
    .areabar b{color:var(--ink)}
    .areabar button{border:0;background:none;padding:4px 0;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
    .locbtn.on{color:#1A73E8}
    .locbtn.follow{background:#1A73E8;color:#fff}
    .locbtn.wait iconify-icon{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .me{width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-sizing:border-box;animation:mepulse 2s ease-out infinite}
    @keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(26,115,232,.45),0 1px 5px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 16px rgba(26,115,232,0),0 1px 5px rgba(0,0,0,.4)}}
    .nextbar{position:absolute;left:16px;right:76px;bottom:30px;z-index:500;background:var(--paper);border-radius:12px;padding:10px 10px 10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.18);font-size:12px;color:var(--ink2);max-width:420px}
    .nextbar.show{display:flex}
    .nextbar .stepno{flex:none}
    .nextbar div{flex:1;min-width:0}
    .nextbar b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .nextbar .go{flex:none;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700}

    /* 코스 탭 */
    .spot.done .stepno{background:var(--ink);color:#fff}
    .spot.done .nm{opacity:.5}
    .rhead{padding:20px var(--pad) 18px;border-bottom:1px solid var(--line)}
    .rhead .ey{font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:4px}
    .rhead b{display:block;font-size:18px;font-weight:700;letter-spacing:-0.03em;margin-bottom:2px}
    .rhead p{margin:0;font-size:13px;color:var(--ink2)}
    .rhead .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
    .shared{margin-top:12px;padding:10px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .shared span{flex:1;min-width:160px}
    .stepno{width:24px;height:24px;border-radius:var(--chip);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
    .spot .num .stepno{margin:0}
    .spot .num:has(.stepno){background:none}
    .ctl{display:inline-flex;gap:2px;flex:none}
    .ctl button{border:1px solid var(--line2);background:var(--paper);color:var(--ink2);width:26px;height:24px;border-radius:6px;font-size:11px;line-height:1;padding:0}
    .ctl button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
    .ctl button:disabled{opacity:.35;cursor:default}
    .leg{padding:6px var(--pad) 6px 60px;font-size:12px;color:var(--muted2);background:var(--ground);font-variant-numeric:tabular-nums}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:2000;background:var(--dark);color:#fff;border-radius:12px;padding:10px 10px 10px 16px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:.22s ease;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .toast button{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700}
    .empty{margin:0;padding:56px var(--pad);text-align:center;font-size:14px;color:var(--muted2);line-height:1.8}
    .empty b{color:var(--ink)}

    /* 목록 맨 아래 쇼룸 안내 */
    .foot{margin:16px var(--pad) 0;padding:18px;border-radius:12px;background:var(--ground)}
    .foot .ft{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted2);margin-bottom:6px}
    .foot b{display:block;font-size:15px;font-weight:700;letter-spacing:-0.025em}
    .foot p{margin:2px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
    .foot .fa{margin-top:12px}
    .foot .fn{font-size:12px;color:var(--muted2);margin-top:10px}
    .foot .fn:empty{display:none}

    /* ─── 지도 ─── */
    .mapwrap{position:relative;min-height:0;min-width:0;background:var(--ground)}
    #map{position:absolute!important;inset:0;width:100%;height:100%;background:var(--ground)}   /* 네이버 지도가 컨테이너에 position:relative를 넣어 높이가 0이 되는 걸 막는다 */
    .mapfail{position:absolute;inset:0;margin:0;display:grid;place-items:center;font-size:14px;color:var(--muted2);text-align:center;padding:24px}
    /* 핀 = 자재 샘플 칩 */
    .pin{width:26px;height:26px;border-radius:var(--chip);background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .15s}
    .pin.on{transform:scale(1.25);box-shadow:0 0 0 2px var(--ink),0 6px 14px rgba(0,0,0,.3)}
    .pin.step{background:var(--accent);color:var(--on-accent);border-color:#fff;box-shadow:0 0 0 1.5px var(--ink),0 2px 6px rgba(0,0,0,.28)}
    .hqpin{position:relative;width:46px;height:46px}
    .hqpin .core{position:absolute;inset:0;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.02em;border:3px solid #fff;box-shadow:0 6px 18px -5px rgba(0,0,0,.45);animation:pulse 2.4s ease-out infinite}
    .hqpin .wc{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,196,0,.55),0 6px 18px -5px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 18px rgba(251,196,0,0),0 6px 18px -5px rgba(0,0,0,.45)}}
    /* 정보 카드 = 네이버 InfoWindow 안에 그리는 흰 카드. 여백은 카드의 padding으로 */
    .nwin{position:relative;width:280px;background:var(--paper);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:22px 20px 20px;font-size:13px;line-height:1.55;color:var(--ink);font-family:var(--font);letter-spacing:-0.01em;word-break:keep-all}
    .nwin .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;background:none;border-radius:50%;font-size:18px;color:var(--muted2);display:grid;place-items:center;padding:0}
    .nwin .x:hover{background:var(--ground);color:var(--ink)}
    .nwin .pp .nm{padding-right:24px}
    .nwin::after{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:14px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}   /* 핀을 가리키는 꼬리 */
    .pp .en{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted2)}
    .pp .nm{font-size:16px;font-weight:700;letter-spacing:-0.03em;margin:4px 0 8px}
    .pp .ds{color:var(--ink2)}
    .pp .ad{color:var(--muted2);font-size:12px;margin-top:6px}
    .pp .acts{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}
    .pp .acts .btn,.pp .acts .save{padding-top:9px;padding-bottom:9px}
    .badge-hl{display:inline-block;font-size:11px;font-weight:700;background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:4px;margin-bottom:6px}
    .legend{position:absolute;left:16px;bottom:16px;z-index:400;background:rgba(255,255,255,.94);border-radius:10px;padding:10px 12px;font-size:12px;display:grid;gap:5px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
    .legend div{display:flex;align-items:center;gap:8px;color:var(--ink2)}
    .legend .dot{width:10px;height:10px;border-radius:2px;flex:none}

    /* 모바일 지도↔목록 전환 */
    .mtoggle{display:none;position:sticky;top:var(--hdr);z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding:0 16px}
    .mtoggle .seg{display:flex;flex:1;gap:24px}
    .mtoggle button{border:0;background:none;padding:12px 0;font-size:14px;font-weight:600;color:var(--muted2);border-bottom:2px solid transparent;transition:.15s}
    .mtoggle button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

    /* ─── 쿠폰 모달 ─── */
    .ov{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
    .ov.show{display:flex}
    .md{background:var(--paper);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 24px 64px -16px rgba(0,0,0,.4);position:relative}
    .md .hd{padding:28px 28px 4px;position:relative}
    .md .hd .ey{font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:8px;letter-spacing:.02em}
    .md .hd h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-0.035em;line-height:1.3;padding-right:36px}
    .md .hd p{margin:0;font-size:14px;color:var(--ink2)}
    .md .x{position:absolute;right:16px;top:16px;background:none;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;display:grid;place-items:center;z-index:1;color:var(--ink)}
    .md .x:hover{background:var(--ground)}
    .md .x:focus-visible{outline-offset:-2px}
    .md .bd{padding:12px 28px 28px}
    .bn{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:14px 0}
    .bn + .bn{border-top:1px solid var(--line)}
    .bn .ic{width:40px;height:40px;border-radius:10px;background:var(--ground);display:grid;place-items:center;font-size:20px;color:var(--ink)}
    .bn .k{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted2);text-transform:uppercase;margin-bottom:2px}
    .bn .tg{display:inline-block;font-size:12px;font-weight:600;color:#7A5B00;background:var(--accent-soft);border-radius:6px;padding:3px 8px;margin-top:8px}
    .bn b{font-size:15px;font-weight:700;letter-spacing:-0.025em;display:block}
    .bn p{margin:3px 0 0;font-size:13px;color:var(--ink2)}
    .coupon{margin-top:12px;border-radius:12px;padding:22px 20px 18px;background:var(--ground);text-align:center}
    .coupon .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase;margin-bottom:12px}
    .coupon .code{font-size:15px;font-weight:600;color:var(--ink2)}
    .coupon .meta{font-size:13px;color:var(--muted2)}
    .coupon #qr{display:inline-block;padding:10px;background:#fff;border-radius:10px}
    .coupon #qr img,.coupon #qr canvas{display:block}
    .coupon .used-stamp{display:inline-block;margin:6px auto 2px;padding:6px 16px;border:2px solid #B3261E;border-radius:6px;color:#B3261E;font-size:18px;font-weight:800;letter-spacing:.08em;transform:rotate(-4deg)}
    .coupon .how{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.6}
    .fine{font-size:12px;color:var(--muted2);margin:16px 0 0;line-height:1.6}

    /* ─── Clean & Modern 레이어 (2026-10-20) ─────────────────────────
       여백 1.5배, 면은 회색 한 단계(#F3F4F6), 포인트는 옐로 하나, 그림자는 넓고 옅게.
       텍스트·구조는 그대로 두고 스타일만 바꾼다 ─── */
    :root{--pad:28px;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
      --soft:0 1px 2px rgba(17,24,39,.04),0 6px 24px rgba(17,24,39,.08)}
    .wrap{grid-template-columns:440px 1fr}
    aside{border-right-color:var(--g200)}
    /* 검색·카테고리 : 회색 면 + 깔끔한 글자 */
    .tools{padding:20px var(--pad) 20px;border-bottom-color:var(--g200)}
    .search input{height:46px;background:var(--g100);border-color:transparent;color:var(--g900)}
    .search input::placeholder{color:var(--g500)}
    .search input:focus{background:var(--paper);border-color:var(--g900);box-shadow:none}
    .cats{gap:8px;margin-top:16px}
    .cat{height:34px;padding:0 14px;gap:7px;background:var(--g100);border-color:transparent;color:var(--g700);font-weight:500}
    .cat:hover{border-color:transparent;background:var(--g200)}
    .cat .dot{width:8px;height:8px;border-radius:50%}
    .cat .no,.cat .n{color:var(--g500)}
    .cat.on{background:var(--g900);color:#fff}
    .cat.on .dot{box-shadow:none}
    .catdesc{padding:14px var(--pad);background:var(--g50);color:var(--g600);border-bottom-color:var(--g200)}
    .catdesc b{color:var(--g900)}
    .areabar{padding:12px var(--pad);background:var(--g50);border-bottom-color:var(--g200)}
    /* 탭 메뉴 : 타이틀과의 경계는 타이틀 쪽 선 하나로, 아래는 회색 선 */
    .mytabs{border-bottom-color:var(--g200);padding:8px 12px 0}
    .mytabs button{padding:12px 0 12px;color:var(--g500)}
    .mytabs button.on{color:var(--g900);border-bottom-color:var(--g900)}
    /* 목록 : 제목 > 설명 > 위치·시간 위계, 행 여백 1.5배 */
    .sec{padding:28px var(--pad) 10px}
    .sec b{color:var(--g900)}
    .sec .no,.sec em,.sec .cnt{color:var(--g500)}
    .spot{column-gap:16px;row-gap:6px;padding:20px var(--pad)}
    .spot + .spot{border-top-color:var(--g100)}
    .spot:hover{background:var(--g50)}
    .spot.active{background:var(--g100)}
    .spot .nm1{font-size:16px;font-weight:700;line-height:24px;color:var(--g900)}
    .spot .ds1{font-size:13.5px;line-height:1.6;color:var(--g600)}
    .spot .nm{font-size:16px;color:var(--g900)}
    .spot .ds{font-size:13.5px;line-height:1.6;color:var(--g600)}
    .spot .ad,.spot .en{color:var(--g500)}
    .spot.hq,.spot.hq:hover{background:var(--paper)}   /* 아카라 행도 흰 바탕 — 옐로는 번호 칩·쿠폰 태그에만 */
    .spot.hq.active{background:var(--g100)}
    .save.big svg{stroke:#9CA3AF}
    .leg{background:var(--g50);color:var(--g500)}
    .foot{margin:24px var(--pad) 0;padding:24px;background:var(--g50);border-radius:16px}
    .rhead{padding:24px var(--pad) 22px}
    /* 지도 위 : 그림자 넓고 옅게, 모서리 통일(12px · 알약) */
    .nwin{box-shadow:var(--soft);border-radius:16px;padding:24px 22px 22px}
    .hqpin .wc{box-shadow:0 2px 10px rgba(17,24,39,.12)}
    .pin{box-shadow:0 1px 4px rgba(17,24,39,.18)}
    .mapctl{right:20px;top:20px;gap:10px}
    .maptype{border-radius:980px;box-shadow:var(--soft);padding:3px;gap:2px}
    .maptype button{height:32px;padding:0 14px;border-radius:980px}
    .maptype button + button{border-left:0}
    .maptype button.on{background:var(--g900)}
    .zoombox{border-radius:12px;box-shadow:var(--soft)}
    .zoombox button + button{border-top-color:var(--g100)}
    .locbtn{border-radius:12px;box-shadow:var(--soft)}
    .mapfab{left:20px;top:20px;box-shadow:var(--soft)}
    .nextbar{box-shadow:var(--soft);border-radius:14px}
    .research{top:20px;bottom:auto;transform:translate(-50%,-8px);box-shadow:0 6px 20px rgba(17,24,39,.18)}   /* 범례가 아래 왼쪽을 쓰므로 위 가운데로 */
    /* 범례 : 지도 아래 왼쪽의 작은 플로팅 칩 한 줄 */
    .legend{left:20px;bottom:20px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 220px);padding:8px 14px;border-radius:980px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);box-shadow:var(--soft);font-size:11.5px}
    .legend div{gap:6px;color:var(--g600);white-space:nowrap}
    .legend .dot{width:8px;height:8px;border-radius:50%}
    /* 헤더 쿠폰 버튼 = 지도/스카이뷰와 같은 알약·높이 */
    .hdr-nav .btn{height:38px;padding:0 18px;border-radius:980px}
    /* ─── 모바일 ─── */
    @media (max-width:860px){
      :root{--hdr:52px;--pad:16px}
      .hdr-in{padding:0 16px;gap:10px}
      .brand span{display:none}
      .brand h1{font-size:16px}
      .hdr-nav .nav-link{display:none}
      .hdr-nav .btn{margin-left:0;padding:8px 13px;font-size:13px}
      .wrap{grid-template-columns:1fr;grid-template-rows:40vh minmax(0,1fr);height:auto;min-height:calc(100dvh - var(--hdr))}
      .wrap.list-only{grid-template-rows:0 minmax(0,1fr)}
      .wrap.list-only .mapwrap{display:none}
      aside{order:2;border-right:0}
      .mapwrap{order:1}
      .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:12px calc(var(--pad) * -1) 0;padding:0 var(--pad)}
      .sec{top:calc(var(--hdr) + 45px)}
      .list{overflow:visible}
      .legend{display:none}
      .mtoggle{display:flex}
    }
  </style>
</head>
<body>
  <header>
    <div class="hdr-in">
      <nav class="hdr-nav">
        <button class="nav-link" onclick="navMap()">지도 전체 보기</button>
        <button class="nav-link" onclick="flyHQ()">아카라라이프 쇼룸</button>
        <button class="nav-link" onclick="setFilter('route')">내 코스 <span id="rtCnt"></span></button>
        <button class="btn primary sm" onclick="openBenefit()">웰컴 쿠폰 받기</button>
      </nav>
    </div>
  </header>

  <div class="wrap" id="wrap">
    <aside>
      <div class="mtoggle" id="mtoggle">
        <div class="seg">
          <button id="mtMap" class="on" onclick="setMobileView('map')">지도 보기</button>
          <button id="mtList" onclick="setMobileView('list')">목록 · 검색</button>
        </div>
      </div>
      <!-- 다크 헤로 : 사진 없이 타이포만으로 무게를 준다. 쇼룸 CTA도 여기로 합쳤다 -->
      <!-- 상단 히어로 섹션 -->
      <div class="hero-section">
        <h1 class="hero-title" id="ttl">학동 스마트 인테리어 MAP</h1>
        <p class="hero-subtitle">Hakdong Interior Showroom Map</p>
      </div>
      <nav class="mytabs" id="mybar" aria-label="보기 전환"></nav>
      <div class="tools">
        <div class="search">
          <iconify-icon icon="lucide:search" aria-hidden="true"></iconify-icon>
          <label for="q" class="sr-only">쇼룸 검색</label>
          <input id="q" type="search" aria-label="쇼룸 검색" placeholder="브랜드 · 타일 · 주방 · 소파 … 검색" oninput="paint()" />
        </div>
        <nav class="cats" id="chips"></nav>
      </div>
      <div class="catdesc" id="catdesc"></div>
      <div class="areabar" id="areabar"></div>
      <div class="list" id="list" aria-live="polite"><p class="empty">쇼룸 목록을 불러오는 중…</p></div>
    </aside>
    <div class="mapwrap">
      <div id="map"></div>
      <button class="mapfab" id="mapfab" style="display:none" onclick="setFilter('route')"></button>
      <div class="mapctl">
        <div class="maptype" role="group" aria-label="지도 종류">
          <button id="mtRoad" class="on" onclick="setMapType('road')" aria-pressed="true">지도</button>
          <button id="mtSky" onclick="setMapType('sky')" aria-pressed="false">스카이뷰</button>
        </div>
        <div class="zoombox">
          <button onclick="zoomBy(1)" aria-label="확대" title="확대"><iconify-icon icon="lucide:plus" aria-hidden="true"></iconify-icon></button>
          <button onclick="zoomBy(-1)" aria-label="축소" title="축소"><iconify-icon icon="lucide:minus" aria-hidden="true"></iconify-icon></button>
        </div>
        <button class="locbtn" id="locbtn" onclick="toggleLocate()" aria-label="내 위치" title="내 위치" aria-pressed="false"><iconify-icon icon="lucide:locate-fixed" aria-hidden="true"></iconify-icon></button>
      </div>
      <button class="research" id="research" onclick="searchArea()"><iconify-icon icon="lucide:rotate-cw" aria-hidden="true"></iconify-icon>이 지역 재검색</button>
      <div class="nextbar" id="nextbar" aria-live="polite"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button onclick="hideToast();setFilter('route')">코스 보기</button></div>

  <!-- 혜택 모달 -->
  <div class="ov" id="ov" onclick="if(event.target===this)closeBenefit()">
    <div class="md" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
      <div class="hd">
        <button class="x" onclick="closeBenefit()" aria-label="닫기">×</button>
        <div class="ey"><img class="logo" src="aqaralife-logo-black.png" alt="AqaraLife"> SHOWROOM · 학동역 도보 3분</div>
        <h2 id="mdTitle">학동 쇼룸 투어 웰컴 쿠폰</h2>
        <p>학동 인테리어 거리를 돌아보시는 분들께 드려요. 쿠폰 받고 아카라라이프 쇼룸에서 쉬었다 가세요.</p>
      </div>
      <div class="bd">
        <div id="bnList"></div>
        <div class="coupon" id="coupon">
          <div class="eyebrow">Welcome Coupon</div>
          <div id="cpBody"></div>
        </div>
        <p class="fine" id="hqAddr"></p>
      </div>
    </div>
  </div>

<script>
  /* ───────── 데이터 ───────── */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAs_yQ1fgGKfRDKbkUb0lviIoJ2e00KRGA",
    authDomain: "aqara-weekly-1227c.firebaseapp.com",
    databaseURL: "https://aqara-weekly-1227c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "aqara-weekly-1227c",
    storageBucket: "aqara-weekly-1227c.firebasestorage.app",
    messagingSenderId: "869711080033",
    appId: "1:869711080033:web:9fc6fb53b272b942085820"
  };
  let DB=null, AUTH_OK=false;
  try{
    if(typeof firebase!=='undefined'){
      firebase.initializeApp(FIREBASE_CONFIG); DB=firebase.database();
      firebase.auth().signInAnonymously().catch(()=>{});
      firebase.auth().onAuthStateChanged(u=>{ AUTH_OK=!!u; if(u){ watchOverrides(); watchCoupon(); countVisit(); if(REDEEM) loadRedeem(); } });
    }
  }catch(e){ DB=null; }

  let DATA=null, SPOTS=[], CATS=[], OVER={}, MAP=null, MARK={}, FILTER='all', ACTIVE=null;
  const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const catOf=id=>CATS.find(c=>c.id===id)||{color:'#BFA97C',en:'',ko:''};
  // 네이버지도는 '상호+주소'를 같이 넣으면 '조건에 맞는 업체가 없습니다'가 뜬다 → 업체명만 검색(괄호 속 영문 표기는 제거)
  const naverUrl=s=>s.np?('https://map.naver.com/p/entry/place/'+encodeURIComponent(s.np)):('https://map.naver.com/p/search/'+encodeURIComponent(naverName(s)));   // np = 네이버 플레이스 ID(검증 완료분) → 바로 그 업체로
  const naverName=s=>(s.n||'').replace(/\s*\([^)]*\)/g,'').replace(/\s*(플래그십|브랜드)?\s*(쇼룸|갤러리|스토어 서울)$/,'').trim()||s.n;
  const brandHtml=t=>esc(t||'').replace('AqaraLife','<img class="logo" src="aqaralife-logo-black.png" alt="AqaraLife">');   // 브랜드명은 글자 대신 로고 이미지로
  const no2=n=>String(n).length<2?'0'+n:String(n);   // 카탈로그 목차처럼 01, 02 … 두 자리로

  /* ───────── 저장 · 나의 투어 코스 ─────────
     저장한 매장 id를 담은 순서대로 이 브라우저(localStorage)에만 둔다 — 로그인·개인정보 없음.
     ?route=id,id,… 링크로 남에게 코스를 넘길 수 있다(받은 쪽은 '이 코스 저장'을 눌러야 자기 코스가 바뀐다) */
  const RT_KEY='aqaraHakdongRoute';
  let ROUTE=[], SHARED=null, ROUTE_LINE=null, TOAST_T=null;
  try{ const r=JSON.parse(localStorage.getItem(RT_KEY)||'[]'); if(Array.isArray(r)) ROUTE=r.filter(x=>typeof x==='string'); }catch(e){}
  function saveRoute(){ try{ localStorage.setItem(RT_KEY,JSON.stringify(ROUTE)); }catch(e){} }
  const BM='<svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';   // 카카오맵처럼 별 = 저장
  const saveBtn=(id,cls)=>{ const on=ROUTE.includes(id);
    return `<button class="save ${cls||''} ${on?'on':''}" data-save="${esc(id)}" onclick="event.stopPropagation();toggleSave('${esc(id)}')" aria-pressed="${on}">${BM}<span>${on?'저장됨':'저장'}</span></button>`; };
  function toggleSave(id){
    const i=ROUTE.indexOf(id); if(i>-1) ROUTE.splice(i,1); else ROUTE.push(id);
    saveRoute();
    const s=SPOTS.find(x=>x.id===id);
    if(i<0) showToast(`내 코스에 담았어요 · ${ROUTE.length}곳`); else showToast(`${s?s.n:'매장'}을(를) 코스에서 뺐어요`);
    syncSave();
    if(FILTER==='route'){ paint(); paintMarkers(); }
  }
  // 목록·팝업에 흩어진 저장 버튼과 헤더 숫자를 한꺼번에 맞춘다
  function syncSave(){
    document.querySelectorAll('[data-save]').forEach(b=>{ const on=ROUTE.includes(b.dataset.save);
      b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); const t=b.querySelector('span'); if(t) t.textContent=on?'저장됨':'저장'; });
    const c=document.getElementById('rtCnt'); if(c) c.textContent=ROUTE.length?'· '+ROUTE.length:'';
    renderMyBar();
    if(INFO_ID&&INFO) INFO.setContent(winHtml(SPOTS.find(x=>x.id===INFO_ID)||{}));   // 열린 정보 카드의 저장 버튼도 맞춘다
  }
  // 카카오맵 패널처럼 맨 위 탭으로 '매장 찾기 / 내 코스'를 나눈다 — 내 코스는 카테고리와 섞지 않는다
  function renderMyBar(){
    const bar=document.getElementById('mybar'), fab=document.getElementById('mapfab'), n=ROUTE.length, rt=FILTER==='route';
    // 카카오맵 상단 메뉴처럼 아이콘 + 글자. 앞의 둘은 보기 전환, 뒤의 둘은 바로가기
    if(bar) bar.innerHTML=`<button class="${rt?'':'on'}" onclick="setFilter('all')" aria-pressed="${!rt}"><iconify-icon icon="lucide:search" aria-hidden="true"></iconify-icon>매장 찾기</button>`
      +`<button class="route ${rt?'on':''} ${n?'has':''}" onclick="setFilter('route')" aria-pressed="${rt}">${BM}내 코스${n?`<em>${n}</em>`:''}</button>`
      +`<button onclick="flyHQ()"><iconify-icon icon="lucide:store" aria-hidden="true"></iconify-icon>아카라 쇼룸</button>`
      +`<button onclick="openBenefit()"><iconify-icon icon="lucide:ticket" aria-hidden="true"></iconify-icon>웰컴 쿠폰</button>`;
    const tools=document.querySelector('.tools'); if(tools) tools.style.display=rt?'none':'';   // 코스 탭에서는 검색·카테고리를 접는다
    if(fab){ fab.style.display=(n&&!rt)?'':'none'; fab.innerHTML=`${BM}내 코스 <em>${n}</em>`; }
  }
  function showToast(m){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=m;
    t.classList.add('show'); clearTimeout(TOAST_T); TOAST_T=setTimeout(hideToast,2600); }
  function hideToast(){ document.getElementById('toast').classList.remove('show'); }
  const routeIds=()=>SHARED||ROUTE;
  const routeSpots=()=>routeIds().map(id=>SPOTS.find(s=>s.id===id)).filter(Boolean);
  // 두 지점 직선거리(m). 실제 걷는 길은 골목을 돌아가므로 ×1.3, 걸음은 분당 67m(시속 4km)로 어림한다
  function distM(a,b){ const R=6371000, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
    const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
  const walkM=(a,b)=>distM({lat:+a.lat,lng:+a.lng},{lat:+b.lat,lng:+b.lng})*1.3;
  const fmtWalk=m=>`도보 약 ${Math.max(1,Math.round(m/67))}분 · ${m<1000?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km'}`;
  function moveStep(id,d){ const i=ROUTE.indexOf(id), j=i+d; if(i<0||j<0||j>=ROUTE.length) return;
    [ROUTE[i],ROUTE[j]]=[ROUTE[j],ROUTE[i]]; saveRoute(); paint(); paintMarkers(); }
  // 첫 매장은 그대로 두고, 남은 곳은 '지금 위치에서 가장 가까운 곳'부터 차례로 잇는다
  function sortNearest(){ const ss=routeSpots(); if(ss.length<3) return;
    const out=[ss.shift()]; while(ss.length){ const cur=out[out.length-1]; let k=0;
      ss.forEach((s,i)=>{ if(walkM(cur,s)<walkM(cur,ss[k])) k=i; }); out.push(ss.splice(k,1)[0]); }
    ROUTE=out.map(s=>s.id); saveRoute(); paint(); paintMarkers(); showToast('가까운 순서로 다시 짰어요'); }
  function clearRoute(){ if(!ROUTE.length||!confirm('담아둔 코스를 모두 지울까요?')) return;
    ROUTE=[]; VISITED=[]; try{ sessionStorage.removeItem(VS_KEY); }catch(e){} saveRoute(); syncSave(); paint(); paintMarkers(); }
  function shareRoute(){ const ids=routeIds(); if(!ids.length) return;
    const url=location.origin+location.pathname+'?route='+ids.map(encodeURIComponent).join(',');
    const title='나의 학동 인테리어 투어 코스 ('+ids.length+'곳)';
    if(navigator.share&&window.innerWidth<=860){ navigator.share({title,url}).catch(()=>{}); return; }
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>showToast('코스 링크를 복사했어요')).catch(()=>prompt('코스 링크',url)); }
  function adoptShared(){ if(!SHARED) return; ROUTE=SHARED.slice(); SHARED=null; saveRoute(); syncSave(); paint(); paintMarkers(); showToast('이 코스를 내 코스로 저장했어요'); }
  function dropShared(){ SHARED=null; paint(); paintMarkers(); fitRoute(); }
  function fitRoute(){ const ss=routeSpots(); if(!MAP||!ss.length) return; unfollow();
    fitSpots(ss,70,17); }
  function routeHtml(){
    const ss=routeSpots(), ro=!!SHARED;
    let total=0; for(let i=1;i<ss.length;i++) total+=walkM(ss[i-1],ss[i]);
    let h=`<div class="rhead"><div class="ey">My Tour Course</div><b>${ro?'공유받은 학동 투어 코스':'나의 학동 투어 코스'}</b>
      <p>${ss.length?`${ss.length}곳${ss.length>1?' · 전체 '+fmtWalk(total):''}`:'아직 담은 매장이 없어요'}</p>`;
    if(ro) h+=`<div class="shared"><span>친구가 보낸 코스예요. 저장하면 지금 내 코스 대신 이 코스가 담겨요.</span><button class="btn primary sm" onclick="adoptShared()">이 코스 저장</button><button class="btn sm" onclick="dropShared()">내 코스 보기</button></div>`;
    else if(ss.length) h+=`<div class="acts"><button class="btn primary sm" onclick="startNav()">내 위치로 따라가기</button>${ss.length>2?'<button class="btn sm" onclick="sortNearest()">가까운 순으로 정리</button>':''}<button class="btn sm" onclick="shareRoute()">코스 공유</button><button class="btn sm" onclick="clearRoute()">모두 지우기</button></div>`;
    h+='</div>';
    if(!ss.length) return h+`<p class="empty">목록이나 지도에서 <b>저장</b>을 누르면<br>여기에 담은 순서대로 코스가 만들어져요.</p>`;
    ss.forEach((s,i)=>{ const c=catOf(s.cat), done=VISITED.includes(s.id);
      if(i) h+=`<div class="leg">↓ ${fmtWalk(walkM(ss[i-1],s))}</div>`;
      h+=`<div class="spot ${ACTIVE===s.id?'active':''} ${done?'done':''}" style="--c:${c.color}" data-id="${s.id}" onclick="focusSpot('${s.id}',true)" role="button" tabindex="0" aria-label="${i+1}번째 ${esc(s.n)} — 지도에서 보기">
        <div class="num"><span class="stepno" title="${done?'다녀옴':''}">${done?'✓':i+1}</span></div>
        <div><span class="en">${esc(c.ko)}</span>
          <div class="nm">${esc(s.n)}${s.hl?'<span class="hqtag">웰컴 쿠폰</span>':''}</div>
          <div class="ad"><span>${esc(s.a||'')}</span>
            ${ro?'':`<span class="ctl" onclick="event.stopPropagation()"><button onclick="moveStep('${s.id}',-1)" ${i===0?'disabled':''} aria-label="앞으로">↑</button><button onclick="moveStep('${s.id}',1)" ${i===ss.length-1?'disabled':''} aria-label="뒤로">↓</button><button onclick="toggleSave('${s.id}')" aria-label="코스에서 빼기">✕</button></span>`}
            ${dirLink(s,'nv','길찾기 ↗')}</div>
        </div></div>`; });
    return h+footHtml();
  }

  /* ───────── 내 위치 · 실시간 따라가기 ─────────
     네이버 지도 동그라미 버튼처럼 — 누르면 내 위치를 잡고 따라간다 · 지도를 끌면 따라가기만 풀린다 ·
     그때 다시 누르면 내 위치로 돌아온다 · 따라가는 중에 누르면 끈다.
     골목을 따라 걷는 실제 경로는 무료 지도 API로 그릴 수 없어 '길안내'에서 네이버 지도 도보 길찾기로 넘긴다.
     위치는 이 브라우저 안에서만 쓰고 어디에도 보내거나 저장하지 않는다(방문 표시만 이 탭 sessionStorage). */
  const VS_KEY='aqaraHakdongVisited';
  let ME=null, ME_MK=null, ME_ACC=null, ME_LINE=null, WATCH=null, FOLLOW=false, LOC_WAIT=false, VISITED=[];
  try{ const v=JSON.parse(sessionStorage.getItem(VS_KEY)||'[]'); if(Array.isArray(v)) VISITED=v; }catch(e){}
  function toggleLocate(){
    if(!navigator.geolocation){ showToast('이 브라우저에서는 위치를 쓸 수 없어요'); return; }
    if(WATCH===null){ FOLLOW=true; LOC_WAIT=true; updLoc();
      WATCH=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); return; }
    if(!FOLLOW){ FOLLOW=true; if(ME) flyTo(ME.lat,ME.lng,Math.max(MAP.getZoom(),17)); updLoc(); return; }
    stopLocate();
  }
  function stopLocate(){ if(WATCH!==null) navigator.geolocation.clearWatch(WATCH);
    WATCH=null; FOLLOW=false; LOC_WAIT=false; ME=null;
    [ME_MK,ME_ACC].forEach(drop); ME_MK=ME_ACC=null; updLoc(); }
  function startNav(){ if(window.innerWidth<=860) setMobileView('map');
    if(WATCH===null) toggleLocate(); else { FOLLOW=true; if(ME) flyTo(ME.lat,ME.lng,17); updLoc(); } }
  function onPos(p){ const first=!ME; LOC_WAIT=false;
    ME={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0}; const ll=LL(ME.lat,ME.lng);
    if(!ME_MK){ ME_ACC=new naver.maps.Circle({map:MAP,center:ll,radius:ME.acc,strokeColor:'#1A73E8',strokeWeight:1,strokeOpacity:.35,fillColor:'#1A73E8',fillOpacity:.1,clickable:false});
      ME_MK=new naver.maps.Marker({map:MAP,position:ll,icon:{content:'<div class="me"></div>',anchor:new naver.maps.Point(9,9)},zIndex:2000,clickable:false}); }
    else { ME_MK.setPosition(ll); ME_ACC.setCenter(ll); ME_ACC.setRadius(ME.acc); }
    if(FOLLOW){ if(first) flyTo(ME.lat,ME.lng,17,800); else MAP.panTo(ll); }
    if(first&&DATA&&DATA.hq&&distM(ME,DATA.hq)>5000) showToast('학동에서 멀리 계시네요 · 거리는 어림값이에요');
    checkArrive(); updLoc(); }
  function onPosErr(e){ if(ME&&e.code!==1) return;   // 이미 잡은 뒤 잠깐 끊긴 건 조용히 다음 신호를 기다린다
    stopLocate(); showToast(e.code===1?'위치 권한이 꺼져 있어요 · 브라우저 설정에서 허용해 주세요':'위치를 잡지 못했어요 · 잠시 뒤 다시 눌러 주세요'); }
  const nextStop=()=>routeSpots().find(s=>!VISITED.includes(s.id));
  // 코스 매장 근처(40~80m, GPS 오차만큼 여유)에 들어서면 방문으로 표시하고 다음 매장을 알려준다
  function checkArrive(){ if(!ME) return;
    routeSpots().forEach(s=>{ if(VISITED.includes(s.id)||distM(ME,{lat:+s.lat,lng:+s.lng})>Math.max(40,Math.min(ME.acc,80))) return;
      VISITED.push(s.id); try{ sessionStorage.setItem(VS_KEY,JSON.stringify(VISITED)); }catch(e){}
      const nx=nextStop(); showToast(`${s.n} 도착!`+(nx?` 다음은 ${nx.n}`:' 코스를 다 돌았어요'));
      if(FILTER==='route') paint(); }); }
  // 네이버 지도 웹 길찾기 주소는 좌표를 웹 메르카토르(EPSG:3857) 미터로 받는다
  const merc=(lat,lng)=>[lng*20037508.34/180,Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180)*20037508.34/180].map(v=>v.toFixed(4)).join(',');
  function dirUrl(s){
    const to=merc(+s.lat,+s.lng)+','+encodeURIComponent(naverName(s))+','+(s.np||'')+','+(s.np?'PLACE_POI':'ADDRESS_POI');
    const from=ME?merc(ME.lat,ME.lng)+','+encodeURIComponent('내 위치')+',,ADDRESS_POI':'-';
    return 'https://map.naver.com/p/directions/'+from+'/'+to+'/-/walk'; }
  // 휴대폰이면 네이버 지도 앱 도보 길안내(출발 = 앱이 잡는 실시간 내 위치)로, 앱이 없으면 웹 길찾기로 넘어간다
  function goDir(id){ const s=SPOTS.find(x=>x.id===id); if(!s||!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return true;
    const web=dirUrl(s), t=setTimeout(()=>{ if(!document.hidden) location.href=web; },1600);
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearTimeout(t); },{once:true});
    location.href=`nmap://route/walk?dlat=${s.lat}&dlng=${s.lng}&dname=${encodeURIComponent(naverName(s))}&appname=kr.aqara.hakdong`;
    return false; }
  const dirLink=(s,cls,label)=>`<a class="${cls}" href="${dirUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation();return goDir('${s.id}')">${label}</a>`;
  // 버튼 상태 · 코스 보기 중이면 '다음 매장' 바와 내 위치→다음 매장 점선
  function updLoc(){
    const b=document.getElementById('locbtn');
    if(b){ b.classList.toggle('on',WATCH!==null); b.classList.toggle('follow',WATCH!==null&&FOLLOW&&!!ME); b.classList.toggle('wait',LOC_WAIT); b.setAttribute('aria-pressed',WATCH!==null); }
    drop(ME_LINE); ME_LINE=null;
    const bar=document.getElementById('nextbar'), nx=(ME&&FILTER==='route')?nextStop():null;
    if(!bar) return; if(!nx){ bar.classList.remove('show'); return; }
    ME_LINE=new naver.maps.Polyline({map:MAP,path:[LL(ME.lat,ME.lng),LL(nx.lat,nx.lng)],strokeColor:'#1A73E8',strokeWeight:3,strokeOpacity:.7,strokeStyle:'shortdot',strokeLineCap:'round',clickable:false});
    bar.innerHTML=`<span class="stepno">${routeIds().indexOf(nx.id)+1}</span><div>다음 매장 · ${fmtWalk(walkM(ME,nx))}<b>${esc(nx.n)}</b></div>${dirLink(nx,'go','길안내')}`;
    bar.classList.add('show'); }
  function unfollow(){ if(FOLLOW){ FOLLOW=false; updLoc(); } }

  fetch('hakdong.json?_='+Date.now()).then(r=>r.json()).then(d=>{ DATA=d; CATS=d.categories; boot(); })
    .catch(()=>{ document.getElementById('list').innerHTML='<p style="padding:30px;text-align:center;color:#382D18">자료를 불러오지 못했어요. 새로고침해 주세요.</p>'; });

  /* ONLY MKT에서 고친 스팟 정보(좌표·설명·사진·숨김)를 얹는다 — 없으면 json 원본 그대로 */
  function watchOverrides(){ if(!DB) return;
    DB.ref('hakdong/spots').on('value',s=>{ OVER=s.val()||{}; if(DATA) applyOver(); });
  }
  function applyOver(){
    SPOTS=DATA.spots.map(s=>Object.assign({},s,OVER[s.id]||{}));
    Object.keys(OVER).forEach(id=>{ if(!DATA.spots.some(s=>s.id===id)&&OVER[id]&&OVER[id].n) SPOTS.push(Object.assign({id},OVER[id])); });
    SPOTS=SPOTS.filter(s=>!s.hide&&isFinite(+s.lat)&&isFinite(+s.lng));
    paint(); paintMarkers();
  }

  // 좁은 창에서 카테고리 줄이 한 줄 가로 스크롤일 때, 마우스 휠(위아래)로도 옆으로 넘어가게
  document.getElementById('chips').addEventListener('wheel',e=>{
    const el=e.currentTarget; if(el.scrollWidth<=el.clientWidth||Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
    el.scrollLeft+=e.deltaY; e.preventDefault();
  },{passive:false});
  function boot(){
    document.getElementById('ttl').textContent=DATA.title||'학동 스마트 인테리어 MAP';
    document.title=(DATA.title||'학동 스마트 인테리어 MAP')+' · AqaraLife';
    document.getElementById('legend').innerHTML=CATS.map(c=>`<div><span class="dot" style="background:${c.color}"></span>${esc(c.ko)}</div>`).join('');
    document.getElementById('bnList').innerHTML=(DATA.benefits||[]).map((b,i)=>`<div class="bn"><div class="ic">${no2(i+1)}</div><div><div class="k">${esc(b.k||'')}</div><b>${esc(b.t)}</b><p>${esc(b.d)}</p>${b.tag?`<span class="tg">${esc(b.tag)}</span>`:''}</div></div>`).join('');
    const hq=DATA.spots.find(s=>s.hl)||DATA.spots.find(s=>s.cat==='iot')||{};
    document.getElementById('hqAddr').innerHTML=`아카라라이프 쇼룸 · ${esc(hq.a||'')}<br>견적·기프트 혜택의 상세 조건은 쇼룸에서 안내드려요.`;
    initMap(); applyOver();
    const p=new URLSearchParams(location.search);
    if(p.get('route')){ const ids=p.get('route').split(',').map(x=>x.trim()).filter(id=>SPOTS.some(s=>s.id===id));
      if(ids.length){ if(!ROUTE.length||ids.join()===ROUTE.join()){ ROUTE=ids; saveRoute(); } else SHARED=ids; setFilter('route'); } }
    else if(p.get('cat')) setFilter(p.get('cat'));
    syncSave();
    if(p.get('spot')) setTimeout(()=>focusSpot(p.get('spot')),400);
    if(REDEEM) openRedeem();
    else if(p.get('benefit')==='1') openBenefit();
    maybeTour();
  }

  /* ───────── 지도 (네이버 지도 API v3) ───────── */
  const LL=(lat,lng)=>new naver.maps.LatLng(+lat,+lng);
  const drop=o=>{ if(o) o.setMap(null); };   // 지도에서 걷어내기
  function flyTo(lat,lng,z,ms){ MAP.morph(LL(lat,lng),z,{duration:ms||600,easing:'easeOutCubic'}); }
  // 여러 매장이 한 화면에 들어오게. 너무 가까이 붙어 있으면 maxZ 이상으로는 당기지 않는다
  function fitSpots(ss,pad,maxZ){ if(!MAP||!ss.length) return;
    if(ss.length===1){ flyTo(ss[0].lat,ss[0].lng,Math.min(16,maxZ)); return; }
    const b=new naver.maps.LatLngBounds(LL(ss[0].lat,ss[0].lng),LL(ss[0].lat,ss[0].lng)); ss.forEach(s=>b.extend(LL(s.lat,s.lng)));
    MAP.fitBounds(b,{top:pad,right:pad,bottom:pad,left:pad}); if(MAP.getZoom()>maxZ) MAP.setZoom(maxZ,false); }
  let INFO=null, INFO_ID=null, USER_MOVE=false, AREA=null;   // AREA = '이 지역 재검색'으로 고정한 지도 범위(LatLngBounds)
  function initMap(){
    const hq=DATA.hq||{lat:37.5145,lng:127.031};
    if(typeof naver==='undefined'||!naver.maps||window.NAVER_AUTH_FAIL){ document.getElementById('map').innerHTML='<p class="mapfail">지도를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>'; return; }
    // 네이버 기본 컨트롤은 끄고, 오른쪽 컨트롤 기둥(.mapctl)의 자체 버튼을 쓴다. 로고·저작권 표기는 약관상 남기고 오른쪽 아래로(왼쪽 아래는 범례 자리)
    MAP=new naver.maps.Map('map',{center:LL(hq.lat+0.005,hq.lng+0.009),zoom:15,minZoom:7,
      zoomControl:false,mapTypeControl:false,scaleControl:false,
      logoControlOptions:{position:naver.maps.Position.BOTTOM_RIGHT},mapDataControlOptions:{position:naver.maps.Position.BOTTOM_RIGHT}});
    INFO=new naver.maps.InfoWindow({content:'',backgroundColor:'transparent',borderWidth:0,disableAnchor:true,pixelOffset:new naver.maps.Point(0,-18)});
    naver.maps.Event.addListener(MAP,'click',closeInfo);   // 빈 곳을 누르면 정보 카드를 닫는다
    naver.maps.Event.addListener(MAP,'dragstart',()=>{ unfollow(); USER_MOVE=true; });   // 손으로 지도를 옮기면 내 위치 따라가기만 푼다(위치 표시는 계속)
    // '이 지역 재검색'은 사용자가 직접 움직였을 때만 — morph·fitBounds 같은 자동 이동에는 띄우지 않는다
    const el=document.getElementById('map');
    el.addEventListener('wheel',()=>{ USER_MOVE=true; },{passive:true});
    el.addEventListener('touchstart',e=>{ if(e.touches.length>1) USER_MOVE=true; },{passive:true});
    naver.maps.Event.addListener(MAP,'dblclick',()=>{ USER_MOVE=true; });
    naver.maps.Event.addListener(MAP,'idle',()=>{ if(USER_MOVE&&FILTER!=='route') showResearch(true); USER_MOVE=false; });
  }
  function zoomBy(d){ if(!MAP) return; USER_MOVE=true; MAP.setZoom(MAP.getZoom()+d,true); }
  // 스카이뷰 = 네이버 위성사진 + 도로·지명(HYBRID)
  function setMapType(t){ if(!MAP) return; const sky=t==='sky';
    MAP.setMapTypeId(sky?naver.maps.MapTypeId.HYBRID:naver.maps.MapTypeId.NORMAL);
    [['mtRoad',!sky],['mtSky',sky]].forEach(([id,on])=>{ const b=document.getElementById(id); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }); }
  function showResearch(on){ const b=document.getElementById('research'); if(b) b.classList.toggle('show',!!on); }
  function searchArea(){ if(!MAP) return; AREA=MAP.getBounds(); showResearch(false); closeInfo(); paint(); paintMarkers(); }
  function clearArea(){ AREA=null; paint(); paintMarkers(); }
  const inArea=s=>!AREA||AREA.hasLatLng(LL(s.lat,s.lng));
  function pinHtml(s){ const c=catOf(s.cat);
    if(FILTER==='route'){ const k=routeIds().indexOf(s.id); if(k>-1) return `<div class="pin step" data-pid="${s.id}">${k+1}</div>`; }
    return s.hl?`<div class="hqpin"><span class="wc">Welcome Coupon</span><div class="core">AQARA</div></div>`:`<div class="pin" data-pid="${s.id}" style="--c:${c.color}">${no2(s._no)}</div>`; }
  function popupHtml(s){ const c=catOf(s.cat);
    return `<div class="pp" style="--c:${c.color}">${s.hl?'<span class="badge-hl">웰컴 쿠폰 · 커피 한 잔 쉬어가세요</span><br>':''}<span class="en">${brandHtml(s.en)}</span>
      <div class="nm">${esc(s.n)}</div>
      <div class="ds">${esc(s.d||'')}</div><div class="ad">${esc(s.a||'')}</div>
      <div class="acts">${s.hl?`<button class="btn primary sm" onclick="openBenefit()">웰컴 쿠폰</button>`:''}${s.id?saveBtn(s.id):''}<a class="btn sm" href="${naverUrl(s)}" target="_blank" rel="noopener">네이버지도 ↗</a></div></div>`; }
  const winHtml=s=>`<div class="nwin"><button class="x" onclick="closeInfo()" aria-label="닫기">×</button>${popupHtml(s)}</div>`;
  function openInfo(id){ const s=SPOTS.find(x=>x.id===id); if(!s||!MAP) return;
    const big=s.hl&&FILTER!=='route'; INFO_ID=id;
    INFO.setOptions({content:winHtml(s),pixelOffset:new naver.maps.Point(0,big?-34:-20)});
    INFO.open(MAP,LL(s.lat,s.lng)); }
  function closeInfo(){ if(INFO&&INFO.getMap()) INFO.close(); if(INFO_ID){ INFO_ID=null; setActive(null,false); } }
  function paintMarkers(){ if(!MAP) return;
    Object.values(MARK).forEach(drop); MARK={};
    drop(ROUTE_LINE); ROUTE_LINE=null;
    if(INFO_ID&&!visible().some(s=>s.id===INFO_ID)) closeInfo();
    document.getElementById('legend').style.display=FILTER==='route'?'none':'';   // 코스 보기의 핀은 분류색이 아니라 순번이라 범례를 숨긴다
    if(FILTER==='route'){ const ss=routeSpots(); if(ss.length>1) ROUTE_LINE=new naver.maps.Polyline({map:MAP,path:ss.map(s=>LL(s.lat,s.lng)),strokeColor:'#1D1D1F',strokeWeight:3,strokeOpacity:.75,strokeStyle:'shortdash',strokeLineCap:'round'}); }
    visible().forEach(s=>{
      const big=s.hl&&FILTER!=='route';   // 코스 보기에서는 아카라 쇼룸도 순번 핀으로
      const m=new naver.maps.Marker({map:MAP,position:LL(s.lat,s.lng),zIndex:big?1000:100,
        icon:{content:pinHtml(s),anchor:new naver.maps.Point(big?23:14,big?23:14)}});
      naver.maps.Event.addListener(m,'click',()=>{ openInfo(s.id); setActive(s.id,true); }); MARK[s.id]=m;
    });
    updLoc();   // 코스 보기로 들어오고 나갈 때 '다음 매장' 바도 같이 켜고 끈다
  }
  function focusSpot(id,fromList){ const s=SPOTS.find(x=>x.id===id); if(!s) return; unfollow();
    if(!MARK[id]){ FILTER='all'; AREA=null; paint(); paintMarkers(); }
    if(!MARK[id]) return;
    if(window.innerWidth<=860) setMobileView('map');   // 목록만 보던 중이면 지도로 되돌린다
    flyTo(s.lat,s.lng,17,700); setTimeout(()=>openInfo(id),520); setActive(id,!fromList);
  }
  function flyHQ(){ const s=SPOTS.find(x=>x.hl)||SPOTS.find(x=>x.cat==='iot'); if(s) focusSpot(s.id,true); }

  /* 목록 행은 div라서 클릭만으로는 키보드에서 열리지 않는다 → Enter·Space를 클릭과 똑같이 받는다 */
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ') return;
    const row=e.target.closest&&e.target.closest('.spot[data-id]');
    if(!row) return;
    e.preventDefault(); focusSpot(row.dataset.id,true);
  });

  /* 헤더 내비 — 이 페이지에 실제로 있는 곳으로만 보낸다 */
  function fitAll(){ const vs=visible(); if(!MAP||!vs.length) return; unfollow();
    fitSpots(vs,50,16); }
  function navMap(){ if(window.innerWidth<=860) setMobileView('map'); setActive(null,false); if(AREA){ AREA=null; paint(); paintMarkers(); } showResearch(false); fitAll(); }

  /* 모바일에서 지도↔목록 전환 — 지도가 화면 절반을 먹어 목록을 보려면 스크롤해야 하는 문제 해결 */
  function setMobileView(v){
    const w=document.getElementById('wrap'), listOnly=(v==='list');
    w.classList.toggle('list-only',listOnly);
    const a=document.getElementById('mtMap'), b=document.getElementById('mtList');
    if(a) a.classList.toggle('on',!listOnly); if(b) b.classList.toggle('on',listOnly);
    window.scrollTo({top:0,behavior:'smooth'});
    if(!listOnly&&MAP) setTimeout(()=>{ const m=document.getElementById('map'); MAP.setSize(new naver.maps.Size(m.offsetWidth,m.offsetHeight)); },60);   // 숨겼던 지도를 다시 보이면 크기를 다시 잡는다
  }
  function setActive(id,scroll){ ACTIVE=id;
    document.querySelectorAll('.spot').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
    document.querySelectorAll('.pin').forEach(el=>el.classList.remove('on'));
    if(id){ const p=document.querySelector('#map .pin[data-pid="'+id+'"]'); if(p) p.classList.add('on'); }
    if(id&&scroll){ const el=document.querySelector(`.spot[data-id="${id}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
  }

  /* ───────── 목록·필터 ───────── */
  function numbered(){ let n=1; return SPOTS.map(s=>Object.assign(s,{_no:s.hl?1:(++n)})); }   // 아카라라이프 쇼룸이 01, 나머지는 02부터
  function visible(){ const q=(document.getElementById('q').value||'').trim().toLowerCase();
    if(FILTER==='route'){ numbered(); return routeSpots(); }
    return numbered().filter(s=>(FILTER==='all'||s.cat===FILTER)&&inArea(s)&&(!q||[s.n,s.en,s.d,s.a,catOf(s.cat).ko,catOf(s.cat).en].join(' ').toLowerCase().includes(q))); }
  function setFilter(id){ FILTER=id==='route'?'route':CATS.some(c=>c.id===id)?id:'all'; if(FILTER==='route') showResearch(false); paint(); paintMarkers();
    if(FILTER==='route'){ fitRoute(); return; }
    const vs=visible(); if(vs.length&&FILTER!=='all'&&!AREA)fitSpots(vs,60,16); }
  function paint(){
    const all=numbered();
    // 카테고리 네비 — 알약 대신 01·02… 번호를 단 텍스트 인덱스
    document.getElementById('chips').innerHTML=[`<button class="cat ${FILTER==='all'?'on':''}" onclick="setFilter('all')"><span class="dot" style="background:var(--ink)"></span><span class="no">ALL</span>전체<span class="n">${all.length}</span></button>`]
      .concat(CATS.map((c,i)=>`<button class="cat ${FILTER===c.id?'on':''}" style="--c:${c.color}" onclick="setFilter('${c.id}')"><span class="dot"></span><span class="no">${no2(i+1)}</span>${esc(c.ko)}<span class="n">${all.filter(s=>s.cat===c.id).length}</span></button>`)).join('');
    // 한 줄로 밀어 넘기는 좁은 화면: 선택한 분류가 화면 밖에 있으면 보이는 곳으로 당겨온다
    // (scrollIntoView는 페이지 전체가 위아래로 움직일 수 있어 줄 안에서만 scrollLeft로 맞춘다)
    const chipBar=document.getElementById('chips'), chipOn=chipBar.querySelector('.cat.on');
    if(chipOn&&chipBar.scrollWidth>chipBar.clientWidth){ const l=chipOn.offsetLeft-chipBar.offsetLeft, r=l+chipOn.offsetWidth;
      if(l<chipBar.scrollLeft) chipBar.scrollLeft=l-18; else if(r>chipBar.scrollLeft+chipBar.clientWidth) chipBar.scrollLeft=r-chipBar.clientWidth+18; }
    const cd=document.getElementById('catdesc'), cc=CATS.find(c=>c.id===FILTER);
    renderMyBar();
    const ab=document.getElementById('areabar'), inArea=!!AREA&&FILTER!=='route';   // '이 지역 재검색' 결과임을 목록 위에 알린다
    ab.classList.toggle('show',inArea); if(inArea) ab.innerHTML=`<iconify-icon icon="lucide:map-pinned" aria-hidden="true"></iconify-icon><span>지금 지도 안의 매장 <b>${visible().length}곳</b></span><button onclick="clearArea()">전체 보기</button>`;
    cd.style.display=cc?'flex':'none'; if(cc) cd.style.setProperty('--c',cc.color); if(cc) cd.innerHTML=`<span class="dot" style="background:${cc.color}"></span><span><b>${esc(cc.en)}</b>${cc.desc?`<span class="ko">${esc(cc.desc)}</span>`:''}</span>`;
    if(FILTER==='route'){ cd.style.display='none'; document.getElementById('list').innerHTML=routeHtml(); return; }
    const vs=visible(), box=document.getElementById('list'); let html='';
    CATS.forEach((c,ci)=>{ const g=vs.filter(s=>s.cat===c.id); if(!g.length) return;   // 아카라 쇼룸(hl)도 일반 행으로 함께 보여준다
      html+=`<div class="sec" style="--c:${c.color}"><span class="no">${no2(ci+1)}</span><div><b>${esc(c.ko)}</b><em>${esc(c.en)}</em></div><i></i><span class="cnt">${g.length}곳</span></div>`;
      html+=g.map(s=>`<div class="spot ${s.hl?'hq':''} ${ACTIVE===s.id?'active':''}" style="--c:${c.color}" data-id="${s.id}" onclick="focusSpot('${s.id}',true)" role="button" tabindex="0" aria-label="${esc(s.n)} — 지도에서 보기">
        <div class="num">${no2(s._no)}</div>
        <div class="nm1">${esc(s.n)}${s.hl?'<span class="hqtag">웰컴 쿠폰</span>':''}${s.check?`<span class="chk">· ${esc(s.check)}</span>`:''}</div>
        ${saveBtn(s.id,'big')}
        <div class="ds1">${esc(s.d||'')}</div></div>`).join('');   // 목록은 번호·이름·한 줄 소개만 — 영문명·주소·네이버 링크는 지도 팝업에서
    });
    box.innerHTML=html?html+footHtml()
      :'<p class="empty">검색 결과가 없어요.<br>다른 단어로 찾아보세요.</p>';
  }
  function footHtml(){ const hq=(DATA.spots||[]).find(s=>s.hl)||{};
    return `<footer class="foot">
      <div class="ft"><img class="logo" src="aqaralife-logo-black.png" alt="AqaraLife"> SHOWROOM</div>
      <b>아카라라이프 쇼룸</b>
      <p>${esc(hq.a||'')}${hq.a?' · 학동역 도보 3분':''}</p>
      <div class="fa"><a class="btn sm" href="https://map.naver.com/p/search/${encodeURIComponent('아카라라이프')}" target="_blank" rel="noopener">길찾기 ↗</a></div>
      <p class="fn">${DATA.updated?`자료 기준 ${esc(DATA.updated)} · `:''}${esc(DATA.note||'')}</p>
    </footer>`; }

  /* ───────── 혜택 모달 · 쿠폰 발급 ───────── */
  let LAST_FOCUS=null;
  function openBenefit(){ LAST_FOCUS=document.activeElement;   // 닫을 때 원래 자리로 포커스를 돌려준다
    document.getElementById('ov').classList.add('show'); renderCoupon(); document.body.style.overflow='hidden';
    const x=document.querySelector('.md .x'); if(x) x.focus(); }
  function closeBenefit(){ const ov=document.getElementById('ov'); ov.classList.remove('show'); document.body.style.overflow='';
    if(MD_ORIG){ ov.querySelector('.hd').innerHTML=MD_ORIG[0]; ov.querySelector('.bd').innerHTML=MD_ORIG[1]; MD_ORIG=null; }
    if(LAST_FOCUS&&LAST_FOCUS.focus) LAST_FOCUS.focus(); LAST_FOCUS=null; }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeBenefit(); });
  function getCoupon(){ try{ const c=JSON.parse(localStorage.getItem('aqaraHakdongCoupon')||'null'); if(c&&c.code&&c.exp>Date.now()) return c; }catch(e){} return null; }
  function issueCoupon(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r=''; const a=new Uint8Array(6);
    if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<6;i++) a[i]=Math.floor(Math.random()*256);
    for(let i=0;i<6;i++) r+=chars[a[i]%chars.length];
    const c={code:'HD-'+r.slice(0,3)+'-'+r.slice(3),ts:Date.now(),exp:Date.now()+30*864e5,src:(new URLSearchParams(location.search).get('ref')||'web')};
    try{ localStorage.setItem('aqaraHakdongCoupon',JSON.stringify(c)); }catch(e){}
    try{ if(DB&&AUTH_OK) DB.ref('hakdong/coupons/'+c.code).set({ts:c.ts,exp:c.exp,src:c.src,mobile:window.innerWidth<=860?1:0}); }catch(e){}
    renderCoupon(); }
  /* ───────── 쿠폰 사용 완료 처리 ─────────
     쿠폰 QR = 이 페이지 주소 + ?redeem=코드. 스태프가 휴대폰 카메라로 찍으면 '사용 완료 처리' 화면이 열리고,
     누르면 Firebase hakdong/coupons/<코드>.used 에 시각이 찍힌다 → 손님 화면에 '사용 완료' 도장, ONLY MKT에서 방문 수로 집계 */
  const PAGE_URL=location.protocol==='file:'?'https://aqara-news-dashboard.vercel.app/hakdong.html':location.origin+location.pathname;
  const CODE_RE=/^HD-[A-Z0-9]{3}-[A-Z0-9]{3}$/;
  const REDEEM=(()=>{ const r=(new URLSearchParams(location.search).get('redeem')||'').trim().toUpperCase(); return CODE_RE.test(r)?r:null; })();
  let CP_WATCH=null;
  function watchCoupon(){ const c=getCoupon(); if(!c||!DB||!AUTH_OK||CP_WATCH===c.code) return; CP_WATCH=c.code;
    const ref=DB.ref('hakdong/coupons/'+c.code);
    ref.child('used').on('value',s=>{ const u=s.val(); const cur=getCoupon(); if(!cur||cur.code!==c.code) return;
      if((u||null)!==(cur.used||null)){ cur.used=u||null; try{ localStorage.setItem('aqaraHakdongCoupon',JSON.stringify(cur)); }catch(e){} if(document.getElementById('ov').classList.contains('show')) renderCoupon(); } });
  }
  const fmtDT=t=>{ const x=new Date(t); return x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0')+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'); };
  /* 방문 카운트: hakdong/stats/<KST 날짜>/{view, qr} — 리플릿·스탠드 QR(?ref=qr)로 들어온 횟수를 따로 센다.
     같은 탭에서 새로고침해도 한 번만(sessionStorage), 스태프 쿠폰 처리 화면(?redeem)은 세지 않는다 */
  function countVisit(){ if(!DB||REDEEM) return;
    try{ if(sessionStorage.getItem('aqaraHakdongCounted')) return; sessionStorage.setItem('aqaraHakdongCounted','1'); }catch(e){}
    const day=new Date(Date.now()+9*36e5).toISOString().slice(0,10), ref=DB.ref('hakdong/stats/'+day);
    const inc=k=>ref.child(k).transaction(n=>(n||0)+1).catch(()=>{});
    inc('view'); if((new URLSearchParams(location.search).get('ref')||'')==='qr') inc('qr'); }
  let MD_ORIG=null;   // 스태프 화면을 닫으면 원래 혜택 모달로 되돌린다
  function openRedeem(){ const ov=document.getElementById('ov');
    if(!MD_ORIG) MD_ORIG=[ov.querySelector('.hd').innerHTML,ov.querySelector('.bd').innerHTML];
    ov.querySelector('.hd').innerHTML=`<button class="x" onclick="closeBenefit()" aria-label="닫기">×</button><div class="ey">STAFF ONLY · 쇼룸 스태프 전용</div><h2 id="mdTitle">웰컴 쿠폰 사용 처리</h2><p>손님 쿠폰 QR을 찍으면 열리는 화면이에요. 혜택을 드린 뒤 아래 버튼을 눌러주세요.</p>`;
    ov.querySelector('.bd').innerHTML=`<div class="coupon"><div class="eyebrow">Welcome Coupon</div><div class="meta" style="margin-top:6px">${esc(REDEEM)}</div><div id="rdBody" class="meta" style="margin-top:10px">쿠폰 정보를 불러오는 중…</div></div>`;
    ov.classList.add('show'); document.body.style.overflow='hidden';
    if(AUTH_OK) loadRedeem(); else if(!DB) document.getElementById('rdBody').textContent='서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.'; }
  function loadRedeem(){ const box=document.getElementById('rdBody'); if(!box||!DB) return;
    DB.ref('hakdong/coupons/'+REDEEM).once('value').then(s=>{ const v=s.val();
      if(v&&v.used){ box.innerHTML=`<div class="used-stamp">사용 완료</div><p style="margin:8px 0 0">${fmtDT(v.used)}에 이미 사용 처리된 쿠폰이에요.</p>`; return; }
      const info=v?`발급 ${fmtDT(v.ts)} · ${v.exp>Date.now()?'유효':'<b style="color:#B3261E">유효기간 지남</b>'}`:'발급 기록을 찾지 못했어요(오프라인 발급일 수 있어요). 손님 화면의 코드와 같다면 처리해도 돼요.';
      box.innerHTML=`<p style="margin:0 0 14px">${info}</p><button class="btn primary" style="font-size:14px;padding:11px 22px" onclick="doRedeem()">사용 완료 처리</button>`;
    }).catch(()=>{ box.textContent='쿠폰 정보를 불러오지 못했어요. 잠시 후 다시 열어주세요.'; }); }
  function doRedeem(){ if(!confirm(REDEEM+' 쿠폰을 사용 완료로 처리할까요? 되돌릴 수 없어요.')) return;
    const ref=DB.ref('hakdong/coupons/'+REDEEM);
    ref.once('value').then(s=>{ const v=s.val()||{}; if(v.used) return; const up={used:Date.now()}; if(!v.ts){ up.ts=Date.now(); up.src='redeem'; } return ref.update(up); })
      .then(loadRedeem).catch(()=>alert('처리하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.')); }

  function renderCoupon(){ const box=document.getElementById('cpBody'), c=getCoupon();
    watchCoupon();
    if(c&&c.used){ box.innerHTML=`<div class="used-stamp">사용 완료</div>
      <div class="how">${fmtDT(c.used)} 쇼룸에서 사용하셨어요. 방문해 주셔서 감사합니다!</div>`; return; }
    if(!c){ box.innerHTML=`<p style="font-size:13px;color:#5E625F;margin:6px 0 12px">버튼을 누르면 이 휴대폰에 웰컴 쿠폰이 발급돼요.<br>쇼룸에서 쿠폰 화면만 보여주시면 끝!</p>
      <button class="btn primary" style="font-size:14px;padding:11px 22px" onclick="issueCoupon()">웰컴 쿠폰 발급받기</button>`; return; }
    // 스태프가 QR만 찍으면 되므로 코드·발급일 문구는 보여주지 않는다(코드는 QR 주소 안에 들어 있음)
    box.innerHTML=`<div id="qr"></div><div class="how">쇼룸 방문 시 이 QR을 스태프에게 보여주세요.<br><b>아카라라이프 쇼룸</b> · 학동역 도보 3분 · 논현로127길 13-11</div>
      <div style="margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="btn sm" onclick="closeBenefit();flyHQ()">쇼룸 위치 보기</button><a class="btn sm" href="https://map.naver.com/p/search/${encodeURIComponent('아카라라이프')}" target="_blank" rel="noopener">길찾기 ↗</a></div>`;
    try{ new QRCode(document.getElementById('qr'),{text:PAGE_URL+'?redeem='+c.code,width:112,height:112,colorDark:'#382D18',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ const q=document.getElementById('qr'); if(q) q.style.display='none'; }
  }
  function copyCode(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('쿠폰 코드가 복사됐어요: '+t)).catch(()=>prompt('쿠폰 코드',t)); }

  /* ───────── 첫 방문 튜토리얼 ─────────
     처음 연 사람에게만 4단계로 화면 요소를 비춰 준다(localStorage aqaraHakdongTour). ?tour=1 이면 다시 보기.
     구멍(spot) = 대상 위치에 맞춘 투명 상자 + 바깥을 어둡게 덮는 큰 그림자 */
  const TOUR_KEY='aqaraHakdongTour';
  const TOUR=[
    {sel:'.tools', t:'보고 싶은 쇼룸 찾기', d:'브랜드나 품목으로 검색하거나, 카테고리를 눌러 원하는 쇼룸만 골라 보세요.'},
    {sel:'.list .spot:not(.hq)', t:'번호는 지도 핀과 같아요', d:'목록에서 매장을 누르면 지도에서 바로 위치를 보여 드려요. 번호와 색이 지도 핀과 같아요.'},
    {sel:'.list .spot:not(.hq) .save', t:'별을 눌러 내 코스에 담기', d:'가고 싶은 매장을 담아 두면 내 코스에서 걷는 순서와 도보 시간을 알려 드려요.'},
    {sel:'.hdr-nav .btn.primary', t:'쇼룸에 들러 웰컴 쿠폰 쓰기', d:'쿠폰을 받아 아카라라이프 쇼룸에 들르면 음료, 무료 견적, 후기 기프트를 드려요.'}
  ];
  let TI=-1;
  function startTour(){ if(document.getElementById('tour')) return;
    const el=document.createElement('div'); el.id='tour'; el.className='tour';
    el.innerHTML=`<div class="tour-hole"></div><div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourT"><p class="tour-step" id="tourS"></p><h3 id="tourT"></h3><p id="tourD"></p><div class="tour-acts"><button class="tour-skip" onclick="endTour()">건너뛰기</button><button class="btn primary" id="tourN" onclick="tourGo(TI+1)">다음</button></div></div>`;
    document.body.appendChild(el); TI=-1; tourGo(0); }
  function tourGo(i){ if(i>=TOUR.length) return endTour();
    let k=i; while(k<TOUR.length&&!visibleEl(document.querySelector(TOUR[k].sel))) k++;   // 화면에 없는 단계는 건너뛴다(모바일 등)
    if(k>=TOUR.length) return endTour(); TI=k;
    const s=TOUR[k], tgt=document.querySelector(s.sel);
    tgt.scrollIntoView({block:'nearest'});
    document.getElementById('tourS').textContent=(k+1)+' / '+TOUR.length;
    document.getElementById('tourT').textContent=s.t; document.getElementById('tourD').textContent=s.d;
    document.getElementById('tourN').textContent=k===TOUR.length-1?'시작하기':'다음';
    placeTour(); document.getElementById('tourN').focus(); }
  function visibleEl(e){ if(!e) return false; const r=e.getBoundingClientRect(); return r.width>0&&r.height>0; }
  function placeTour(){ const box=document.getElementById('tour'); if(!box||TI<0) return;
    const tgt=document.querySelector(TOUR[TI].sel); if(!tgt) return;
    const r=tgt.getBoundingClientRect(), pad=6, hole=box.querySelector('.tour-hole'), card=box.querySelector('.tour-card');
    Object.assign(hole.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    const cw=card.offsetWidth, ch=card.offsetHeight, vw=innerWidth, vh=innerHeight, gap=14;
    let top=r.bottom+pad+gap; if(top+ch>vh-12) top=Math.max(12,r.top-pad-gap-ch);
    let left=Math.min(Math.max(12,r.left),vw-cw-12);
    card.style.left=left+'px'; card.style.top=top+'px'; }
  function endTour(){ const b=document.getElementById('tour'); if(b) b.remove(); TI=-1;
    try{ localStorage.setItem(TOUR_KEY,'1'); }catch(e){} }
  addEventListener('resize',placeTour); addEventListener('scroll',placeTour,true);
  document.addEventListener('keydown',e=>{ if(TI<0) return; if(e.key==='Escape') endTour(); else if(e.key==='ArrowRight'||e.key==='Enter'&&e.target.id!=='tourN') tourGo(TI+1); });
  function maybeTour(){ const p=new URLSearchParams(location.search);
    if(REDEEM||p.get('benefit')==='1'||p.get('route')) return;
    let seen=false; try{ seen=localStorage.getItem(TOUR_KEY)==='1'; }catch(e){}
    if(seen&&p.get('tour')!=='1') return;
    setTimeout(startTour,700); }
</script>
</body>
</html>
