<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>학동 스마트 인테리어 MAP · AQARA LIFE</title>
  <meta name="description" content="학동역~도산대로 인테리어 거리, 발품 파는 분들을 위한 쇼룸 가이드 지도. 타일·주방·스위치·가구 쇼룸 + 아카라라이프 쇼룸 웰컴 쿠폰." />
  <meta property="og:title" content="학동 스마트 인테리어 MAP · AQARA LIFE" />
  <meta property="og:description" content="쇼룸 투어 필수 지도 · 학동 인테리어 발품 길잡이. 아카라라이프 쇼룸에서 커피 한 잔 쉬어가세요." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase: ONLY MKT에서 고친 스팟 정보(hakdong/spots) 반영 + 쿠폰 발급 집계(hakdong/coupons). 연결 안 돼도 페이지는 동작 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    /* ─────────────────────────────────────────────────────────────────
       학동 스마트 인테리어 MAP
         톤     : 흑백 중심의 가라앉은 프리미엄 미니멀. 색은 '포인트'로만 쓴다
         구조   : 좌 = 다크 헤로 + 번호 인덱싱된 카탈로그 목록 / 우 = 지도(본체)
         기억점 : 01·02… 인덱스가 카테고리 네비 → 섹션 → 지도 핀까지 하나로 이어진다
       규칙
         - 카드 안에 카드 금지. 목록은 박스가 아니라 구분선 행이다
         - 지도 위에 띄우는 것은 범례뿐
         - 옐로(#FBC400)는 채움 전용. 밝은 배경 위 글자색으로 쓰지 않는다
         - 카테고리 색은 '작은 점·인덱스'에만. 면으로 칠하지 않는다
       ───────────────────────────────────────────────────────────────── */
    :root{
      /* 애플 스타일 뉴트럴 — 텍스트·보더는 무채색, 포인트만 아카라 옐로 */
      --bg:#F7F7F7; --paper:#FFFFFF;
      --ink:#1D1D1F; --ink2:#424245; --muted:#86868B;
      --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.16);
      --accent:#FBC400; --accent-soft:#FFF8E2; --on-accent:#1D1D1F;   /* 액센트는 브랜드 옐로 유지(애플 블루 대신) */
      --dark:#1D1D1F;
      /* 애플 시스템 폰트를 먼저 두되, 한글은 Pretendard가 받는다(-apple-system은 한글 커버가 약하다) */
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Pretendard Variable",Pretendard,"Helvetica Neue",Helvetica,Arial,"Malgun Gothic",sans-serif;
      --hdr:48px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);
      -webkit-font-smoothing:antialiased;letter-spacing:-0.01em;line-height:1.55;word-break:keep-all;font-feature-settings:"tnum" 1}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer}

    /* ─── 헤더 : 애플 글로벌 내비 (반투명 + 블러) ─── */
    header{position:sticky;top:0;z-index:9999;height:var(--hdr);background:rgba(255,255,255,.8);
      backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
      border-bottom:1px solid var(--line2);display:flex;align-items:center}
    .hdr-in{width:100%;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    .hdr-brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);white-space:nowrap;background:none;border:0;padding:0}
    .hdr-brand .mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:11px;flex:none}
    .hdr-nav{display:flex;gap:24px;align-items:center}
    .nav-link{font-size:12px;font-weight:400;color:var(--ink);opacity:.8;background:none;border:0;padding:0;transition:opacity .3s ease;white-space:nowrap;letter-spacing:-0.01em}
    .nav-link:hover{opacity:1}

    /* 캡슐 버튼 */
    .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:980px;padding:7px 16px;font-size:12px;font-weight:500;transition:all .2s ease;white-space:nowrap;line-height:1.2}
    .btn:hover{border-color:var(--ink)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
    .btn.primary:hover{background:#FFD22E;border-color:#FFD22E}
    .btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
    .btn.dark:hover{background:#3A3A3C;border-color:#3A3A3C}
    .btn.ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
    .btn.ghost:hover{background:#fff;border-color:#fff;color:var(--ink)}
    .btn.sm{padding:5px 13px;font-size:12px}

    /* ─── 레이아웃 ─── */
    .wrap{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}
    aside{background:var(--paper);display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}

    /* ─── 다크 헤로 : 사진 없이 타이포만으로 무게를 준다 ─── */
    .hero{background:var(--dark);color:#fff;padding:26px 24px 22px;position:relative;overflow:hidden}
    .hero:after{content:'';position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;background:var(--accent);opacity:.10;filter:blur(40px)}
    .hero .eyebrow{font-size:9px;font-weight:800;letter-spacing:.24em;color:var(--accent);display:flex;align-items:center;gap:8px;text-transform:uppercase}
    .hero .eyebrow:before{content:'';width:16px;height:2px;background:var(--accent);flex:none}
    .hero h1{margin:12px 0 0;font-size:28px;font-weight:800;letter-spacing:-0.045em;line-height:1.1}
    .hero .en{margin-top:7px;font-size:9.5px;font-weight:700;letter-spacing:.22em;color:#86868B;text-transform:uppercase}
    .hero p{margin:13px 0 0;font-size:12.5px;color:#A1A1A6;line-height:1.55;max-width:31em}
    .hero .meta{display:flex;align-items:baseline;gap:7px;margin-top:16px;padding-top:15px;border-top:1px solid rgba(255,255,255,.12)}
    .hero .meta .big{font-size:19px;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
    .hero .meta .lb{font-size:11px;color:#A1A1A6}
    .hero .cta{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}

    /* ─── 도구 : 검색 + 번호 매긴 카테고리 네비 ─── */
    .tools{padding:16px 24px 0;border-bottom:1px solid var(--line);background:var(--paper)}
    .search{position:relative}
    .search input{width:100%;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:9px 4px 9px 26px;font-size:13px;font-family:inherit;outline:none;color:var(--ink);transition:border-color .16s}
    .search input::placeholder{color:var(--muted)}
    .search input:focus{border-color:var(--ink)}
    .search svg{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
    /* 알약(pill)을 버리고 번호 매긴 텍스트 네비로 — 잡지 목차의 인덱스처럼 */
    .cats{display:flex;gap:0;margin:0 -24px;padding:10px 24px 0;overflow-x:auto;scrollbar-width:none}
    .cats::-webkit-scrollbar{display:none}
    .cat{flex:none;border:0;background:none;padding:9px 0 11px;margin-right:18px;display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;border-bottom:2px solid transparent;transition:color .16s,border-color .16s}
    .cat .no{font-size:9.5px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--line2);transition:color .16s}
    .cat .n{font-size:10px;font-variant-numeric:tabular-nums;color:var(--line2)}
    .cat:hover{color:var(--ink)}
    .cat:hover .no{color:var(--muted)}
    .cat.on{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
    .cat.on .no,.cat.on .n{color:var(--ink)}

    /* 카테고리 설명 — 한 줄, 박스 없이 */
    .catdesc{padding:11px 24px;font-size:12px;color:var(--ink2);background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
    .catdesc .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}

    /* ─── 목록 ─── */
    .list{overflow:auto;flex:1;min-height:0;padding:0 0 32px;scroll-behavior:smooth;background:var(--paper)}
    /* 섹션 = 잡지의 '챕터' */
    .sec{display:flex;align-items:flex-start;gap:12px;padding:26px 24px 12px;background:var(--paper);border-bottom:1px solid var(--ink)}
    .sec .no{font-size:11px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--c);padding-top:3px}
    .sec b{display:block;font-size:14px;font-weight:800;letter-spacing:-0.03em;line-height:1.3}
    .sec em{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .sec i{flex:1}
    .sec .cnt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}

    .spot{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .16s}
    .spot:before{content:'';position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:var(--accent);opacity:0;transition:opacity .16s}
    .spot:hover{background:#FAFAF9}
    .spot.active{background:var(--accent-soft)}
    .spot.active:before{opacity:1}
    .spot .num{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--line2);font-variant-numeric:tabular-nums;line-height:1.7;transition:color .16s}
    .spot:hover .num{color:var(--muted)}
    .spot.active .num{color:var(--ink)}
    .spot .en{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .spot .nm{font-size:15px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;margin:3px 0 6px;transition:color .16s}
    .spot:hover .nm{color:#000}
    .spot .chk{font-size:10.5px;color:var(--ink2);font-weight:600;margin-left:6px}
    /* 아카라 쇼룸 행 — 카드로 감싸지 않고 옐로 바와 작은 배지로만 구분한다 */
    .spot.hq{background:var(--accent-soft)}
    .spot.hq:before{opacity:1}
    .spot.hq .num{color:var(--ink)}
    .hqtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:980px;margin-left:7px;vertical-align:2px;white-space:nowrap}
    .spot .ds{font-size:12.5px;color:var(--ink2);line-height:1.6}
    .spot .ad{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:baseline}
    .spot .ad span{flex:1;min-width:0}
    .spot .ad .nv{color:var(--muted);font-weight:600;white-space:nowrap;flex:none;border-bottom:1px solid var(--line2);transition:.16s}
    .spot .ad .nv:hover{color:var(--ink);border-color:var(--ink)}
    .empty{margin:0;padding:52px 24px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.8}
    .empty b{color:var(--ink)}

    /* ─── 푸터 : 영업 정보 정리 ─── */
    .foot{padding:26px 24px 16px;background:var(--dark);color:#fff}
    .foot .ft{font-size:9px;font-weight:800;letter-spacing:.24em;color:var(--accent)}
    .foot b{display:block;font-size:14px;font-weight:800;letter-spacing:-0.03em;margin:6px 0 3px}
    .foot p{margin:0;font-size:11.5px;color:#A1A1A6;line-height:1.6}
    .foot .fa{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 13px}
    .foot .fn{font-size:10.5px;color:#86868B;line-height:1.6;padding-top:13px;border-top:1px solid rgba(255,255,255,.12)}

    /* ─── 지도 ─── */
    .mapwrap{position:relative;min-height:0;min-width:0;background:#F2F2F0}
    #map{position:absolute;inset:0;background:#F2F2F0}
    /* OSM 기본 타일을 Positron풍 무채색으로 — 채도를 죽이고 밝기를 올려 글자·도로를 눌러준다 */
    .leaflet-tile-pane{filter:grayscale(1) brightness(1.07) contrast(.86) opacity(.9)}
    .leaflet-container{font-family:inherit;background:#F2F2F0}
    .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7);color:var(--muted)}
    .leaflet-control-attribution a{color:var(--ink2)}
    .leaflet-bar a{border-radius:0;color:var(--ink);border-bottom-color:var(--line)}
    .pin{width:25px;height:25px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid #fff;box-shadow:0 2px 8px -1px rgba(0,0,0,.35);transition:transform .16s}
    .pin.on{transform:scale(1.3);border-color:var(--ink);box-shadow:0 5px 14px -3px rgba(0,0,0,.45)}
    .hqpin{position:relative;width:46px;height:46px}
    .hqpin .core{position:absolute;inset:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:8.5px;font-weight:900;letter-spacing:.04em;border:3px solid #fff;box-shadow:0 0 0 6px rgba(251,196,0,.26),0 6px 18px -5px rgba(0,0,0,.45);animation:pulse 2.4s ease-out infinite}
    .hqpin .wc{position:absolute;left:50%;top:-21px;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:9px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:3px;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(0,0,0,.45)}
    .hqpin .wc:after{content:'';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--dark);border-bottom:0}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,196,0,.5),0 6px 18px -5px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 20px rgba(251,196,0,0),0 6px 18px -5px rgba(0,0,0,.45)}}
    .leaflet-popup-content-wrapper{border-radius:4px;box-shadow:0 16px 44px -20px rgba(0,0,0,.4);padding:2px}
    .leaflet-popup-content{margin:13px 15px;font-size:12.5px;line-height:1.55;min-width:226px}
    .pp .en{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .pp .nm{font-size:15px;font-weight:700;letter-spacing:-0.03em;margin:3px 0 5px}
    .pp .ds{color:var(--ink2)}
    .pp .ad{color:var(--muted);font-size:11px;margin-top:5px}
    .pp .acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
    .badge-hl{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;background:var(--accent);color:var(--on-accent);padding:3px 7px;border-radius:3px;margin-bottom:5px}
    .legend{position:absolute;left:14px;bottom:14px;z-index:400;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-radius:4px;padding:11px 13px;font-size:10.5px;display:grid;gap:5px;box-shadow:0 4px 16px -8px rgba(0,0,0,.3)}
    .legend div{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600}
    .legend .dot{width:7px;height:7px;border-radius:50%}

    /* 모바일 전용 지도↔목록 전환 */
    .mtoggle{display:none;position:sticky;top:var(--hdr);z-index:30;background:var(--paper);border-bottom:1px solid var(--line);padding:0 16px}
    .mtoggle .seg{display:flex;flex:1;gap:22px}
    .mtoggle button{border:0;background:none;padding:12px 0;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:-0.01em;border-bottom:2px solid transparent;transition:.16s}
    .mtoggle button.on{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}

    /* ─── 쿠폰 모달 ─── */
    .ov{position:fixed;inset:0;background:rgba(38,35,29,.6);backdrop-filter:blur(5px);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
    .ov.show{display:flex}
    .md{background:var(--paper);border-radius:6px;width:min(600px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);position:relative}
    .md .hd{background:var(--dark);color:#fff;padding:28px 28px 24px;position:relative;overflow:hidden}
    .md .hd:before{content:'';position:absolute;right:-40px;top:-70px;width:210px;height:210px;border-radius:50%;background:var(--accent);opacity:.18;filter:blur(36px)}
    .md .hd .ey{font-size:9px;font-weight:800;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
    .md .hd h2{margin:11px 0 7px;font-size:25px;font-weight:800;letter-spacing:-0.045em;line-height:1.15}
    .md .hd p{margin:0;font-size:12.5px;color:#A1A1A6}
    .md .x{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;z-index:1}
    .md .bd{padding:20px 28px 28px}
    .bn{display:grid;grid-template-columns:40px 1fr;gap:13px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
    .bn:last-of-type{border-bottom:0}
    .bn .ic{width:40px;height:40px;border-radius:4px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px}
    .bn .k{font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
    .bn b{font-size:14.5px;font-weight:700;letter-spacing:-0.03em;display:block;margin-top:3px}
    .bn p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
    .bn .tg{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--on-accent);background:var(--accent-soft);border-radius:3px;padding:3px 7px;margin-top:7px}
    .coupon{margin-top:16px;border:1px solid var(--line2);border-radius:4px;padding:20px;background:var(--bg);text-align:center}
    .coupon .eyebrow{font-size:9px;font-weight:800;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
    .coupon .code{font-size:30px;font-weight:800;letter-spacing:.14em;margin:8px 0 3px;color:var(--ink)}
    .coupon .meta{font-size:11px;color:var(--muted)}
    .coupon #qr{display:inline-block;margin:13px auto 4px;padding:8px;background:#fff;border-radius:4px;border:1px solid var(--line)}
    .coupon #qr img,.coupon #qr canvas{display:block}
    .coupon .how{font-size:12px;color:var(--ink2);margin-top:9px;line-height:1.6}
    .fine{font-size:10.5px;color:var(--muted);margin-top:16px;line-height:1.6}

    /* ─── 모바일 ─── */
    @media (max-width:860px){
      :root{--hdr:52px}
      .hdr-in{padding:0 14px;gap:10px}
      .hdr-nav{gap:0}
      .hdr-nav .nav-link{display:none}   /* 모바일은 아래 지도/목록 탭이 대신한다 */
      .wrap{grid-template-columns:1fr;grid-template-rows:38vh minmax(0,1fr);height:auto;min-height:calc(100dvh - var(--hdr))}
      .wrap.list-only{grid-template-rows:0 minmax(0,1fr)}
      .wrap.list-only .mapwrap{display:none}
      aside{order:2;border-right:0}
      .mapwrap{order:1}
      .hero{padding:22px 18px 20px}
      .hero h1{font-size:23px}
      .hero p{font-size:12px}
      .tools{padding:14px 18px 0}
      .cats{margin:0 -18px;padding:10px 18px 0}
      .sec{padding:22px 18px 11px}
      .spot{padding:15px 18px}
      .catdesc,.foot{padding-left:18px;padding-right:18px}
      .list{overflow:visible}
      .legend{display:none}
      .mtoggle{display:flex}
    }
  </style>
</head>
<body>
  <header>
    <div class="hdr-in">
      <button class="hdr-brand" onclick="navHome()"><span class="mark">A</span>학동 MAP</button>
      <nav class="hdr-nav">
        <button class="nav-link" onclick="navMap()">지도 전체 보기</button>
        <button class="nav-link" onclick="flyHQ()">아카라라이프 쇼룸</button>
        <button class="btn primary sm" onclick="openBenefit()">웰컴 쿠폰 받기</button>
      </nav>
    </div>
  </header>

  <div class="wrap" id="wrap">
    <aside>
      <div class="mtoggle" id="mtoggle">
        <div class="seg">
          <button id="mtMap" class="on" onclick="setMobileView('map')">지도 보기</button>
          <button id="mtList" onclick="setMobileView('list')">목록 · 검색</button>
        </div>
      </div>
      <!-- 다크 헤로 : 사진 없이 타이포만으로 무게를 준다. 쇼룸 CTA도 여기로 합쳤다 -->
      <div class="hero">
        <div class="eyebrow">AQARA LIFE · SHOWROOM GUIDE</div>
        <h1 id="ttl">학동 스마트 인테리어 MAP</h1>
        <div class="en" id="heroSub2">Hakdong Interior Showroom Map</div>
        <p id="sub">학동역 ~ 도산대로 · 발품 파는 분들을 위한 인테리어 쇼룸 가이드</p>
        <div class="meta"><span class="big" id="cntAll">–</span><span class="lb">곳의 쇼룸 · 아카라라이프 쇼룸 학동역 도보 3분</span></div>
        <div class="cta">
          <button class="btn primary sm" onclick="openBenefit()">🎟️ 웰컴 쿠폰 받기</button>
          <button class="btn ghost sm" onclick="flyHQ()">아카라라이프 쇼룸 →</button>
        </div>
      </div>
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="브랜드 · 타일 · 주방 · 소파 … 검색" oninput="paint()" />
        </div>
        <nav class="cats" id="chips"></nav>
      </div>
      <div class="catdesc" id="catdesc"></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- 혜택 모달 -->
  <div class="ov" id="ov" onclick="if(event.target===this)closeBenefit()">
    <div class="md" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
      <div class="hd">
        <button class="x" onclick="closeBenefit()" aria-label="닫기">×</button>
        <div class="ey">AQARA LIFE SHOWROOM · 학동역 도보 3분</div>
        <h2 id="mdTitle">학동 쇼룸 투어 웰컴 쿠폰</h2>
        <p>학동 인테리어 거리를 돌아보시는 분들께 드려요. 쿠폰 받고 아카라라이프 쇼룸에서 쉬었다 가세요.</p>
      </div>
      <div class="bd">
        <div id="bnList"></div>
        <div class="coupon" id="coupon">
          <div class="eyebrow">Welcome Coupon</div>
          <div id="cpBody"></div>
        </div>
        <p class="fine" id="hqAddr"></p>
      </div>
    </div>
  </div>

<script>
  /* ───────── 데이터 ───────── */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAs_yQ1fgGKfRDKbkUb0lviIoJ2e00KRGA",
    authDomain: "aqara-weekly-1227c.firebaseapp.com",
    databaseURL: "https://aqara-weekly-1227c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "aqara-weekly-1227c",
    storageBucket: "aqara-weekly-1227c.firebasestorage.app",
    messagingSenderId: "869711080033",
    appId: "1:869711080033:web:9fc6fb53b272b942085820"
  };
  let DB=null, AUTH_OK=false;
  try{
    if(typeof firebase!=='undefined'){
      firebase.initializeApp(FIREBASE_CONFIG); DB=firebase.database();
      firebase.auth().signInAnonymously().catch(()=>{});
      firebase.auth().onAuthStateChanged(u=>{ AUTH_OK=!!u; if(u) watchOverrides(); });
    }
  }catch(e){ DB=null; }

  let DATA=null, SPOTS=[], CATS=[], OVER={}, MAP=null, MARK={}, FILTER='all', ACTIVE=null;
  const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const catOf=id=>CATS.find(c=>c.id===id)||{color:'#BFA97C',en:'',ko:''};
  // 네이버지도는 '상호+주소'를 같이 넣으면 '조건에 맞는 업체가 없습니다'가 뜬다 → 업체명만 검색(괄호 속 영문 표기는 제거)
  const naverUrl=s=>s.np?('https://map.naver.com/p/entry/place/'+encodeURIComponent(s.np)):('https://map.naver.com/p/search/'+encodeURIComponent(naverName(s)));   // np = 네이버 플레이스 ID(검증 완료분) → 바로 그 업체로
  const naverName=s=>(s.n||'').replace(/\s*\([^)]*\)/g,'').replace(/\s*(플래그십|브랜드)?\s*(쇼룸|갤러리|스토어 서울)$/,'').trim()||s.n;
  const no2=n=>String(n).length<2?'0'+n:String(n);   // 카탈로그 목차처럼 01, 02 … 두 자리로

  fetch('hakdong.json?_='+Date.now()).then(r=>r.json()).then(d=>{ DATA=d; CATS=d.categories; boot(); })
    .catch(()=>{ document.getElementById('list').innerHTML='<p style="padding:30px;text-align:center;color:#382D18">자료를 불러오지 못했어요. 새로고침해 주세요.</p>'; });

  /* ONLY MKT에서 고친 스팟 정보(좌표·설명·사진·숨김)를 얹는다 — 없으면 json 원본 그대로 */
  function watchOverrides(){ if(!DB) return;
    DB.ref('hakdong/spots').on('value',s=>{ OVER=s.val()||{}; if(DATA) applyOver(); });
  }
  function applyOver(){
    SPOTS=DATA.spots.map(s=>Object.assign({},s,OVER[s.id]||{}));
    Object.keys(OVER).forEach(id=>{ if(!DATA.spots.some(s=>s.id===id)&&OVER[id]&&OVER[id].n) SPOTS.push(Object.assign({id},OVER[id])); });
    SPOTS=SPOTS.filter(s=>!s.hide&&isFinite(+s.lat)&&isFinite(+s.lng));
    paint(); paintMarkers();
  }

  function boot(){
    document.getElementById('ttl').textContent=DATA.title||'학동 스마트 인테리어 MAP';
    document.title=(DATA.title||'학동 스마트 인테리어 MAP')+' · AQARA LIFE';
    if(DATA.subtitle) document.getElementById('sub').textContent=DATA.subtitle;
    document.getElementById('legend').innerHTML=CATS.map(c=>`<div><span class="dot" style="background:${c.color}"></span>${esc(c.ko)}</div>`).join('');
    document.getElementById('bnList').innerHTML=(DATA.benefits||[]).map(b=>`<div class="bn"><div class="ic">${b.icon||'🎁'}</div><div><div class="k">${esc(b.k||'')}</div><b>${esc(b.t)}</b><p>${esc(b.d)}</p>${b.tag?`<span class="tg">${esc(b.tag)}</span>`:''}</div></div>`).join('');
    const hq=DATA.spots.find(s=>s.hl)||DATA.spots.find(s=>s.cat==='iot')||{};
    document.getElementById('hqAddr').innerHTML=`📍 아카라라이프 쇼룸 · ${esc(hq.a||'')}<br>${esc(DATA.note||'')}<br>쿠폰은 발급일로부터 30일간 유효해요. 다른 혜택과 중복 적용되지 않을 수 있으며, 증정·할인 혜택의 상세 조건은 쇼룸에서 안내드려요.`;
    initMap(); applyOver();
    const p=new URLSearchParams(location.search);
    if(p.get('cat')) setFilter(p.get('cat'));
    if(p.get('spot')) setTimeout(()=>focusSpot(p.get('spot')),400);
    if(p.get('benefit')==='1') openBenefit();
  }

  /* ───────── 지도 ───────── */
  function initMap(){
    const hq=DATA.hq||{lat:37.5145,lng:127.031};
    MAP=L.map('map',{zoomControl:false,scrollWheelZoom:true,attributionControl:true}).setView([hq.lat+0.005,hq.lng+0.009],15);
    L.control.zoom({position:'topright'}).addTo(MAP);
    // 타일은 OSM 기본(키 불필요). CARTO Positron은 2026년부터 API 키를 요구해 쓸 수 없다.
    // 대신 CSS 필터로 무채색·저채도로 눌러 Positron에 가까운 톤을 만든다(.leaflet-tile-pane)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAP);
    MAP.on('popupclose',()=>{ setActive(null,false); });
  }
  function pinHtml(s){ const c=catOf(s.cat);
    return s.hl?`<div class="hqpin"><span class="wc">🎟️ Welcome Coupon</span><div class="core">AQARA</div></div>`:`<div class="pin" style="--c:${c.color}">${no2(s._no)}</div>`; }
  function popupHtml(s){ const c=catOf(s.cat);
    return `<div class="pp" style="--c:${c.color}">${s.hl?'<span class="badge-hl">☕ 웰컴 쿠폰 · 커피 한 잔 쉬어가세요</span><br>':''}<span class="en">${esc(s.en||'')}</span>
      <div class="nm">${esc(s.n)}</div>
      <div class="ds">${esc(s.d||'')}</div><div class="ad">📍 ${esc(s.a||'')}</div>
      <div class="acts">${s.hl?`<button class="btn primary sm" onclick="openBenefit()">🎟️ 웰컴 쿠폰</button>`:''}<a class="btn sm" href="${naverUrl(s)}" target="_blank" rel="noopener">네이버지도 ↗</a></div></div>`; }
  function paintMarkers(){
    Object.values(MARK).forEach(m=>MAP.removeLayer(m)); MARK={};
    visible().forEach(s=>{
      const icon=L.divIcon({className:'',html:pinHtml(s),iconSize:s.hl?[48,48]:[26,26],iconAnchor:s.hl?[24,24]:[13,13],popupAnchor:[0,s.hl?-44:-14]});
      const m=L.marker([+s.lat,+s.lng],{icon,zIndexOffset:s.hl?1000:0,riseOnHover:true}).addTo(MAP).bindPopup(popupHtml(s),{maxWidth:300});
      m.on('click',()=>setActive(s.id,true)); MARK[s.id]=m;
    });
  }
  function focusSpot(id,fromList){ const s=SPOTS.find(x=>x.id===id); if(!s) return;
    if(!MARK[id]){ FILTER='all'; paint(); paintMarkers(); }
    const mm=MARK[id]; if(!mm) return;
    if(window.innerWidth<=860) setMobileView('map');   // 목록만 보던 중이면 지도로 되돌린다
    MAP.flyTo([+s.lat,+s.lng],17,{duration:.7}); setTimeout(()=>mm.openPopup(),520); setActive(id,!fromList);
  }
  function flyHQ(){ const s=SPOTS.find(x=>x.hl)||SPOTS.find(x=>x.cat==='iot'); if(s) focusSpot(s.id,true); }

  /* 헤더 내비 — 이 페이지에 실제로 있는 곳으로만 보낸다 */
  function fitAll(){ const vs=visible(); if(!MAP||!vs.length) return;
    MAP.fitBounds(L.latLngBounds(vs.map(s=>[+s.lat,+s.lng])).pad(0.15),{maxZoom:16}); }
  function navMap(){ if(window.innerWidth<=860) setMobileView('map'); setActive(null,false); fitAll(); }
  function navHome(){ const q=document.getElementById('q'); if(q) q.value=''; setFilter('all'); navMap(); }

  /* 모바일에서 지도↔목록 전환 — 지도가 화면 절반을 먹어 목록을 보려면 스크롤해야 하는 문제 해결 */
  function setMobileView(v){
    const w=document.getElementById('wrap'), listOnly=(v==='list');
    w.classList.toggle('list-only',listOnly);
    const a=document.getElementById('mtMap'), b=document.getElementById('mtList');
    if(a) a.classList.toggle('on',!listOnly); if(b) b.classList.toggle('on',listOnly);
    window.scrollTo({top:0,behavior:'smooth'});
    if(!listOnly&&MAP) setTimeout(()=>MAP.invalidateSize(),60);
  }
  function setActive(id,scroll){ ACTIVE=id;
    document.querySelectorAll('.spot').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
    document.querySelectorAll('.pin').forEach(el=>el.classList.remove('on'));
    if(id&&MARK[id]){ const el=MARK[id].getElement(); if(el){ const p=el.querySelector('.pin'); if(p) p.classList.add('on'); } }
    if(id&&scroll){ const el=document.querySelector(`.spot[data-id="${id}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
  }

  /* ───────── 목록·필터 ───────── */
  function numbered(){ let n=0; return SPOTS.map(s=>Object.assign(s,{_no:s.hl?'A':(++n)})); }
  function visible(){ const q=(document.getElementById('q').value||'').trim().toLowerCase();
    return numbered().filter(s=>(FILTER==='all'||s.cat===FILTER)&&(!q||[s.n,s.en,s.d,s.a,catOf(s.cat).ko,catOf(s.cat).en].join(' ').toLowerCase().includes(q))); }
  function setFilter(id){ FILTER=CATS.some(c=>c.id===id)?id:'all'; paint(); paintMarkers();
    const vs=visible(); if(vs.length&&FILTER!=='all'){ const b=L.latLngBounds(vs.map(s=>[+s.lat,+s.lng])); MAP.fitBounds(b.pad(0.25),{maxZoom:16}); } }
  function paint(){
    const all=numbered();
    document.getElementById('cntAll').textContent=all.length;
    // 카테고리 네비 — 알약 대신 01·02… 번호를 단 텍스트 인덱스
    document.getElementById('chips').innerHTML=[`<button class="cat ${FILTER==='all'?'on':''}" onclick="setFilter('all')"><span class="no">ALL</span>전체<span class="n">${all.length}</span></button>`]
      .concat(CATS.map((c,i)=>`<button class="cat ${FILTER===c.id?'on':''}" style="--c:${c.color}" onclick="setFilter('${c.id}')"><span class="no">${no2(i+1)}</span>${esc(c.ko)}<span class="n">${all.filter(s=>s.cat===c.id).length}</span></button>`)).join('');
    const cd=document.getElementById('catdesc'), cc=CATS.find(c=>c.id===FILTER);
    cd.style.display=cc?'flex':'none'; if(cc) cd.innerHTML=`<span class="dot" style="background:${cc.color}"></span><span><b>${esc(cc.en)}</b> · ${esc(cc.desc||'')}</span>`;
    const vs=visible(), box=document.getElementById('list'); let html='';
    CATS.forEach((c,ci)=>{ const g=vs.filter(s=>s.cat===c.id); if(!g.length) return;   // 아카라 쇼룸(hl)도 일반 행으로 함께 보여준다
      html+=`<div class="sec" style="--c:${c.color}"><span class="no">${no2(ci+1)}</span><div><b>${esc(c.ko)}</b><em>${esc(c.en)}</em></div><i></i><span class="cnt">${g.length}곳</span></div>`;
      html+=g.map(s=>`<div class="spot ${s.hl?'hq':''} ${ACTIVE===s.id?'active':''}" style="--c:${c.color}" data-id="${s.id}" onclick="focusSpot('${s.id}',true)">
        <div class="num">${s.hl?'★':no2(s._no)}</div>
        <div><span class="en">${esc(s.en||'')}</span>
          <div class="nm">${esc(s.n)}${s.hl?'<span class="hqtag">웰컴 쿠폰</span>':''}${s.check?`<span class="chk">· ${esc(s.check)}</span>`:''}</div>
          <div class="ds">${esc(s.d||'')}</div>
          <div class="ad"><span>${esc(s.a||'')}</span><a class="nv" href="${naverUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">네이버 ↗</a></div>
        </div></div>`).join('');
    });
    box.innerHTML=html?html+footHtml()
      :'<p class="empty">검색 결과가 없어요.<br>다른 단어로 찾아보세요.</p>';
  }
  function footHtml(){ const hq=(DATA.spots||[]).find(s=>s.hl)||{};
    return `<footer class="foot">
      <div class="ft">AQARA LIFE SHOWROOM</div>
      <b>아카라라이프 쇼룸</b>
      <p>${esc(hq.a||'')}${hq.a?' · 학동역 도보 3분':''}</p>
      <div class="fa"><button class="btn sm" onclick="openBenefit()">🎟️ 웰컴 쿠폰</button><button class="btn sm" onclick="flyHQ()">쇼룸 위치</button><a class="btn sm" href="https://map.naver.com/p/search/${encodeURIComponent('아카라라이프')}" target="_blank" rel="noopener">길찾기 ↗</a></div>
      <p class="fn">${DATA.updated?`자료 기준 ${esc(DATA.updated)} · `:''}${esc(DATA.note||'')}</p>
    </footer>`; }

  /* ───────── 혜택 모달 · 쿠폰 발급 ───────── */
  function openBenefit(){ document.getElementById('ov').classList.add('show'); renderCoupon(); document.body.style.overflow='hidden'; }
  function closeBenefit(){ document.getElementById('ov').classList.remove('show'); document.body.style.overflow=''; }
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeBenefit(); });
  function getCoupon(){ try{ const c=JSON.parse(localStorage.getItem('aqaraHakdongCoupon')||'null'); if(c&&c.code&&c.exp>Date.now()) return c; }catch(e){} return null; }
  function issueCoupon(){
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r=''; const a=new Uint8Array(6);
    if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<6;i++) a[i]=Math.floor(Math.random()*256);
    for(let i=0;i<6;i++) r+=chars[a[i]%chars.length];
    const c={code:'HD-'+r.slice(0,3)+'-'+r.slice(3),ts:Date.now(),exp:Date.now()+30*864e5};
    try{ localStorage.setItem('aqaraHakdongCoupon',JSON.stringify(c)); }catch(e){}
    try{ if(DB&&AUTH_OK) DB.ref('hakdong/coupons/'+c.code).set({ts:c.ts,exp:c.exp,src:(new URLSearchParams(location.search).get('ref')||'web'),mobile:window.innerWidth<=860?1:0}); }catch(e){}
    renderCoupon(); }
  function renderCoupon(){ const box=document.getElementById('cpBody'), c=getCoupon();
    if(!c){ box.innerHTML=`<p style="font-size:13px;color:#5E625F;margin:6px 0 12px">버튼을 누르면 이 휴대폰에 웰컴 쿠폰이 발급돼요. 쇼룸에서 쿠폰 화면만 보여주시면 끝!</p>
      <button class="btn primary" style="font-size:14px;padding:11px 22px" onclick="issueCoupon()">🎟️ 웰컴 쿠폰 발급받기</button>`; return; }
    const d=new Date(c.ts), e=new Date(c.exp), f=x=>x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0');
    box.innerHTML=`<div class="code">${esc(c.code)}</div><div class="meta">발급 ${f(d)} · ${f(e)}까지 사용 가능 · 웰컴 음료 + 도면 배선 상담 + 스마트 센서 증정/패키지 할인</div>
      <div id="qr"></div><div class="how">쇼룸 방문 시 이 화면(코드 또는 QR)을 스태프에게 보여주세요.<br><b>아카라라이프 쇼룸</b> · 학동역 도보 3분 · 논현로127길 13-11</div>
      <div style="margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="btn sm" onclick="copyCode('${esc(c.code)}')">코드 복사</button><button class="btn sm" onclick="closeBenefit();flyHQ()">쇼룸 위치 보기</button><a class="btn sm" href="https://map.naver.com/p/search/${encodeURIComponent('아카라라이프')}" target="_blank" rel="noopener">길찾기 ↗</a></div>`;
    try{ new QRCode(document.getElementById('qr'),{text:'AQARA-HAKDONG '+c.code,width:112,height:112,colorDark:'#382D18',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ const q=document.getElementById('qr'); if(q) q.style.display='none'; }
  }
  function copyCode(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('쿠폰 코드가 복사됐어요: '+t)).catch(()=>prompt('쿠폰 코드',t)); }
</script>
