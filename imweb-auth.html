<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아임웹 연동 · 인증 코드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body{margin:0;background:#F4F4F2;color:#1D1D1F;font-family:"Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;line-height:1.6;}
  .box{background:#fff;border:1px solid #E6E6E3;border-radius:18px;padding:32px;max-width:620px;width:100%;
       box-shadow:0 1px 3px rgba(38,40,42,.06);}
  h1{font-size:20px;margin:0 0 6px;font-weight:800;}
  p{color:#6E6E73;font-size:14px;margin:0 0 18px;}
  .code{background:#FFFDF3;border:2px solid #FBC400;border-radius:12px;padding:16px;font-family:ui-monospace,Consolas,monospace;
        font-size:15px;word-break:break-all;color:#8A6A00;font-weight:600;}
  button{margin-top:14px;background:#FBC400;border:0;border-radius:10px;padding:11px 18px;font-weight:700;color:#5a4a00;
         font-size:14px;cursor:pointer;font-family:inherit;}
  button:hover{filter:brightness(.96);}
  ol{font-size:13px;color:#6E6E73;padding-left:20px;margin:18px 0 0;}
  code{background:#F4F4F2;padding:1px 5px;border-radius:4px;font-size:12px;}
  .err{background:#FDF1EE;border:1px solid #BF5332;color:#BF5332;border-radius:12px;padding:16px;font-size:14px;}
  a{color:#8A6A00;}
</style>
</head>
<body>
  <div class="box">
    <h1>아임웹 연동 · 인증 코드</h1>
    <p>아래 인증 코드를 복사해 <code>crawler/imweb-token.bat</code>에 붙여넣으면 refresh token이 발급됩니다.</p>
    <div id="out"></div>
    <ol>
      <li>이 코드는 <b>수 분 내에 만료</b>됩니다. 바로 다음 단계를 진행하세요.</li>
      <li><code>AqaraNewsMonitor\web\crawler\imweb-token.bat</code> 더블클릭 → Client ID · Secret · 이 코드 입력</li>
      <li>출력된 <b>refresh token</b>을 GitHub 저장소 Settings → Secrets → <code>IMWEB_REFRESH_TOKEN</code>에 등록</li>
    </ol>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get('code');
  var errCode = q.get('errorCode') || q.get('error');
  var errMsg = q.get('message') || q.get('error_description') || '';
  // 아임웹이 돌려주는 대표 오류에 대한 해결 안내
  var HINT = {
    '30132': '아임웹 개발자센터에서 이 앱에 <b>아카라라이프 사이트를 연동(테스트 사이트 추가)</b>해야 합니다. 앱 상세 화면의 “사이트 연동 / 테스트 사이트” 메뉴에서 사이트를 추가한 뒤 다시 시도하세요.',
    '30099': '요청한 권한(scope)이 앱에 허용돼 있지 않습니다. 앱 권한에서 <b>커뮤니티 읽기 · 사이트 정보 읽기</b>를 켜주세요.',
    '30123': '앱에 등록한 <b>리다이렉트 URI</b>가 달라서 거부됐습니다. <code>https://aqara-news-dashboard.vercel.app/imweb-auth.html</code> 와 완전히 같은지 확인하세요.',
    '30098': '<b>Client ID</b>가 올바르지 않습니다. 개발자센터의 값을 다시 복사해 주세요.'
  };
  var out = document.getElementById('out');
  if (code) {
    out.innerHTML = '<div class="code" id="c">' + code.replace(/[<>&]/g, '') + '</div>' +
                    '<button onclick="cp()">코드 복사</button> <span id="msg" style="font-size:13px;color:#5E7350"></span>';
  } else if (errCode || errMsg) {
    var hint = HINT[errCode] ? '<div style="margin-top:10px;font-size:13px;color:#6E6E73;line-height:1.6">→ ' + HINT[errCode] + '</div>' : '';
    out.innerHTML = '<div class="err"><b>인증 실패</b> (코드 ' + String(errCode || '-').replace(/[<>&]/g, '') + ')<br>' +
                    String(errMsg).replace(/[<>&]/g, '') + hint + '</div>';
  } else {
    out.innerHTML = '<div class="err">인증 코드가 없습니다. 아임웹 인증 링크를 통해 다시 접속하세요.</div>';
  }
  function cp(){
    var t = document.getElementById('c').textContent;
    navigator.clipboard.writeText(t).then(function(){ document.getElementById('msg').textContent = '복사됨'; });
  }
</script>
</body>
</html>
