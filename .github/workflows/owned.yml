name: Owned Media

# 자사 채널(유튜브·인스타·블로그) 지표 수집 → owned.json
# 하루 2회: 한국 07:50 / 18:50 — 오후에 올린 블로그 글이 다음 날 아침에는 반영되도록
on:
  schedule:
    - cron: '50 9 * * *'    # 18:50 KST
    - cron: '50 22 * * *'   # 07:50 KST
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/owned.yml'
      - 'crawler/owned_fetch.py'

permissions:
  contents: write

concurrency:
  group: owned-media
  cancel-in-progress: false

jobs:
  owned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch owned media stats
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
        run: python crawler/owned_fetch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add owned.json owned_history.json content_history.json
          git diff --staged --quiet || git commit -m "owned.json 자동 갱신"
          git push
