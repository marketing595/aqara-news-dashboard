name: Homepage Inquiries

# 매일 22:10(UTC)=한국 07:10 아임웹 홈페이지 문의(입력폼 제출) 수집 → homepage.json
on:
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/homepage.yml'
      - 'crawler/imweb_fetch.py'

permissions:
  contents: write

concurrency:
  group: homepage-inquiries
  cancel-in-progress: false

jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch imweb form submissions
        env:
          IMWEB_CLIENT_ID: ${{ secrets.IMWEB_CLIENT_ID }}
          IMWEB_CLIENT_SECRET: ${{ secrets.IMWEB_CLIENT_SECRET }}
          IMWEB_REFRESH_TOKEN: ${{ secrets.IMWEB_REFRESH_TOKEN }}
          IMWEB_UNIT_CODE: ${{ secrets.IMWEB_UNIT_CODE }}
        run: python crawler/imweb_fetch.py
      # 아임웹 refresh token은 갱신 시 값이 바뀔 수 있어 Secret으로 되돌려 저장한다.
      # GH_PAT(repo 권한 PAT)이 없으면 이 단계는 건너뛴다 → 90일마다 수동 재발급 필요.
      - name: Rotate refresh token secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -s .imweb_refresh ] && [ -n "$GH_PAT" ]; then
            GH_TOKEN=$GH_PAT gh secret set IMWEB_REFRESH_TOKEN < .imweb_refresh
            echo "refresh token 갱신 완료"
          else
            echo "갱신 건너뜀 (GH_PAT 미설정이거나 토큰 변경 없음)"
          fi
      - name: Commit if changed
        run: |
          rm -f .imweb_refresh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homepage.json
          git diff --staged --quiet || git commit -m "homepage.json 자동 갱신"
          git push
